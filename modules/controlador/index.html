<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prof GB · Controlador</title>
    <meta name="description" content="Prof GB — assistente inteligente para planejamento e organização do trabalho docente.">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    <link rel="stylesheet" href="../../styles/tokens.css">
    <link rel="stylesheet" href="../../styles/reset.css">
    <link rel="stylesheet" href="../../styles/base.css">
    <link rel="stylesheet" href="../../styles/layout.css">
    <link rel="stylesheet" href="../../styles/components/alert.css">
    <link rel="stylesheet" href="../../styles/components/card.css">
    <link rel="stylesheet" href="../../styles/components/button.css">
    <link rel="stylesheet" href="../../styles/components/filter.css">
    <link rel="stylesheet" href="../../styles/components/table.css">
    <link rel="stylesheet" href="../../styles/components/progress-bar.css">
    <link rel="stylesheet" href="../../styles/components/modal.css">
    <style>
        body { background: var(--pf-gray-100); }

        .ctrl-header { margin-bottom: var(--pf-space-4); }
        .ctrl-header h1 { font-size: 1.5rem; color: var(--pf-gray-900); }
        .ctrl-header p { color: var(--pf-gray-500); font-size: 0.9rem; }

        .ctrl-alertas { margin-bottom: var(--pf-space-4); display: flex; flex-direction: column; gap: var(--pf-space-2); }
        .ctrl-alerta {
            padding: var(--pf-space-3) var(--pf-space-4);
            border-radius: var(--pf-radius-md);
            color: var(--pf-white);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: var(--pf-space-2);
        }
        .ctrl-alerta--danger { background: var(--pf-danger); }
        .ctrl-alerta--warning { background: var(--pf-warning); color: var(--pf-gray-900); }
        .ctrl-alerta--info { background: var(--pf-info); }

        .ctrl-filtros {
            display: flex;
            flex-wrap: wrap;
            gap: var(--pf-space-3);
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--pf-space-4);
        }
        .ctrl-filtros-campos { display: flex; flex-wrap: wrap; gap: var(--pf-space-2); }
        .ctrl-filtros-acoes { display: flex; flex-wrap: wrap; gap: var(--pf-space-2); }

        .ctrl-indicadores {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: var(--pf-space-3);
            margin-bottom: var(--pf-space-4);
        }
        .ctrl-indicador { text-align: center; }
        .ctrl-indicador-valor { font-size: 1.6rem; font-weight: 800; color: var(--pf-blue-700); }
        .ctrl-indicador-label { font-size: 0.72rem; color: var(--pf-gray-500); text-transform: uppercase; letter-spacing: 0.4px; }

        .ctrl-progressos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--pf-space-4); margin-bottom: var(--pf-space-4); }
        .ctrl-progresso-label { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--pf-gray-700); margin-bottom: var(--pf-space-1); }

        .ctrl-secao { margin-bottom: var(--pf-space-4); }
        .ctrl-secao h2 { font-size: 1rem; color: var(--pf-gray-900); margin-bottom: var(--pf-space-3); }

        .ctrl-table-wrap { overflow-x: auto; }
        .ctrl-th-ordenavel { cursor: pointer; user-select: none; white-space: nowrap; }
        .ctrl-th-ordenavel:hover { color: var(--pf-blue-700); }

        .ctrl-badge { padding: 3px 8px; border-radius: var(--pf-radius-lg); font-size: 0.78rem; font-weight: 600; display: inline-block; white-space: nowrap; }
        .ctrl-badge--concluido { background: #d4edda; color: #155724; }
        .ctrl-badge--andamento { background: #fff3cd; color: #856404; }
        .ctrl-badge--nao-iniciado { background: #f8d7da; color: #721c24; }
        .ctrl-badge--nao-previsto { background: var(--pf-gray-200); color: var(--pf-gray-500); }

        .ctrl-btn-comparar { background: none; border: none; cursor: pointer; font-size: 1rem; }

        .ctrl-pendencia-item, .ctrl-timeline-item {
            padding: var(--pf-space-3);
            border-radius: var(--pf-radius-md);
            background: var(--pf-gray-100);
            margin-bottom: var(--pf-space-2);
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--pf-space-2);
        }
        .ctrl-pendencia-item { cursor: pointer; }
        .ctrl-pendencia-item:hover { background: var(--pf-gray-200); }

        .ctrl-estado-vazio { color: var(--pf-gray-500); font-size: 0.85rem; padding: var(--pf-space-3); text-align: center; }

        #modalJustificativa .pf-modal { max-width: 500px; }

        @media print {
            pf-header, pf-sidebar, .ctrl-filtros, .ctrl-alertas { display: none !important; }
        }

        @media (max-width: 700px) {
            .ctrl-table-wrap table { min-width: 800px; }
        }
    </style>
</head>
<body>
    <div class="pf-app-shell">
        <pf-header></pf-header>
        <pf-sidebar active="controlador"></pf-sidebar>
        <div class="pf-app-main">
            <div class="container">

                <div class="ctrl-header">
                    <h1>✅ Controlador Pedagógico</h1>
                    <p>Acompanhamento da execução do planejamento — o que realmente foi ensinado.</p>
                </div>

                <div class="ctrl-alertas" id="ctrlAlertas"></div>

                <div class="pf-card ctrl-filtros">
                    <div class="ctrl-filtros-campos">
                        <select class="pf-filter-select" id="ctrlFiltroTurma">
                            <option value="">Todas as turmas</option>
                        </select>
                        <select class="pf-filter-select" id="ctrlFiltroBimestre">
                            <option value="">Todos os bimestres</option>
                            <option value="1">1º Bimestre</option>
                            <option value="2">2º Bimestre</option>
                            <option value="3">3º Bimestre</option>
                            <option value="4">4º Bimestre</option>
                        </select>
                        <select class="pf-filter-select" id="ctrlFiltroSituacao">
                            <option value="">Todas as situações</option>
                            <option value="atrasado">🔴 Atrasado</option>
                            <option value="andamento">🟡 Em andamento</option>
                            <option value="em-dia">🟢 Em dia</option>
                        </select>
                    </div>
                    <div class="ctrl-filtros-acoes">
                        <button class="pf-btn pf-btn--info" onclick="exportarRelatorioCsv()">⬇️ Exportar Relatório</button>
                        <button class="pf-btn pf-btn--secondary" onclick="window.print()">🖨️ Imprimir</button>
                    </div>
                </div>

                <div class="pf-card ctrl-indicadores" id="ctrlIndicadores"></div>

                <div class="pf-card ctrl-progressos" id="ctrlProgressos"></div>

                <div class="pf-card ctrl-secao">
                    <h2>📋 Acompanhamento de Conteúdos</h2>
                    <div class="ctrl-table-wrap">
                        <table class="pf-table" id="ctrlTabela">
                            <thead>
                                <tr>
                                    <th class="ctrl-th-ordenavel" onclick="ordenarPor('unidadeTematica')">Unidade Temática</th>
                                    <th class="ctrl-th-ordenavel" onclick="ordenarPor('objetoConhecimento')">Objeto de Conhecimento</th>
                                    <th>Habilidade(s)</th>
                                    <th class="ctrl-th-ordenavel" onclick="ordenarPor('numAulas')">Previstas</th>
                                    <th class="ctrl-th-ordenavel" onclick="ordenarPor('aulasExecutadas')">Realizadas</th>
                                    <th>Situação</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="ctrlTabelaBody"></tbody>
                        </table>
                    </div>
                </div>

                <div class="pf-card ctrl-secao">
                    <h2>⏳ Pendências</h2>
                    <div id="ctrlPendencias"></div>
                </div>

                <div class="pf-card ctrl-secao">
                    <h2>🕓 Linha do Tempo</h2>
                    <div id="ctrlTimeline"></div>
                </div>

            </div>
        </div>
    </div>

    <pf-modal id="modalJustificativa">
        <div class="pf-modal-header">
            <h2 style="font-size:1.1rem;">⚖️ Justificar Alteração</h2>
            <span style="cursor:pointer;" onclick="document.getElementById('modalJustificativa').close()">&times;</span>
        </div>
        <div class="pf-modal-body">
            <p id="ctrlComparativoTexto" style="font-size:0.85rem;color:var(--pf-gray-700);margin-bottom:var(--pf-space-3);"></p>
            <div class="pf-field">
                <label>Justificativa</label>
                <textarea id="ctrlJustificativaTexto" rows="4"></textarea>
            </div>
        </div>
        <div class="pf-modal-footer">
            <button class="pf-btn pf-btn--secondary" onclick="document.getElementById('modalJustificativa').close()">Cancelar</button>
            <button class="pf-btn pf-btn--success" onclick="salvarJustificativa()">💾 Salvar</button>
        </div>
    </pf-modal>

    <script type="module">
        import "../../scripts/layout/page-shell.js";
        import "../../scripts/components/pf-modal.js";
        import "../../scripts/services/escola-context.js";
        import { requireAuth } from "../../scripts/services/auth-guard.js";
        import { showToast } from "../../scripts/components/pf-alert.js";
        import { ouvirAulas } from "../../scripts/services/aulas-service.js";
        import { ouvirTurmas } from "../../scripts/services/turmas-service.js";
        import { ouvirConfiguracoes } from "../../scripts/services/configuracoes-service.js";
        import { salvarControlador } from "../../scripts/services/controlador-service.js";
        import { sincronizarControlador } from "../../scripts/services/controlador-sync.js";
        import { ouvirPlanejamentosBimestrais } from "../../scripts/services/planejamento-bimestral-service.js";
        import { ouvirPlanejamentosMensais } from "../../scripts/services/planejamento-mensal-service.js";
        import { habilidadesBNCC } from "../../data/bncc-curriculum.js";

        // ---------- Estado ----------
        let escolaAtualId = null;
        let unsubAulas = null, unsubTurmas = null, unsubConfiguracoes = null;
        let unsubBimestrais = null, unsubMensais = null;

        let aulasFirebase = [];
        let turmasAtuais = [];
        let aulasControlador = [];
        let bimestresConfig = [];
        let planejamentosBimestrais = [];
        let planejamentosMensais = [];

        let aulasCarregadas = false, turmasCarregadas = false;
        // Preservado só pra não apagar o campo ao regravar o doc (setDoc sem
        // merge) — não é mais lido/priorizado por nenhuma tela (ver achado 1
        // do plano: aulaAtualId ficou órfão desde que o Controlador deixou de
        // ter seleção manual de aula).
        let aulaAtualIdAtual = null;

        let filtroTurma = '', filtroBimestre = '', filtroSituacao = '';
        let ordenacaoColuna = null, ordenacaoDirecao = 1;
        let entradaEmJustificativa = null;

        // ---------- Helpers ----------
        function mostrarMensagem(texto, tipo) {
            showToast(texto, tipo);
        }

        function formatarData(data) {
            if (!data) return '-';
            const [ano, mes, dia] = data.split('-');
            return `${dia}/${mes}/${ano}`;
        }

        // As entradas do Controlador guardam a turma FÍSICA ("6º A"), mas os
        // dados da BNCC (data/bncc-curriculum.js) e a hierarquia de Planejamento
        // são indexados pela SÉRIE ("6º Ano") — essa conversão é necessária
        // sempre que for cruzar uma entrada do Controlador com esses dois.
        function serieDaTurma(turmaFisica) {
            const m = /^(\d+)º/.exec(turmaFisica || '');
            return m ? `${m[1]}º Ano` : null;
        }

        // Todos os códigos de habilidade que a BNCC prevê pra uma série —
        // direto de habilidadesBNCC[serie], sem cruzar com os dicionários
        // genéricos (que não sabem quais combinações existem pra cada série).
        const cacheCodigosSerie = new Map();
        function todosCodigosDaSerie(serie) {
            if (!serie || !habilidadesBNCC[serie]) return new Set();
            if (cacheCodigosSerie.has(serie)) return cacheCodigosSerie.get(serie);
            const codigos = new Set();
            Object.values(habilidadesBNCC[serie]).forEach(especMap => {
                Object.values(especMap).forEach(lista => {
                    lista.forEach(h => codigos.add(h.codigo));
                });
            });
            cacheCodigosSerie.set(serie, codigos);
            return codigos;
        }

        function codigosTrabalhadosNaTurma(turmaFisica) {
            const codigos = new Set();
            aulasControlador
                .filter(a => a.turma === turmaFisica)
                .forEach(a => (a.habilidades || []).forEach(h => codigos.add(h.codigo || h)));
            return codigos;
        }

        function habilidadesNaoContempladas(turmaFisica) {
            const serie = serieDaTurma(turmaFisica);
            const todas = todosCodigosDaSerie(serie);
            const trabalhadas = codigosTrabalhadosNaTurma(turmaFisica);
            return [...todas].filter(c => !trabalhadas.has(c));
        }

        // "Em dia" / "Em andamento" / "Atrasado" — Concluída e Cancelada não
        // entram em nenhum dos 3 (mesma decisão "neutra" já usada no resto do app).
        function situacaoDaEntrada(aula) {
            if (aula.status === 'Concluída' || aula.status === 'Cancelada') return null;
            if (aula.status === 'Em Andamento' || aula.status === 'Reposição') return 'andamento';
            if (aula.prazo) {
                const prazo = new Date(aula.prazo + 'T12:00:00');
                if (prazo < new Date()) return 'atrasado';
            }
            return 'em-dia';
        }

        // ---------- Carregamento Firestore ----------
        function carregarDadosFirebase() {
            return ouvirAulas(escolaAtualId, (snapshot) => {
                aulasFirebase = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
                aulasCarregadas = true;
                reconciliarESincronizar();
            });
        }

        function carregarTurmasFirebase() {
            return ouvirTurmas(escolaAtualId, (docSnap) => {
                const data = docSnap.data();
                if (data && data.lista && data.lista.length) {
                    turmasAtuais = data.lista;
                }
                turmasCarregadas = true;
                reconciliarESincronizar();
            });
        }

        async function reconciliarESincronizar() {
            if (!aulasCarregadas || !turmasCarregadas) return;
            const resultado = await sincronizarControlador({ escolaId: escolaAtualId, aulasFirebase, turmasAtuais });
            if (!resultado) return;
            aulasControlador = resultado.aulas;
            aulaAtualIdAtual = resultado.aulaAtualId || null;
            renderizarTudo();
        }

        function carregarConfiguracoes() {
            return ouvirConfiguracoes(escolaAtualId, (docSnap) => {
                const data = docSnap.data();
                bimestresConfig = (data && data.bimestres) ? data.bimestres : [];
                renderizarTudo();
            });
        }

        function carregarBimestrais() {
            return ouvirPlanejamentosBimestrais(escolaAtualId, (snapshot) => {
                planejamentosBimestrais = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                renderizarTudo();
            });
        }

        function carregarMensais() {
            return ouvirPlanejamentosMensais(escolaAtualId, (snapshot) => {
                planejamentosMensais = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                renderizarTudo();
            });
        }

        function renderizarTudo() {
            atualizarFiltroTurmas();
            renderizarAlertas();
            renderizarIndicadores();
            renderizarProgressos();
            renderizarTabela();
            renderizarPendencias();
            renderizarTimeline();
        }

        function atualizarFiltroTurmas() {
            const select = document.getElementById('ctrlFiltroTurma');
            const valorAtual = select.value;
            const turmas = [...new Set(aulasControlador.map(a => a.turma).filter(Boolean))].sort();
            select.innerHTML = '<option value="">Todas as turmas</option>' + turmas.map(t => `<option value="${t}">${t}</option>`).join('');
            select.value = valorAtual;
        }

        function inicializarFiltros() {
            document.getElementById('ctrlFiltroTurma').addEventListener('change', (e) => { filtroTurma = e.target.value; renderizarTabela(); });
            document.getElementById('ctrlFiltroBimestre').addEventListener('change', (e) => { filtroBimestre = e.target.value; renderizarTabela(); renderizarIndicadores(); renderizarProgressos(); });
            document.getElementById('ctrlFiltroSituacao').addEventListener('change', (e) => { filtroSituacao = e.target.value; renderizarTabela(); });
        }

        window.ordenarPor = function (coluna) {
            if (ordenacaoColuna === coluna) {
                ordenacaoDirecao *= -1;
            } else {
                ordenacaoColuna = coluna;
                ordenacaoDirecao = 1;
            }
            renderizarTabela();
        };

        // ---------- Inicialização ----------
        inicializarFiltros();

        requireAuth({ loginPath: '../../login.html' });

        document.addEventListener('pf-escola-ready', (evento) => {
            escolaAtualId = evento.detail.escolaId;
            aulasCarregadas = false;
            turmasCarregadas = false;
            if (unsubAulas) unsubAulas();
            if (unsubTurmas) unsubTurmas();
            if (unsubConfiguracoes) unsubConfiguracoes();
            if (unsubBimestrais) unsubBimestrais();
            if (unsubMensais) unsubMensais();
            unsubAulas = carregarDadosFirebase();
            unsubTurmas = carregarTurmasFirebase();
            unsubConfiguracoes = carregarConfiguracoes();
            unsubBimestrais = carregarBimestrais();
            unsubMensais = carregarMensais();
        });

        // ---------- Filtro compartilhado (indicadores + tabela + exportação) ----------
        function entradasFiltradas() {
            return aulasControlador.filter(a => {
                if (filtroTurma && a.turma !== filtroTurma) return false;
                if (filtroBimestre && String(a.bimestre) !== filtroBimestre) return false;
                if (filtroSituacao && situacaoDaEntrada(a) !== filtroSituacao) return false;
                return true;
            });
        }

        // ---------- Indicadores ----------
        function renderizarIndicadores() {
            const entradas = entradasFiltradas();
            const aulasPrevistas = entradas.reduce((s, a) => s + (a.numAulas || 0), 0);
            const aulasMinistradas = entradas.reduce((s, a) => s + (a.aulasExecutadas || 0), 0);
            const conteudosConcluidos = entradas.filter(a => a.status === 'Concluída').length;

            const indicadores = [
                { valor: aulasPrevistas, label: 'Aulas Previstas' },
                { valor: aulasMinistradas, label: 'Aulas Ministradas' },
                { valor: Math.max(0, aulasPrevistas - aulasMinistradas), label: 'Aulas Pendentes' },
                { valor: entradas.length, label: 'Conteúdos Previstos' },
                { valor: conteudosConcluidos, label: 'Conteúdos Concluídos' },
            ];

            document.getElementById('ctrlIndicadores').innerHTML = indicadores.map(i => `
                <div class="ctrl-indicador">
                    <div class="ctrl-indicador-valor">${i.valor}</div>
                    <div class="ctrl-indicador-label">${i.label}</div>
                </div>
            `).join('');
        }

        // ---------- Progresso do Bimestre / Ano (mesma lógica do Dashboard, duplicada por convenção) ----------
        function stringParaData(dataStr) {
            const [dia, mes, ano] = dataStr.split('/').map(Number);
            return new Date(ano, mes - 1, dia);
        }

        function calcularProgressoAnual() {
            if (!bimestresConfig || bimestresConfig.length === 0) return null;
            const inicioAno = stringParaData(bimestresConfig[0].inicio);
            const fimAno = stringParaData(bimestresConfig[bimestresConfig.length - 1].fim);
            fimAno.setHours(23, 59, 59, 999);
            const totalMs = fimAno - inicioAno;
            if (totalMs <= 0) return null;
            const hoje = new Date();
            const decorridoMs = Math.min(Math.max(hoje - inicioAno, 0), totalMs);
            return Math.round((decorridoMs / totalMs) * 100);
        }

        function calcularProgressoBimestral() {
            if (!bimestresConfig || bimestresConfig.length === 0) {
                return { percentual: 0, rotulo: 'Bimestral', semDados: true };
            }
            const alvo = filtroBimestre
                ? bimestresConfig.find(b => String(b.numero) === filtroBimestre)
                : null;
            const hoje = new Date();

            const calcular = (b) => {
                const inicio = stringParaData(b.inicio);
                const fim = stringParaData(b.fim);
                fim.setHours(23, 59, 59, 999);
                const percentual = Math.round((Math.min(Math.max(hoje - inicio, 0), fim - inicio) / (fim - inicio)) * 100);
                return { percentual, rotulo: `${b.numero}º Bimestre` };
            };

            if (alvo) return calcular(alvo);

            for (const b of bimestresConfig) {
                const inicio = stringParaData(b.inicio);
                const fim = stringParaData(b.fim);
                fim.setHours(23, 59, 59, 999);
                if (hoje >= inicio && hoje <= fim) return calcular(b);
            }
            const primeiro = stringParaData(bimestresConfig[0].inicio);
            if (hoje < primeiro) return { percentual: 0, rotulo: 'Ano letivo ainda não iniciado' };
            return { percentual: 100, rotulo: 'Bimestre encerrado' };
        }

        function renderizarProgressos() {
            const anual = calcularProgressoAnual();
            const bimestral = calcularProgressoBimestral();
            const container = document.getElementById('ctrlProgressos');
            container.innerHTML = `
                <div>
                    <div class="ctrl-progresso-label"><span>${bimestral.rotulo}</span><span>${bimestral.percentual}%</span></div>
                    <div class="pf-progress-track"><div class="pf-progress-fill" style="width:${bimestral.percentual}%;"></div></div>
                </div>
                <div>
                    <div class="ctrl-progresso-label"><span>Ano Letivo</span><span>${anual === null ? '-' : anual + '%'}</span></div>
                    <div class="pf-progress-track"><div class="pf-progress-fill" style="width:${anual || 0}%;"></div></div>
                </div>
            `;
        }

        // ---------- Alertas Inteligentes (regras simples, sem IA) ----------
        function calcularAlertas() {
            const alertas = [];
            const total = aulasControlador.length;

            if (total > 0) {
                const atrasadas = aulasControlador.filter(a => situacaoDaEntrada(a) === 'atrasado').length;
                if (atrasadas / total > 0.2) {
                    alertas.push({ tipo: 'danger', texto: `${atrasadas} de ${total} conteúdos estão atrasados (${Math.round(atrasadas / total * 100)}%).` });
                }
                const canceladas = aulasControlador.filter(a => a.status === 'Cancelada').length;
                if (canceladas / total > 0.2) {
                    alertas.push({ tipo: 'warning', texto: `Muitas aulas canceladas: ${canceladas} de ${total} (${Math.round(canceladas / total * 100)}%).` });
                }
            }

            const turmasPresentes = [...new Set(aulasControlador.map(a => a.turma).filter(Boolean))];
            const totalLacunas = turmasPresentes.reduce((s, t) => s + habilidadesNaoContempladas(t).length, 0);
            if (totalLacunas > 0) {
                alertas.push({ tipo: 'warning', texto: `${totalLacunas} habilidade(s) da BNCC ainda não foram contempladas.` });
            }

            const hoje = new Date();
            const bimestreAtivo = bimestresConfig.find(b => {
                const inicio = stringParaData(b.inicio), fim = stringParaData(b.fim);
                fim.setHours(23, 59, 59, 999);
                return hoje >= inicio && hoje <= fim;
            });
            if (bimestreAtivo) {
                const series = [...new Set(turmasPresentes.map(serieDaTurma).filter(Boolean))];
                const seriesSemPlano = series.filter(serie => {
                    const plano = planejamentosBimestrais.find(p => p.turma === serie && p.bimestre === bimestreAtivo.numero);
                    return !plano || !plano.objetivos;
                });
                if (seriesSemPlano.length > 0) {
                    alertas.push({ tipo: 'info', texto: `Planejamento do ${bimestreAtivo.numero}º Bimestre incompleto para: ${seriesSemPlano.join(', ')}.` });
                }
            }

            return alertas;
        }

        function renderizarAlertas() {
            const alertas = calcularAlertas();
            const container = document.getElementById('ctrlAlertas');
            container.innerHTML = alertas.map(a => `<div class="ctrl-alerta ctrl-alerta--${a.tipo}">⚠️ ${a.texto}</div>`).join('');
        }

        // ---------- Tabela de Acompanhamento ----------
        function situacaoEmojiHtml(status) {
            switch (status) {
                case 'Concluída': return '<span class="ctrl-badge ctrl-badge--concluido">🟢 Concluído</span>';
                case 'Em Andamento':
                case 'Reposição': return '<span class="ctrl-badge ctrl-badge--andamento">🟡 Em andamento</span>';
                case 'Cancelada': return '<span class="ctrl-badge ctrl-badge--nao-previsto">🚫 Cancelada</span>';
                default: return '<span class="ctrl-badge ctrl-badge--nao-iniciado">🔴 Não iniciado</span>';
            }
        }

        // Combinações (unidade × especificação) da BNCC da série da turma que
        // NUNCA tiveram nenhuma habilidade trabalhada em nenhuma entrada —
        // vira linha virtual "⚪ Não previsto" na tabela.
        function combinacoesNaoPrevistas(turmaFisica) {
            const serie = serieDaTurma(turmaFisica);
            if (!serie || !habilidadesBNCC[serie]) return [];
            const trabalhadas = codigosTrabalhadosNaTurma(turmaFisica);
            const resultado = [];
            Object.entries(habilidadesBNCC[serie]).forEach(([unidade, especMap]) => {
                Object.entries(especMap).forEach(([especificacao, lista]) => {
                    const algumTrabalhado = lista.some(h => trabalhadas.has(h.codigo));
                    if (!algumTrabalhado) {
                        resultado.push({ unidadeTematica: unidade, objetoConhecimento: especificacao, habilidades: lista, turma: turmaFisica, virtual: true });
                    }
                });
            });
            return resultado;
        }

        function habilidadesTexto(habilidades) {
            if (!Array.isArray(habilidades) || habilidades.length === 0) return '-';
            return habilidades.map(h => h.codigo || h).join(', ');
        }

        function renderizarTabela() {
            let linhas = entradasFiltradas().map(a => ({ ...a, virtual: false }));

            // Linhas virtuais "Não previsto" — só fazem sentido quando não há
            // filtro de situação específico (elas não têm status real).
            if (!filtroSituacao) {
                const turmas = filtroTurma ? [filtroTurma] : [...new Set(aulasControlador.map(a => a.turma).filter(Boolean))];
                turmas.forEach(t => { linhas = linhas.concat(combinacoesNaoPrevistas(t)); });
            }

            if (ordenacaoColuna) {
                linhas.sort((a, b) => {
                    const va = a[ordenacaoColuna] ?? -Infinity;
                    const vb = b[ordenacaoColuna] ?? -Infinity;
                    if (typeof va === 'string') return va.localeCompare(vb) * ordenacaoDirecao;
                    return (va - vb) * ordenacaoDirecao;
                });
            }

            const tbody = document.getElementById('ctrlTabelaBody');
            if (linhas.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7"><p class="ctrl-estado-vazio">Nenhum conteúdo encontrado com os filtros atuais.</p></td></tr>`;
                return;
            }

            tbody.innerHTML = linhas.map(a => {
                if (a.virtual) {
                    return `
                        <tr style="opacity:0.6;">
                            <td>${a.unidadeTematica}</td>
                            <td>${a.objetoConhecimento}</td>
                            <td>${habilidadesTexto(a.habilidades)}</td>
                            <td>-</td>
                            <td>-</td>
                            <td><span class="ctrl-badge ctrl-badge--nao-previsto">⚪ Não previsto</span></td>
                            <td></td>
                        </tr>
                    `;
                }
                const divergencia = a.conteudoMinistrado && a.conteudoMinistrado.trim() &&
                    a.conteudoMinistrado.trim() !== (a.titulo || '').trim() &&
                    a.conteudoMinistrado.trim() !== (a.objetoConhecimento || '').trim();
                return `
                    <tr>
                        <td>${a.unidadeTematica || '-'}</td>
                        <td>${a.objetoConhecimento || '-'}</td>
                        <td>${habilidadesTexto(a.habilidades)}</td>
                        <td>${a.numAulas ?? '-'}</td>
                        <td>${a.aulasExecutadas ?? 0}</td>
                        <td>${situacaoEmojiHtml(a.status)}</td>
                        <td>${divergencia ? `<button class="ctrl-btn-comparar" title="Conteúdo executado diverge do planejado — justificar" onclick="abrirJustificativa('${a.id}')">⚖️</button>` : ''}</td>
                    </tr>
                `;
            }).join('');
        }

        // ---------- Pendências ----------
        function renderizarPendencias() {
            const itens = [];

            aulasControlador.filter(a => situacaoDaEntrada(a) === 'atrasado').forEach(a => {
                itens.push({ texto: `🔴 Atrasada: ${a.titulo} — ${a.turma} (prazo ${formatarData(a.prazo)})`, destino: '../programacao-diaria/index.html' });
            });
            aulasControlador.filter(a => a.status === 'Reposição').forEach(a => {
                itens.push({ texto: `🔁 Necessita reposição: ${a.titulo} — ${a.turma}`, destino: '../programacao-diaria/index.html' });
            });

            const turmasPresentes = [...new Set(aulasControlador.map(a => a.turma).filter(Boolean))];
            turmasPresentes.forEach(t => {
                const faltando = habilidadesNaoContempladas(t);
                if (faltando.length > 0) {
                    itens.push({ texto: `📌 ${faltando.length} habilidade(s) da BNCC não contempladas em ${t}`, destino: '../planejamento/index.html' });
                }
            });

            const series = [...new Set(turmasPresentes.map(serieDaTurma).filter(Boolean))];
            const hoje = new Date();
            series.forEach(serie => {
                bimestresConfig.forEach(b => {
                    const inicio = stringParaData(b.inicio);
                    if (inicio > hoje) return; // bimestre futuro, ainda não cobrar
                    const plano = planejamentosBimestrais.find(p => p.turma === serie && p.bimestre === b.numero);
                    if (!plano || !plano.objetivos) {
                        itens.push({ texto: `📝 Planejamento do ${b.numero}º Bimestre incompleto — ${serie}`, destino: '../planejamento/index.html' });
                    }
                });
            });

            window._pendenciasAtuais = itens;
            const container = document.getElementById('ctrlPendencias');
            if (itens.length === 0) {
                container.innerHTML = '<p class="ctrl-estado-vazio">Nenhuma pendência encontrada. 🎉</p>';
                return;
            }
            container.innerHTML = itens.map((item, i) => `
                <div class="ctrl-pendencia-item" onclick="acionarPendencia(${i})">
                    <span>${item.texto}</span>
                    <span>→</span>
                </div>
            `).join('');
        }

        window.acionarPendencia = function (i) {
            const item = window._pendenciasAtuais && window._pendenciasAtuais[i];
            if (item) window.location.href = item.destino;
        };

        // ---------- Linha do Tempo ----------
        // Só eventos com timestamp real (cancelamento/reposição, já gravados
        // pela Programação Diária) — não reconstrói "aula realizada" como
        // evento individual (não existe timestamp discreto de cada execução).
        function renderizarTimeline() {
            const eventos = [];
            aulasControlador.forEach(a => {
                (a.historico || []).forEach(h => {
                    eventos.push({ data: h.data, tipo: h.tipo, motivo: h.motivo, titulo: a.titulo, turma: a.turma });
                });
            });
            eventos.sort((x, y) => (y.data || '').localeCompare(x.data || ''));

            const container = document.getElementById('ctrlTimeline');
            if (eventos.length === 0) {
                container.innerHTML = '<p class="ctrl-estado-vazio">Nenhum evento registrado ainda.</p>';
                return;
            }
            const rotuloTipo = { cancelamento: '🚫 Cancelamento', reposicao: '🔁 Reposição' };
            container.innerHTML = eventos.slice(0, 30).map(e => {
                const data = e.data ? new Date(e.data) : null;
                const dataTexto = data
                    ? `${String(data.getDate()).padStart(2, '0')}/${String(data.getMonth() + 1).padStart(2, '0')} ${String(data.getHours()).padStart(2, '0')}:${String(data.getMinutes()).padStart(2, '0')}`
                    : '-';
                return `
                    <div class="ctrl-timeline-item">
                        <span>${rotuloTipo[e.tipo] || e.tipo} — ${e.titulo} (${e.turma})${e.motivo ? ': ' + e.motivo : ''}</span>
                        <span style="color:var(--pf-gray-500);font-size:0.75rem;">${dataTexto}</span>
                    </div>
                `;
            }).join('');
        }

        // ---------- Comparativo Planejado × Executado / Justificativa ----------
        window.abrirJustificativa = function (id) {
            entradaEmJustificativa = aulasControlador.find(a => a.id === id);
            if (!entradaEmJustificativa) return;
            document.getElementById('ctrlComparativoTexto').innerHTML = `
                <strong>Planejado:</strong> ${entradaEmJustificativa.titulo || entradaEmJustificativa.objetoConhecimento || '-'}<br>
                <strong>Executado:</strong> ${entradaEmJustificativa.conteudoMinistrado}
            `;
            document.getElementById('ctrlJustificativaTexto').value = entradaEmJustificativa.justificativaAlteracao || '';
            document.getElementById('modalJustificativa').open();
        };

        window.salvarJustificativa = async function () {
            if (!entradaEmJustificativa) return;
            const texto = document.getElementById('ctrlJustificativaTexto').value;
            const entrada = aulasControlador.find(a => a.id === entradaEmJustificativa.id);
            if (!entrada) return;
            entrada.justificativaAlteracao = texto;
            try {
                await salvarControlador(escolaAtualId, {
                    aulas: aulasControlador,
                    aulaAtualId: aulaAtualIdAtual,
                    ultimaAtualizacao: new Date().toISOString()
                });
                mostrarMensagem('Justificativa salva!', 'success');
                document.getElementById('modalJustificativa').close();
            } catch (erro) {
                mostrarMensagem('Erro ao salvar: ' + erro.message, 'error');
            }
        };

        // ---------- Exportação ----------
        window.exportarRelatorioCsv = function () {
            const entradas = entradasFiltradas();
            const linhas = [
                ['Unidade Temática', 'Objeto de Conhecimento', 'Turma', 'Habilidades', 'Previstas', 'Realizadas', 'Status'],
                ...entradas.map(a => [
                    a.unidadeTematica || '', a.objetoConhecimento || '', a.turma || '',
                    habilidadesTexto(a.habilidades), a.numAulas ?? '', a.aulasExecutadas ?? 0, a.status || ''
                ])
            ];
            const csv = linhas.map(linha => linha.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
            const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `controlador-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            mostrarMensagem('Relatório exportado!', 'success');
        };
    </script>
</body>
</html>
