<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prof GB · Programação Diária</title>
    <meta name="description" content="Prof GB — assistente inteligente para planejamento e organização do trabalho docente.">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    <link rel="stylesheet" href="../../styles/tokens.css">
    <link rel="stylesheet" href="../../styles/reset.css">
    <link rel="stylesheet" href="../../styles/base.css">
    <link rel="stylesheet" href="../../styles/layout.css">
    <link rel="stylesheet" href="../../styles/components/alert.css">
    <link rel="stylesheet" href="../../styles/components/card.css">
    <link rel="stylesheet" href="../../styles/components/button.css">
    <link rel="stylesheet" href="../../styles/components/filter.css">
    <link rel="stylesheet" href="../../styles/components/form.css">
    <link rel="stylesheet" href="../../styles/components/modal.css">
    <link rel="stylesheet" href="../../styles/components/progress-bar.css">
    <style>
        body {
            background: var(--pf-gray-100);
        }

        /* Barra superior */
        .pd-barra {
            display: flex;
            flex-wrap: wrap;
            gap: var(--pf-space-3);
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--pf-space-4);
        }

        .pd-barra-nav {
            display: flex;
            align-items: center;
            gap: var(--pf-space-2);
            flex-wrap: wrap;
        }

        .pd-barra-data {
            font-weight: 700;
            color: var(--pf-gray-900);
            min-width: 220px;
        }

        .pd-barra-acoes {
            display: flex;
            gap: var(--pf-space-2);
            flex-wrap: wrap;
        }

        /* Calendário do Ano — mesmo visual do Dashboard, com paginação por
           mês (lá é só o mês atual, fixo) e clique pra saltar dataSelecionada. */
        .pd-calendario {
            margin-bottom: var(--pf-space-4);
        }

        .pd-calendario-cabecalho {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--pf-space-3);
            margin-bottom: var(--pf-space-2);
        }

        .pd-card-titulo {
            font-size: 1.05rem;
            color: var(--pf-gray-900);
            margin: 0;
        }

        .pd-calendario-cabecalho h2 {
            min-width: 180px;
            text-align: center;
        }

        .pd-cal-semana, .pd-cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
        }

        .pd-cal-semana {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--pf-gray-500);
            margin-bottom: var(--pf-space-2);
        }

        .pd-cal-dia {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--pf-radius-sm);
            font-size: 0.8rem;
            color: var(--pf-gray-700);
            background: var(--pf-gray-100);
            cursor: pointer;
        }

        .pd-cal-dia--vazio {
            background: transparent;
            cursor: default;
        }

        .pd-cal-dia--hoje {
            outline: 2px solid var(--pf-blue-700);
            font-weight: 700;
        }

        .pd-cal-dia--selecionado {
            outline: 2px dashed var(--pf-gray-900);
        }

        .pd-cal-dia--bimestre-1 { background: var(--pf-bimestre-1); color: var(--pf-white); }
        .pd-cal-dia--bimestre-2 { background: var(--pf-bimestre-2); color: var(--pf-white); }
        .pd-cal-dia--bimestre-3 { background: var(--pf-bimestre-3); color: var(--pf-white); }
        .pd-cal-dia--bimestre-4 { background: var(--pf-bimestre-4); color: var(--pf-white); }

        .pd-cal-legenda {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: var(--pf-space-3);
            margin-top: var(--pf-space-3);
            font-size: 0.72rem;
            color: var(--pf-gray-500);
        }

        .pd-cal-legenda span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .pd-cal-legenda i {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            display: inline-block;
        }

        /* Layout lista + painel */
        .pd-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: var(--pf-space-4);
            align-items: start;
        }

        @media (max-width: 900px) {
            .pd-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .pd-painel {
                display: none;
            }
        }

        .pd-lista {
            display: flex;
            flex-direction: column;
            gap: var(--pf-space-3);
        }

        .pd-periodo-titulo {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--pf-gray-500);
            margin-top: var(--pf-space-2);
        }

        .pd-estado-vazio {
            color: var(--pf-gray-500);
            font-size: 0.9rem;
            padding: var(--pf-space-4);
        }

        .pd-estado-vazio a {
            color: var(--pf-blue-700);
            font-weight: 600;
        }

        .pd-card {
            cursor: pointer;
            border-left: 4px solid var(--pf-blue-700);
            transition: box-shadow 0.15s;
        }

        .pd-card:hover {
            box-shadow: var(--pf-shadow-md);
        }

        .pd-card--selecionada {
            outline: 2px solid var(--pf-blue-700);
        }

        .pd-card-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--pf-space-2);
        }

        .pd-card-horario {
            font-size: 0.75rem;
            color: var(--pf-gray-500);
            font-weight: 600;
        }

        .pd-card-turma {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--pf-gray-900);
        }

        .pd-card-meta {
            font-size: 0.78rem;
            color: var(--pf-gray-500);
            margin-bottom: var(--pf-space-1);
        }

        .pd-card-conteudo {
            font-size: 0.88rem;
            color: var(--pf-gray-700);
        }

        .pd-card-obs {
            margin-top: var(--pf-space-2);
            font-size: 0.78rem;
            color: var(--pf-gray-500);
            font-style: italic;
        }

        .pd-card-indicadores {
            margin-top: var(--pf-space-2);
            display: flex;
            gap: var(--pf-space-2);
        }

        /* Badges de status — mesma paleta do Dashboard, prefixo próprio */
        .pd-badge {
            display: inline-block;
            padding: 2px var(--pf-space-2);
            border-radius: var(--pf-radius-lg);
            font-size: 0.72rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .pd-badge--concluida { background: var(--pf-success); color: var(--pf-white); }
        .pd-badge--em-andamento { background: var(--pf-warning); color: var(--pf-gray-900); }
        .pd-badge--nao-iniciada { background: var(--pf-info); color: var(--pf-white); }
        .pd-badge--sem-planejamento { background: var(--pf-gray-300); color: var(--pf-gray-700); }
        .pd-badge--cancelada { background: var(--pf-danger); color: var(--pf-white); }
        .pd-badge--reposicao { background: var(--pf-info); color: var(--pf-white); }
        .pd-badge--futura { background: var(--pf-slate-600); color: var(--pf-white); }

        /* Painel de detalhes */
        .pd-painel-cabecalho {
            display: flex;
            flex-direction: column;
            gap: var(--pf-space-2);
            margin-bottom: var(--pf-space-3);
            padding-bottom: var(--pf-space-3);
            border-bottom: 1px solid var(--pf-gray-200);
        }

        .pd-painel-cabecalho h3 {
            font-size: 1.1rem;
            color: var(--pf-gray-900);
        }

        .pd-painel-secao {
            margin-bottom: var(--pf-space-4);
        }

        .pd-painel-secao h4 {
            font-size: 0.85rem;
            color: var(--pf-blue-700);
            margin-bottom: var(--pf-space-2);
        }

        .pd-painel-secao p {
            font-size: 0.85rem;
            color: var(--pf-gray-700);
            margin-bottom: var(--pf-space-1);
        }

        /* Progresso da aula — quantas sessões desse conteúdo já foram
           registradas via "Concluir Aula", antes dos botões de ação. Sem
           isso, cada clique em Concluir era uma decisão "às cegas": o
           professor só descobria quantas faltavam pelo toast, que some em
           poucos segundos. */
        .pd-progresso-aula {
            margin-bottom: var(--pf-space-3);
        }

        .pd-progresso-aula__cabecalho {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--pf-gray-700);
            margin-bottom: var(--pf-space-1);
        }

        .pd-acoes-rapidas {
            display: flex;
            flex-wrap: wrap;
            gap: var(--pf-space-2);
        }

        .pd-acoes-rapidas .pf-btn {
            font-size: 0.8rem;
            padding: var(--pf-space-2) var(--pf-space-3);
        }

        .pd-aviso-somente-leitura {
            margin-top: var(--pf-space-2);
            font-size: 0.78rem;
            color: var(--pf-gray-500);
            font-style: italic;
        }

        .pd-observacoes-atuais {
            font-size: 0.85rem;
            color: var(--pf-gray-700);
            background: var(--pf-gray-100);
            border-radius: var(--pf-radius-md);
            padding: var(--pf-space-3);
            margin-bottom: var(--pf-space-2);
            white-space: pre-line;
            max-height: 160px;
            overflow-y: auto;
        }

        .pd-painel-secao textarea {
            width: 100%;
            min-height: 70px;
            padding: var(--pf-space-2);
            border: 2px solid var(--pf-gray-300);
            border-radius: var(--pf-radius-md);
            font-family: var(--pf-font-family);
            font-size: 14px;
            margin-bottom: var(--pf-space-2);
            resize: vertical;
        }

        .pd-checkbox {
            display: block;
            font-size: 0.82rem;
            color: var(--pf-gray-700);
            margin-bottom: var(--pf-space-1);
        }

        /* Modal do painel em telas pequenas — quase tela cheia */
        @media (max-width: 600px) {
            #pdPainelModal .pf-modal {
                width: 100%;
                max-width: 100%;
                height: 100%;
                max-height: 100%;
                border-radius: 0;
                padding: var(--pf-space-4);
            }
        }

        @media print {
            pf-header, pf-sidebar, .pd-barra-acoes, .pd-painel, #pdPainelModal {
                display: none !important;
            }
            .pd-layout {
                grid-template-columns: 1fr !important;
            }
        }
    </style>
</head>
<body>
    <div class="pf-app-shell">
        <pf-header></pf-header>
        <pf-sidebar active="programacao-diaria"></pf-sidebar>
        <div class="pf-app-main">
            <div class="container">

                <!-- Barra superior -->
                <div class="pf-card pd-barra">
                    <div class="pd-barra-nav">
                        <button class="pf-btn pf-btn--secondary" onclick="diaAnterior()">← Anterior</button>
                        <button class="pf-btn pf-btn--secondary" onclick="irParaHoje()">Hoje</button>
                        <button class="pf-btn pf-btn--secondary" onclick="diaSeguinte()">Próxima →</button>
                        <span class="pd-barra-data" id="pdDataAtual">Carregando…</span>
                    </div>
                    <div class="pd-barra-acoes">
                        <select class="pf-filter-select" id="pdFiltroTurma" onchange="aplicarFiltroTurma()">
                            <option value="">Todas as turmas</option>
                        </select>
                        <button class="pf-btn pf-btn--info" onclick="imprimirDia()">🖨️ Imprimir</button>
                        <button class="pf-btn pf-btn--info" onclick="exportarCsv()">⬇️ Exportar</button>
                    </div>
                </div>

                <!-- Calendário do Ano -->
                <section class="pf-card pd-calendario">
                    <div class="pd-calendario-cabecalho">
                        <button class="pf-btn pf-btn--secondary" onclick="mesCalendarioAnterior()">◀</button>
                        <h2 class="pd-card-titulo" id="pdCalendarioMes">—</h2>
                        <button class="pf-btn pf-btn--secondary" onclick="mesCalendarioProximo()">▶</button>
                    </div>
                    <div class="pd-cal-semana">
                        <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
                    </div>
                    <div class="pd-cal-grid" id="pdCalendarioGrid"></div>
                    <div class="pd-cal-legenda" id="pdCalendarioLegenda"></div>
                </section>

                <!-- Lista + Painel -->
                <div class="pd-layout">
                    <div class="pd-lista" id="pdLista">
                        <p class="pd-estado-vazio">Carregando aulas do dia…</p>
                    </div>

                    <aside class="pf-card pd-painel" id="pdPainelDesktop">
                        <p class="pd-estado-vazio">Selecione uma aula na lista para ver os detalhes.</p>
                    </aside>
                </div>

            </div>
        </div>
    </div>

    <!-- Painel de detalhes em tela cheia, usado só em telas pequenas -->
    <pf-modal id="pdPainelModal">
        <div id="pdPainelMobileConteudo"></div>
    </pf-modal>

    <script type="module">
        import "../../scripts/layout/page-shell.js";
        import "../../scripts/components/pf-modal.js";
        import "../../scripts/services/escola-context.js";
        import { requireAuth } from "../../scripts/services/auth-guard.js";
        import { showToast } from "../../scripts/components/pf-alert.js";
        import { ouvirGrade, normalizarCelula, COMPONENTE_CURRICULAR_PADRAO } from "../../scripts/services/grade-service.js";
        import { ouvirTurmas, normalizarTurmas } from "../../scripts/services/turmas-service.js";
        import { ouvirConfiguracoes } from "../../scripts/services/configuracoes-service.js";
        import { ouvirAulas } from "../../scripts/services/aulas-service.js";
        import { ouvirControlador, salvarControlador } from "../../scripts/services/controlador-service.js";
        import { sincronizarControlador } from "../../scripts/services/controlador-sync.js";
        import { ouvirAtividades, registrarUso } from "../../scripts/services/atividades-service.js";

        // ---------- Estado ----------
        let escolaAtualId = null;
        let unsubGrade = null, unsubTurmas = null, unsubAulas = null, unsubControlador = null, unsubAtividades = null, unsubConfiguracoes = null;

        let gradeAtual = { matutino: [], vespertino: [] };
        let turmasAtuais = [];
        let aulasFirebaseRaw = [];
        let atividadesCarregadas = [];
        let controladorAtual = { aulas: [], aulaAtualId: null };
        let bimestres = []; // ver Configurações — só usado pra colorir o Calendário do Ano abaixo
        let diasEspeciais = []; // feriados, recesso, sábado letivo etc. (ver Configurações)

        // Mês exibido no Calendário do Ano — independente de dataSelecionada
        // (o dia sendo navegado na lista/painel). Só muda via ◀/▶ ou "Hoje";
        // clicar num dia do calendário move dataSelecionada, não este cursor.
        let mesCalendarioBase = new Date();

        // Duplicado de propósito de configuracoes/index.html e dashboard/index.html
        // (mesma convenção de pequenas tabelas de lookup já usada no repo).
        const CATEGORIAS_DIA_ESPECIAL = {
            'feriado': { label: 'Feriado', cor: '#E63946' },
            'recesso': { label: 'Recesso Escolar', cor: '#457B9D' },
            'sabado-letivo': { label: 'Sábado Letivo', cor: '#2A9D8F' },
            'conselho-classe': { label: 'Conselho de Classe', cor: '#9C89B8' },
            'outro': { label: 'Outro', cor: '#6C757D' }
        };

        let gradeCarregada = false;
        let turmasCarregada = false;
        let aulasCarregada = false;
        let controladorCarregada = false;

        let dataSelecionada = new Date();
        dataSelecionada.setHours(0, 0, 0, 0);

        // Vindo do Dashboard ("Iniciar Aula" de uma turma específica) a URL
        // carrega ?turma=... — abre já filtrado e com a aula selecionada,
        // pra não expor as outras turmas por engano. Pra ver as outras, o
        // professor limpa o filtro aqui mesmo (não precisa de outra tela).
        let filtroTurma = new URLSearchParams(window.location.search).get('turma') || '';
        let selecaoInicialPendente = !!filtroTurma;
        // Diferente de selecaoInicialPendente (consumida uma vez), este fica
        // true a sessão inteira — usado só pra decidir se "Concluir Aula"
        // volta sozinho pro Dashboard (o professor veio de lá pra resolver
        // UMA aula específica) ou fica na página (navegação direta, onde ele
        // pode estar resolvendo várias aulas/turmas em sequência).
        const veioDoDashboard = !!filtroTurma;
        let chaveSelecionada = null; // chave (encodeURIComponent) do slot selecionado na lista

        // Fixa o ID da entrada do Controlador no momento em que o professor
        // seleciona o card — Iniciar/Concluir/Registrar sempre agem sobre
        // ESSA entrada específica, nunca recalculada. Antes, cada ação
        // rederivava "qual é a aula da vez" pra turma na hora do clique; se
        // esse cálculo mudasse entre o Iniciar e o Concluir (nova entrada
        // sincronizada nesse meio-tempo, empate de data, etc.), os dois
        // cliques podiam acabar mexendo em aulas diferentes sem o professor
        // perceber.
        let entradaFixadaId = null;
        let nomeUsuario = null;

        // ---------- Constantes ----------
        const DIA_CHAVES = ['segunda', 'terca', 'quarta', 'quinta', 'sexta'];
        const DIAS_SEMANA_EXTENSO = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
        const MESES_EXTENSO = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        const DISCIPLINA_FIXA = 'Educação Física';
        const STATUS_POSSIVEIS = ['Não iniciada', 'Em Andamento', 'Concluída', 'Cancelada', 'Reposição'];

        // ---------- Helpers de data ----------
        function formatarDataCompleta(data) {
            return `${DIAS_SEMANA_EXTENSO[data.getDay()]}, ${data.getDate()} de ${MESES_EXTENSO[data.getMonth()]} de ${data.getFullYear()}`;
        }

        function ehHoje(data) {
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);
            return data.getTime() === hoje.getTime();
        }

        function formatarData(data) {
            if (!data) return '-';
            const [ano, mes, dia] = data.split('-');
            return `${dia}/${mes}/${ano}`;
        }

        function obterChaveDiaSemana(data) {
            const idx = data.getDay(); // 0=domingo..6=sábado
            return DIA_CHAVES[idx - 1] || null;
        }

        // ---------- Dias especiais (feriado, recesso, sábado letivo...) ----------
        function diaEspecialDoDia(data) {
            if (!data) return null;
            return diasEspeciais.find(d => {
                const [dia, mes, ano] = (d.data || '').split('/').map(Number);
                if (!dia || !mes || !ano) return false;
                return new Date(ano, mes - 1, dia).toDateString() === data.toDateString();
            }) || null;
        }

        // Todo dia especial cadastrado significa "sem aula pros alunos" —
        // inclusive "sábado letivo": nessa escola isso é dia de trabalho
        // interno do professor (pedagógico/administrativo) fora do horário
        // regular, não uma aula de verdade com turma.
        function diaBloqueiaAula(especial) {
            return !!especial;
        }

        function rotuloDiaEspecial(especial) {
            const info = CATEGORIAS_DIA_ESPECIAL[especial.categoria] || CATEGORIAS_DIA_ESPECIAL['outro'];
            return especial.rotulo ? `${info.label}: ${especial.rotulo}` : info.label;
        }

        // ---------- Calendário do Ano ----------
        // Variante "null como padrão" (igual dashboard/index.html): o
        // calendário desenha o mês inteiro, incluindo fins de semana e fora
        // do ano letivo — colori-los como "1º Bimestre" por padrão seria
        // enganoso.
        function determinarBimestreAno(data) {
            if (!bimestres || !data) return null;
            for (let i = 0; i < bimestres.length; i++) {
                const inicio = stringParaDataBR(bimestres[i].inicio);
                const fim = stringParaDataBR(bimestres[i].fim);
                fim.setHours(23, 59, 59, 999);
                if (data >= inicio && data <= fim) return i;
            }
            return null;
        }

        function stringParaDataBR(dataStr) {
            const [dia, mes, ano] = dataStr.split('/').map(Number);
            return new Date(ano, mes - 1, dia);
        }

        function renderizarCalendarioAno() {
            const ano = mesCalendarioBase.getFullYear();
            const mes = mesCalendarioBase.getMonth();
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);
            const primeiroDia = new Date(ano, mes, 1);
            const ultimoDia = new Date(ano, mes + 1, 0);
            const dias = [];
            for (let i = 0; i < primeiroDia.getDay(); i++) dias.push(null);
            for (let d = 1; d <= ultimoDia.getDate(); d++) dias.push(new Date(ano, mes, d));

            document.getElementById('pdCalendarioMes').textContent = `${MESES_EXTENSO[mes]} de ${ano}`;
            document.getElementById('pdCalendarioGrid').innerHTML = dias.map(data => {
                if (!data) return '<div class="pd-cal-dia pd-cal-dia--vazio"></div>';
                const idxBimestre = determinarBimestreAno(data);
                const especial = diaEspecialDoDia(data);
                const classes = ['pd-cal-dia'];
                if (idxBimestre !== null) classes.push(`pd-cal-dia--bimestre-${idxBimestre + 1}`);
                if (data.toDateString() === hoje.toDateString()) classes.push('pd-cal-dia--hoje');
                if (data.toDateString() === dataSelecionada.toDateString()) classes.push('pd-cal-dia--selecionado');
                const estiloEspecial = especial ? ` style="box-shadow: inset 0 0 0 2px ${(CATEGORIAS_DIA_ESPECIAL[especial.categoria] || CATEGORIAS_DIA_ESPECIAL['outro']).cor};"` : '';
                const tituloEspecial = especial ? ` title="${rotuloDiaEspecial(especial).replace(/"/g, '&quot;')}"` : '';
                return `<div class="${classes.join(' ')}"${estiloEspecial}${tituloEspecial} onclick="selecionarDataCalendario(${data.getFullYear()}, ${data.getMonth()}, ${data.getDate()})">${data.getDate()}</div>`;
            }).join('');

            const categoriasPresentes = [...new Set(diasEspeciais.map(d => CATEGORIAS_DIA_ESPECIAL[d.categoria] ? d.categoria : 'outro'))];
            const legendaBimestres = (bimestres && bimestres.length > 0)
                ? bimestres.map((b, i) => `<span><i class="pd-cal-dia--bimestre-${i + 1}"></i>${b.numero}º Bimestre</span>`).join('')
                : '<span>Configure os bimestres em Configurações para colorir o calendário.</span>';
            const legendaEspeciais = categoriasPresentes.map(cat => `<span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;box-shadow: inset 0 0 0 2px ${CATEGORIAS_DIA_ESPECIAL[cat].cor};"></i>${CATEGORIAS_DIA_ESPECIAL[cat].label}</span>`).join('');
            document.getElementById('pdCalendarioLegenda').innerHTML = legendaBimestres + legendaEspeciais;
        }

        window.mesCalendarioAnterior = function () {
            mesCalendarioBase = new Date(mesCalendarioBase.getFullYear(), mesCalendarioBase.getMonth() - 1, 1);
            renderizarCalendarioAno();
        };

        window.mesCalendarioProximo = function () {
            mesCalendarioBase = new Date(mesCalendarioBase.getFullYear(), mesCalendarioBase.getMonth() + 1, 1);
            renderizarCalendarioAno();
        };

        // Clicar num dia do calendário salta a navegação de dia (lista +
        // painel) pra essa data — não muda o mês exibido no calendário, só
        // o dia selecionado embaixo.
        window.selecionarDataCalendario = function (ano, mes, dia) {
            dataSelecionada = new Date(ano, mes, dia);
            chaveSelecionada = null;
            entradaFixadaId = null;
            renderizarTudo();
        };

        // ---------- Regra de junção grade × controlador ----------
        // Idêntica à do Dashboard (duplicada por convenção já estabelecida
        // no repo — funções puras pequenas são duplicadas em vez de
        // extraídas pra um util compartilhado). "Cancelada" é neutra: não
        // conta como pendente, e o fallback mostra o status real da entrada
        // mais recente em vez de forçar "Concluída".
        function derivarStatusTurma(turma, componenteCurricular, controlador) {
            const entradas = (controlador.aulas || []).filter(a =>
                a.turma === turma &&
                (a.componenteCurricular || COMPONENTE_CURRICULAR_PADRAO) === componenteCurricular
            );
            if (entradas.length === 0) {
                return { status: 'Sem planejamento', entrada: null };
            }
            // Nota: aulaAtualId não é mais escrito por nenhuma tela (o Controlador
            // deixou de ter seleção manual de aula) — não priorizar mais por ele,
            // senão uma entrada antiga fica "grudada" pra sempre. Só o fallback
            // por pendente mais antigo abaixo.
            const emAberto = entradas.filter(a => a.status !== 'Concluída' && a.status !== 'Cancelada');

            // Nunca deixa o professor adiantar aula: só vira "a aula da vez"
            // quem já chegou na data (hoje ou atrasada). Uma aula com
            // dataReferencia futura fica de fora daqui mesmo sendo a única
            // pendente — sem isso, terminar tudo antes do previsto liberava
            // a próxima semana de conteúdo antes da hora.
            // Escolhe a MAIS RECENTE (não a mais antiga) entre as disponíveis
            // até hoje: cada dia tem sua própria aula prevista, e uma
            // atrasada de semanas atrás não pode travar a turma de avançar
            // pro conteúdo da semana atual. A atrasada continua existindo e
            // fica acessível pela lista "Aulas pendentes desta turma" — só
            // não é mais ela quem define "a aula de hoje".
            const hojeStr = new Date().toISOString().split('T')[0];
            const disponiveisHoje = emAberto
                .filter(a => !a.dataInicio || a.dataInicio <= hojeStr)
                .sort((a, b) => (b.dataInicio || '').localeCompare(a.dataInicio || ''));
            if (disponiveisHoje.length > 0) {
                return { status: disponiveisHoje[0].status || 'Não iniciada', entrada: disponiveisHoje[0] };
            }

            const futuras = emAberto
                .filter(a => a.dataInicio && a.dataInicio > hojeStr)
                .sort((a, b) => a.dataInicio.localeCompare(b.dataInicio));
            if (futuras.length > 0) {
                return { status: 'Aula futura', entrada: futuras[0] };
            }

            const maisRecente = entradas.slice()
                .sort((a, b) => (b.dataInicio || '').localeCompare(a.dataInicio || ''))[0];
            return { status: maisRecente.status || 'Concluída', entrada: maisRecente };
        }

        function classeBadge(status) {
            switch (status) {
                case 'Concluída': return 'pd-badge--concluida';
                case 'Em Andamento': return 'pd-badge--em-andamento';
                case 'Sem planejamento': return 'pd-badge--sem-planejamento';
                case 'Cancelada': return 'pd-badge--cancelada';
                case 'Reposição': return 'pd-badge--reposicao';
                case 'Aula futura': return 'pd-badge--futura';
                default: return 'pd-badge--nao-iniciada';
            }
        }

        // ---------- Montagem da lista do dia selecionado ----------
        function chaveDoItem(item) {
            return `${item.periodo}|${item.horario}|${item.turma}`;
        }

        // filtroTurma normalmente é só o nome da turma ("6º A"). Quando duas
        // turmas físicas compartilham o mesmo nome em componentes diferentes
        // (ex.: "6º A" de Artes e "6º A" de Educação Física — professor que
        // leciona os dois), o valor do filtro vira composto
        // "nome|||componente" (ver renderizarBarraSuperior) pra saber qual
        // das duas está selecionada. Nomes sem ambiguidade continuam como
        // string simples, sem mudança de comportamento.
        const SEPARADOR_FILTRO_TURMA = '|||';
        function interpretarFiltroTurma(filtro) {
            if (!filtro) return { nome: '', componente: null };
            const [nome, componente] = filtro.split(SEPARADOR_FILTRO_TURMA);
            return { nome, componente: componente || null };
        }

        function montarAulasDoDia() {
            const diaChave = obterChaveDiaSemana(dataSelecionada);
            if (!diaChave) return [];
            if (diaBloqueiaAula(diaEspecialDoDia(dataSelecionada))) return [];
            const { nome: nomeFiltro, componente: componenteFiltro } = interpretarFiltroTurma(filtroTurma);
            const itens = [];
            ['matutino', 'vespertino'].forEach(periodo => {
                (gradeAtual[periodo] || []).forEach(linha => {
                    const celula = normalizarCelula(linha[diaChave]);
                    if (celula.tipo !== 'turma') return;
                    if (nomeFiltro && celula.turma !== nomeFiltro) return;
                    if (componenteFiltro && celula.componenteCurricular !== componenteFiltro) return;
                    const { status, entrada } = derivarStatusTurma(celula.turma, celula.componenteCurricular, controladorAtual);
                    itens.push({ periodo, horario: linha.horario, turma: celula.turma, componenteCurricular: celula.componenteCurricular, status, entrada });
                });
            });
            return itens;
        }

        // Aulas atrasadas/pendentes da turma filtrada que NÃO são "a aula de
        // hoje" (essa já aparece no card normal, via montarAulasDoDia) — dão
        // ao professor um jeito explícito de escolher e resolver backlog sem
        // que isso mude o que o Dashboard mostra como aula do dia.
        function pendentesDaTurma(filtro) {
            if (!filtro) return [];
            const { nome: turma, componente: componenteFiltro } = interpretarFiltroTurma(filtro);
            const turmaObj = componenteFiltro
                ? turmasAtuais.find(t => t.nome === turma && t.componenteCurricular === componenteFiltro)
                : turmasAtuais.find(t => t.nome === turma);
            const componente = (turmaObj && turmaObj.componenteCurricular) || COMPONENTE_CURRICULAR_PADRAO;
            const itemDeHoje = montarAulasDoDia().find(i => i.turma === turma);
            const idDeHoje = itemDeHoje && itemDeHoje.entrada ? itemDeHoje.entrada.id : null;
            return (controladorAtual.aulas || [])
                .filter(a => a.turma === turma && (a.componenteCurricular || COMPONENTE_CURRICULAR_PADRAO) === componente)
                .filter(a => a.status !== 'Concluída' && a.status !== 'Cancelada')
                .filter(a => a.id !== idDeHoje)
                .sort((a, b) => (a.dataInicio || '').localeCompare(b.dataInicio || ''));
        }

        function encontrarItemSelecionado() {
            if (!chaveSelecionada) return null;
            const chaveDecodificada = decodeURIComponent(chaveSelecionada);
            return montarAulasDoDia().find(i => chaveDoItem(i) === chaveDecodificada) || null;
        }

        // Retorna a entrada FIXADA no momento da seleção (por id), não a
        // "aula da vez" recalculada agora — ver comentário de
        // entradaFixadaId. Ainda busca em controladorAtual.aulas a cada
        // chamada, então reflete atualizações de status feitas em outra aba,
        // só não muda de ENTRADA sozinha.
        function entradaFixada() {
            if (!entradaFixadaId) return null;
            return (controladorAtual.aulas || []).find(a => a.id === entradaFixadaId) || null;
        }

        function encontrarEntradaSelecionada() {
            return entradaFixada();
        }

        // ---------- Reconciliação (aulas do Planejamento × turmas) ----------
        // Não reimplementa a lógica — só chama o módulo compartilhado quando
        // aulas E turmas já entregaram seu primeiro snapshot real. O
        // resultado da escrita chega de volta sozinho via ouvirControlador.
        async function talvezSincronizar() {
            if (!turmasCarregada || !aulasCarregada) return;
            await sincronizarControlador({ escolaId: escolaAtualId, aulasFirebase: aulasFirebaseRaw, turmasAtuais });
        }

        // ---------- Ações operacionais ----------
        function persistirControlador() {
            return salvarControlador(escolaAtualId, {
                aulas: controladorAtual.aulas,
                aulaAtualId: controladorAtual.aulaAtualId,
                ultimaAtualizacao: new Date().toISOString()
            });
        }

        // Segunda trava (a primeira é o botão desabilitado no painel) contra
        // adiantar aula: mesmo que o clique chegue aqui de algum jeito
        // (estado da UI dessincronizado, etc.), a mutação não acontece.
        function ehAulaFutura(entrada) {
            if (!entrada.dataInicio) return false;
            return entrada.dataInicio > new Date().toISOString().split('T')[0];
        }

        window.iniciarAula = function () {
            const entrada = encontrarEntradaSelecionada();
            if (!entrada) return;
            if (ehAulaFutura(entrada)) {
                showToast(`Esta aula está agendada para ${formatarData(entrada.dataInicio)} — ainda não pode ser iniciada.`, 'info');
                return;
            }
            if (entrada.status !== 'Concluída') entrada.status = 'Em Andamento';
            persistirControlador().then(() => showToast('Aula iniciada!', 'success'));
        };

        window.concluirAula = function () {
            const entrada = encontrarEntradaSelecionada();
            if (!entrada) return;
            if (ehAulaFutura(entrada)) {
                showToast(`Esta aula está agendada para ${formatarData(entrada.dataInicio)} — ainda não pode ser concluída.`, 'info');
                return;
            }
            if (!entrada.aulasExecutadas) entrada.aulasExecutadas = 0;
            const total = entrada.numAulas || 2;
            if (entrada.aulasExecutadas >= total) {
                showToast('Esta aula já foi concluída.', 'info');
                return;
            }
            entrada.aulasExecutadas++;
            const concluiuConteudo = entrada.aulasExecutadas >= total;
            entrada.status = concluiuConteudo ? 'Concluída' : 'Em Andamento';

            // Quando o conteúdo termina, essa turma/período passa a apontar
            // pro próximo planejamento pendente (mesma lógica de
            // derivarStatusTurma) — sem avisar qual é, a troca parece um
            // reset pro professor (a mesma turma "voltando" pra Não
            // iniciada, quando na verdade é uma aula nova começando).
            let mensagem = `Aula registrada (${entrada.aulasExecutadas}/${total})!`;
            if (concluiuConteudo) {
                // derivarStatusTurma cai num fallback "mais recente" quando
                // não sobra nenhuma pendente — que pode ser a própria
                // entrada que acabou de virar "Concluída". Só anuncia como
                // "próxima aula" quando é de fato uma pendente diferente.
                const { entrada: proxima } = derivarStatusTurma(entrada.turma, entrada.componenteCurricular, controladorAtual);
                mensagem = (proxima && proxima.id !== entrada.id && proxima.status !== 'Concluída')
                    ? `Conteúdo concluído! Próxima aula: ${proxima.titulo}`
                    : 'Conteúdo concluído! Nenhuma outra aula planejada pra essa turma ainda.';
            }

            persistirControlador().then(() => {
                showToast(mensagem, 'success');
                atividadesVinculadasDaEntrada(entrada).forEach(at => {
                    registrarUso(escolaAtualId, at.id, entrada.turma).catch(erro => console.error('Erro ao registrar uso da atividade:', erro));
                });
                // Só volta sozinho quando o professor veio do Dashboard pra
                // resolver essa aula específica (ver veioDoDashboard) — dá
                // tempo de ler o toast antes de sair da página. Navegação
                // direta na Programação Diária não redireciona, já que o
                // professor pode estar resolvendo várias aulas em sequência.
                if (veioDoDashboard) {
                    setTimeout(() => {
                        window.location.href = '../dashboard/index.html';
                    }, 1500);
                }
            });
        };

        window.anexarArquivo = function () {
            showToast('Anexos chegam em breve por aqui.', 'info');
        };

        window.registrarObservacao = function () {
            const entrada = encontrarEntradaSelecionada();
            if (!entrada) return;
            const textarea = document.getElementById('pdNovaObservacao');
            const texto = textarea.value.trim();
            if (!texto) {
                showToast('Escreva algo antes de registrar.', 'info');
                return;
            }
            const agora = new Date();
            const carimbo = `${String(agora.getDate()).padStart(2, '0')}/${String(agora.getMonth() + 1).padStart(2, '0')} ${String(agora.getHours()).padStart(2, '0')}:${String(agora.getMinutes()).padStart(2, '0')}`;
            entrada.observacoes = (entrada.observacoes ? entrada.observacoes + '\n\n' : '') + `[${carimbo}] ${texto}`;
            persistirControlador().then(() => showToast('Observação registrada!', 'success'));
        };

        window.aplicarStatusManual = function () {
            const entrada = encontrarEntradaSelecionada();
            if (!entrada) return;
            const novoStatus = document.getElementById('pdStatusSelect').value;
            if (novoStatus === entrada.status) return;

            if (novoStatus === 'Cancelada' || novoStatus === 'Reposição') {
                const motivo = (prompt(novoStatus === 'Cancelada' ? 'Motivo do cancelamento (opcional):' : 'Motivo da reposição (opcional):') || '').trim();
                if (!Array.isArray(entrada.historico)) entrada.historico = [];
                const evento = {
                    tipo: novoStatus === 'Cancelada' ? 'cancelamento' : 'reposicao',
                    data: new Date().toISOString()
                };
                if (motivo) evento.motivo = motivo; // nunca gravar campo undefined no Firestore
                entrada.historico.push(evento);
            }

            entrada.status = novoStatus;
            persistirControlador().then(() => showToast('Status atualizado!', 'success'));
        };

        window.salvarRegistroAula = function () {
            const entrada = encontrarEntradaSelecionada();
            if (!entrada) return;
            entrada.conteudoMinistrado = document.getElementById('pdConteudoMinistrado').value;
            const tempo = document.getElementById('pdTempoUtilizado').value;
            entrada.tempoUtilizado = tempo ? Number(tempo) : null;
            entrada.dificuldades = document.getElementById('pdDificuldades').value;
            entrada.habilidadesTrabalhadas = Array.from(
                document.querySelectorAll('#pdHabilidadesTrabalhadas input:checked')
            ).map(cb => cb.value);
            persistirControlador().then(() => showToast('Registro salvo!', 'success'));
        };

        // ---------- Navegação de data / filtro ----------
        window.diaAnterior = function () {
            dataSelecionada.setDate(dataSelecionada.getDate() - 1);
            chaveSelecionada = null;
            entradaFixadaId = null;
            renderizarTudo();
        };

        window.diaSeguinte = function () {
            dataSelecionada.setDate(dataSelecionada.getDate() + 1);
            chaveSelecionada = null;
            entradaFixadaId = null;
            renderizarTudo();
        };

        window.irParaHoje = function () {
            dataSelecionada = new Date();
            dataSelecionada.setHours(0, 0, 0, 0);
            mesCalendarioBase = new Date(dataSelecionada.getFullYear(), dataSelecionada.getMonth(), 1);
            chaveSelecionada = null;
            entradaFixadaId = null;
            renderizarTudo();
        };

        window.aplicarFiltroTurma = function () {
            filtroTurma = document.getElementById('pdFiltroTurma').value;
            chaveSelecionada = null;
            entradaFixadaId = null;
            renderizarTudo();
        };

        window.selecionarAula = function (chaveCodificada) {
            chaveSelecionada = chaveCodificada;
            // Fixa qual entrada essa seleção representa NESTE momento —
            // Iniciar/Concluir/etc. vão continuar agindo nela mesmo que a
            // resolução "aula da vez" da turma mude depois (ver
            // entradaFixadaId).
            const item = encontrarItemSelecionado();
            entradaFixadaId = item && item.entrada ? item.entrada.id : null;
            renderizarLista();
            renderizarPainel();
            if (window.matchMedia('(max-width: 600px)').matches) {
                document.getElementById('pdPainelModal').open();
            }
        };

        // Seleciona uma aula ATRASADA da lista "pendentes desta turma" —
        // ancora num card de hoje da mesma turma (só pra exibir turma/
        // horário no cabeçalho do painel) e fixa a entrada atrasada
        // escolhida, sem depender de qual aula o algoritmo resolveria pra
        // hoje. Resolver isso aqui não muda o que o Dashboard mostra.
        window.selecionarPendente = function (entradaId) {
            // Turma pode não ter aula na grade do dia selecionado — nesse
            // caso não há item de hoje pra ancorar chaveSelecionada, e o
            // painel cai no caminho alternativo (ver construirPainelHtml)
            // que usa só a entrada fixada pra exibir turma/detalhes.
            const { nome: nomeFiltroAtual } = interpretarFiltroTurma(filtroTurma);
            const itemDeHoje = montarAulasDoDia().find(i => i.turma === nomeFiltroAtual);
            chaveSelecionada = itemDeHoje ? encodeURIComponent(chaveDoItem(itemDeHoje)) : null;
            entradaFixadaId = entradaId;
            renderizarLista();
            renderizarPainel();
            if (window.matchMedia('(max-width: 600px)').matches) {
                document.getElementById('pdPainelModal').open();
            }
        };

        // ---------- Impressão / exportação ----------
        window.imprimirDia = function () {
            window.print();
        };

        window.exportarCsv = function () {
            const itens = montarAulasDoDia();
            if (itens.length === 0) {
                showToast('Nada para exportar neste dia.', 'info');
                return;
            }
            const linhas = [['Horário', 'Turma', 'Conteúdo', 'Status'].join(';')];
            itens.forEach(item => {
                const conteudo = item.entrada ? item.entrada.titulo : 'Sem planejamento';
                linhas.push([item.horario, item.turma, conteudo, item.status]
                    .map(v => `"${String(v).replace(/"/g, '""')}"`).join(';'));
            });
            const blob = new Blob(['﻿' + linhas.join('\n')], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `programacao-${dataSelecionada.toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        // ---------- Renderização ----------
        function renderizarBarraSuperior() {
            const sufixo = ehHoje(dataSelecionada) ? ' (hoje)' : '';
            const especialSelecionado = diaEspecialDoDia(dataSelecionada);
            const sufixoEspecial = diaBloqueiaAula(especialSelecionado) ? ` · 🎌 ${rotuloDiaEspecial(especialSelecionado)}` : '';
            document.getElementById('pdDataAtual').textContent = formatarDataCompleta(dataSelecionada) + sufixo + sufixoEspecial;

            const select = document.getElementById('pdFiltroTurma');
            // O rótulo sempre mostra o componente curricular (mesmo quando
            // só existe uma turma com aquele nome) — o professor precisa
            // saber de cara pra qual disciplina é aquela aula na hora de se
            // programar, não só nos casos em que o nome se repete. O VALOR
            // da opção só precisa virar composto (ver interpretarFiltroTurma)
            // quando o nome é ambíguo — sem isso, filtroTurma continuaria
            // batendo direto com celula.turma pelo nome, sem necessidade de
            // carregar o componente junto.
            const contagemPorNome = {};
            turmasAtuais.forEach(t => { contagemPorNome[t.nome] = (contagemPorNome[t.nome] || 0) + 1; });
            const opcoes = [...turmasAtuais]
                .sort((a, b) => a.nome.localeCompare(b.nome) || a.componenteCurricular.localeCompare(b.componenteCurricular))
                .map(t => {
                    const ambiguo = contagemPorNome[t.nome] > 1;
                    return {
                        valor: ambiguo ? `${t.nome}${SEPARADOR_FILTRO_TURMA}${t.componenteCurricular}` : t.nome,
                        rotulo: `${t.nome} — ${t.componenteCurricular}`
                    };
                });
            select.innerHTML = '<option value="">Todas as turmas</option>' +
                opcoes.map(o => `<option value="${o.valor}">${o.rotulo}</option>`).join('');
            // Fonte da verdade é filtroTurma (não o valor atual do <select>) —
            // assim um filtro aplicado via ?turma= na URL aparece refletido
            // aqui mesmo antes de qualquer interação do professor.
            select.value = opcoes.some(o => o.valor === filtroTurma) ? filtroTurma : '';
        }

        function renderizarLista() {
            const container = document.getElementById('pdLista');
            const diaChave = obterChaveDiaSemana(dataSelecionada);

            if (!diaChave) {
                container.innerHTML = '<p class="pd-estado-vazio">Fim de semana — sem aulas na grade. 🎉</p>';
                return;
            }
            if ((gradeAtual.matutino || []).length === 0 && (gradeAtual.vespertino || []).length === 0) {
                container.innerHTML = '<p class="pd-estado-vazio">Grade ainda não configurada. Configure em <a href="../configuracoes/index.html">Configurações</a>.</p>';
                return;
            }

            const itens = montarAulasDoDia();
            const especialSelecionado = diaEspecialDoDia(dataSelecionada);
            const semAulaHoje = diaBloqueiaAula(especialSelecionado);
            // Turma filtrada sem aula na grade do dia selecionado: sem cards
            // de "hoje", mas a lista de pendentes (abaixo) continua valendo —
            // é exatamente o caso de regularizar backlog de uma turma que
            // não cai na grade de hoje.
            if (itens.length === 0 && !filtroTurma) {
                container.innerHTML = semAulaHoje
                    ? `<p class="pd-estado-vazio">🎌 Sem aula neste dia — ${rotuloDiaEspecial(especialSelecionado)}.</p>`
                    : '<p class="pd-estado-vazio">Nenhuma aula encontrada neste dia.</p>';
                return;
            }

            let periodoAtual = null;
            const cardsHtmlBase = itens.length === 0
                ? (semAulaHoje
                    ? `<p class="pd-estado-vazio">🎌 Sem aula neste dia — ${rotuloDiaEspecial(especialSelecionado)}.</p>`
                    : `<p class="pd-estado-vazio">Nenhuma aula encontrada para esta turma neste dia.</p>`)
                : '';
            const cardsHtml = cardsHtmlBase || itens.map(item => {
                let cabecalho = '';
                if (item.periodo !== periodoAtual) {
                    periodoAtual = item.periodo;
                    cabecalho = `<div class="pd-periodo-titulo">${item.periodo === 'matutino' ? '🌅 Matutino' : '☀️ Vespertino'}</div>`;
                }

                const indicadores = [];
                if (item.entrada) indicadores.push('<span title="Planejamento disponível">📘</span>');
                if (item.entrada && item.entrada.observacoes) indicadores.push('<span title="Observações registradas">📝</span>');

                const chaveCodificada = encodeURIComponent(chaveDoItem(item));
                const selecionada = chaveSelecionada && decodeURIComponent(chaveSelecionada) === chaveDoItem(item) ? ' pd-card--selecionada' : '';
                const conteudo = item.entrada ? item.entrada.titulo : 'Sem planejamento cadastrado';
                const obsPreview = item.entrada && item.entrada.observacoes
                    ? `<div class="pd-card-obs">${item.entrada.observacoes.split('\n')[0].slice(0, 80)}${item.entrada.observacoes.length > 80 ? '…' : ''}</div>`
                    : '';

                return `
                    ${cabecalho}
                    <div class="pf-card pd-card${selecionada}" onclick="selecionarAula('${chaveCodificada}')">
                        <div class="pd-card-topo">
                            <span class="pd-card-horario">${item.horario}</span>
                            <span class="pd-badge ${classeBadge(item.status)}">${item.status}</span>
                        </div>
                        <div class="pd-card-turma">${item.turma}</div>
                        <div class="pd-card-meta">${item.componenteCurricular || DISCIPLINA_FIXA} · ${nomeUsuario || 'Professor'}</div>
                        <div class="pd-card-conteudo">${conteudo}</div>
                        ${obsPreview}
                        <div class="pd-card-indicadores">${indicadores.join('')}</div>
                    </div>
                `;
            }).join('');

            // Só aparece com uma turma filtrada — é aqui que o professor
            // resolve atrasadas manualmente, sem que isso mude o que o
            // Dashboard mostra como aula de hoje (ver derivarStatusTurma).
            const pendentes = filtroTurma ? pendentesDaTurma(filtroTurma) : [];
            // Sempre mostra o componente curricular junto do nome — mesmo
            // quando o nome não é ambíguo, o professor precisa saber de cara
            // pra qual disciplina é o backlog que está resolvendo. Cai pra
            // turmasAtuais quando o filtro não veio composto (turma única).
            const { nome: nomeFiltroExibido, componente: componenteFiltroDoValor } = interpretarFiltroTurma(filtroTurma);
            const turmaFiltroObj = turmasAtuais.find(t => t.nome === nomeFiltroExibido);
            const componenteFiltroExibido = componenteFiltroDoValor || (turmaFiltroObj && turmaFiltroObj.componenteCurricular);
            const rotuloFiltro = componenteFiltroExibido ? `${nomeFiltroExibido} — ${componenteFiltroExibido}` : nomeFiltroExibido;
            const pendentesHtml = pendentes.length === 0 ? '' : `
                <div class="pd-periodo-titulo">⏳ Aulas pendentes de ${rotuloFiltro}</div>
                ${pendentes.map(p => {
                    const selecionada = entradaFixadaId === p.id ? ' pd-card--selecionada' : '';
                    return `
                        <div class="pf-card pd-card${selecionada}" onclick="selecionarPendente('${p.id}')">
                            <div class="pd-card-topo">
                                <span class="pd-card-horario">${formatarData(p.dataInicio)}</span>
                                <span class="pd-badge ${classeBadge(p.status)}">${p.status}</span>
                            </div>
                            <div class="pd-card-turma">${p.turma}</div>
                            <div class="pd-card-meta">${p.componenteCurricular || COMPONENTE_CURRICULAR_PADRAO}</div>
                            <div class="pd-card-conteudo">${p.titulo}</div>
                        </div>
                    `;
                }).join('')}
            `;

            container.innerHTML = cardsHtml + pendentesHtml;
        }

        function construirHabilidadesTrabalhadasHtml(entrada) {
            const planejadas = Array.isArray(entrada.habilidades) ? entrada.habilidades : [];
            if (planejadas.length === 0) {
                return '<p class="pd-estado-vazio">Nenhuma habilidade planejada para esta aula.</p>';
            }
            const jaRegistradas = Array.isArray(entrada.habilidadesTrabalhadas) && entrada.habilidadesTrabalhadas.length > 0
                ? entrada.habilidadesTrabalhadas
                : null;
            return planejadas.map(h => {
                const codigo = h.codigo || h;
                const marcado = jaRegistradas ? jaRegistradas.includes(codigo) : true;
                return `<label class="pd-checkbox"><input type="checkbox" value="${codigo}" ${marcado ? 'checked' : ''}> ${codigo}</label>`;
            }).join('');
        }

        function construirPainelHtml() {
            const item = encontrarItemSelecionado();
            // A entrada FIXADA (por id, ver entradaFixadaId) é quem manda no
            // painel e nas ações — não item.entrada/item.status, que
            // recalculam "qual é a aula da vez" da turma a cada render e
            // podiam divergir da aula que o professor está de fato olhando.
            const entrada = entradaFixada();
            // item só existe quando a seleção veio de um card da grade de
            // hoje. Selecionar via "Aulas pendentes" (ver selecionarPendente)
            // pode fixar uma entrada de turma sem aula na grade do dia
            // selecionado — nesse caso não há item, mas a entrada sozinha já
            // basta pra exibir e agir sobre o registro.
            if (!item && !entrada) {
                return '<p class="pd-estado-vazio">Selecione uma aula na lista para ver os detalhes.</p>';
            }

            const ehFutura = entrada ? ehAulaFutura(entrada) : false;
            const statusExibido = entrada ? (ehFutura ? 'Aula futura' : (entrada.status || 'Não iniciada')) : item.status;
            const turmaExibida = item ? item.turma : entrada.turma;
            const horarioExibido = item ? item.horario : 'Aula pendente';

            let html = `
                <div class="pd-painel-cabecalho">
                    <span class="pd-badge ${classeBadge(statusExibido)}">${statusExibido}</span>
                    <h3>${turmaExibida} · ${horarioExibido}</h3>
                </div>
            `;

            if (!entrada) {
                html += '<p class="pd-estado-vazio">Nenhum plano de aula cadastrado para esta turma. <a href="../planejamento/index.html">Cadastrar no Planejamento</a>.</p>';
                return html;
            }

            const somenteLeitura = !ehHoje(dataSelecionada) || ehFutura;
            const habilidadesTexto = Array.isArray(entrada.habilidades) && entrada.habilidades.length > 0
                ? entrada.habilidades.map(h => h.codigo || h).join(', ')
                : 'Não definidas';
            const totalAulas = entrada.numAulas || 2;
            const aulasExecutadas = entrada.aulasExecutadas || 0;
            const percentualAulas = Math.min(100, Math.round((aulasExecutadas / totalAulas) * 100));

            html += `
                <div class="pd-painel-secao">
                    <h4>📌 Planejamento (somente leitura)</h4>
                    <p><strong>Título:</strong> ${entrada.titulo || '-'}</p>
                    <p><strong>Objeto de Conhecimento:</strong> ${entrada.objetoConhecimento || '-'}</p>
                    <p><strong>Habilidades da BNCC:</strong> ${habilidadesTexto}</p>
                    <p><strong>Descrição/Metodologia:</strong> ${entrada.descricao || '-'}</p>
                    <p><strong>Recursos Didáticos:</strong> ${entrada.recursos || 'Não especificado'}</p>
                    <p><strong>Atividades Vinculadas:</strong> ${
                        atividadesVinculadasDaEntrada(entrada).length > 0
                            ? atividadesVinculadasDaEntrada(entrada).map(at => `${at.titulo} (${at.tipo || 'Outros'})`).join(', ')
                            : 'Nenhuma'
                    }</p>
                </div>

                <div class="pd-painel-secao">
                    <h4>⚡ Ações Rápidas</h4>
                    <div class="pd-progresso-aula">
                        <div class="pd-progresso-aula__cabecalho">
                            <span>Aulas registradas</span>
                            <span>${aulasExecutadas} de ${totalAulas}</span>
                        </div>
                        <div class="pf-progress-track">
                            <div class="pf-progress-fill" style="width:${percentualAulas}%"></div>
                        </div>
                    </div>
                    <div class="pd-acoes-rapidas">
                        <button class="pf-btn pf-btn--success" onclick="iniciarAula()" ${somenteLeitura ? 'disabled' : ''}>▶️ Iniciar Aula</button>
                        <button class="pf-btn pf-btn--primary" onclick="concluirAula()" ${somenteLeitura ? 'disabled' : ''}>✅ Concluir Aula</button>
                        <button class="pf-btn pf-btn--info" onclick="anexarArquivo()">📎 Anexar Arquivo</button>
                        <a class="pf-btn pf-btn--secondary" href="../planejamento/index.html">📚 Planejamento</a>
                        <a class="pf-btn pf-btn--secondary" href="../banco-atividades/index.html">🗂️ Banco de Atividades</a>
                        <a class="pf-btn pf-btn--secondary" href="../inteligencia-artificial/index.html">🤖 IA</a>
                    </div>
                    ${ehFutura
                        ? `<p class="pd-aviso-somente-leitura">Esta aula está agendada para ${formatarData(entrada.dataInicio)} — ainda não pode ser iniciada.</p>`
                        : (somenteLeitura ? '<p class="pd-aviso-somente-leitura">Ações de execução só ficam disponíveis para o dia de hoje.</p>' : '')}
                </div>

                <div class="pd-painel-secao">
                    <h4>💬 Observações</h4>
                    <div class="pd-observacoes-atuais">${entrada.observacoes ? entrada.observacoes.replace(/\n/g, '<br>') : 'Nenhuma observação registrada ainda.'}</div>
                    <textarea id="pdNovaObservacao" placeholder="Adicionar nova observação..." ${somenteLeitura ? 'disabled' : ''}></textarea>
                    <button class="pf-btn pf-btn--secondary" onclick="registrarObservacao()" ${somenteLeitura ? 'disabled' : ''}>Registrar Observação</button>
                </div>

                <div class="pd-painel-secao">
                    <h4>🔄 Status</h4>
                    <select id="pdStatusSelect" class="pf-filter-select" ${somenteLeitura ? 'disabled' : ''}>
                        ${STATUS_POSSIVEIS.map(s => `<option value="${s}" ${entrada.status === s ? 'selected' : ''}>${s}</option>`).join('')}
                    </select>
                    <button class="pf-btn pf-btn--secondary" onclick="aplicarStatusManual()" ${somenteLeitura ? 'disabled' : ''}>Aplicar</button>
                </div>

                <div class="pd-painel-secao">
                    <h4>📝 Registro da Aula</h4>
                    <div class="pf-field">
                        <label>Conteúdo realmente ministrado</label>
                        <textarea id="pdConteudoMinistrado" ${somenteLeitura ? 'disabled' : ''}>${entrada.conteudoMinistrado || ''}</textarea>
                    </div>
                    <div class="pf-field">
                        <label>Tempo utilizado (minutos)</label>
                        <input type="number" id="pdTempoUtilizado" min="0" value="${entrada.tempoUtilizado ?? ''}" ${somenteLeitura ? 'disabled' : ''}>
                    </div>
                    <div class="pf-field">
                        <label>Habilidades trabalhadas</label>
                        <div id="pdHabilidadesTrabalhadas">${construirHabilidadesTrabalhadasHtml(entrada)}</div>
                    </div>
                    <div class="pf-field">
                        <label>Dificuldades encontradas</label>
                        <textarea id="pdDificuldades" ${somenteLeitura ? 'disabled' : ''}>${entrada.dificuldades || ''}</textarea>
                    </div>
                    <button class="pf-btn pf-btn--success" onclick="salvarRegistroAula()" ${somenteLeitura ? 'disabled' : ''}>💾 Salvar Registro</button>
                </div>
            `;
            return html;
        }

        function renderizarPainel() {
            const html = construirPainelHtml();
            document.getElementById('pdPainelDesktop').innerHTML = html;
            document.getElementById('pdPainelMobileConteudo').innerHTML = html;
        }

        function renderizarTudo() {
            // Independente do resto (grade/turmas/controlador) — só depende
            // de bimestres/diasEspeciais/dataSelecionada, que podem chegar
            // antes ou depois dos outros listeners do Firestore.
            renderizarCalendarioAno();

            if (!gradeCarregada || !turmasCarregada || !controladorCarregada) return;

            // Primeira renderização com tudo carregado, vindo de ?turma= no
            // link: seleciona sozinho o item daquela turma pra abrir direto
            // no painel, sem o professor precisar clicar de novo.
            if (selecaoInicialPendente) {
                selecaoInicialPendente = false;
                const { nome: nomeFiltroInicial } = interpretarFiltroTurma(filtroTurma);
                const item = montarAulasDoDia().find(i => i.turma === nomeFiltroInicial);
                if (item) {
                    chaveSelecionada = encodeURIComponent(chaveDoItem(item));
                    entradaFixadaId = item.entrada ? item.entrada.id : null;
                } else {
                    // Turma sem aula na grade do dia selecionado — o caso
                    // comum ao vir do Dashboard resolver uma turma atrasada.
                    // Seleciona a pendente mais antiga dela automaticamente,
                    // senão o painel abriria em branco mesmo com backlog
                    // esperando pra ser registrado.
                    const pendentes = pendentesDaTurma(filtroTurma);
                    if (pendentes.length > 0) entradaFixadaId = pendentes[0].id;
                }
            }

            renderizarBarraSuperior();
            renderizarLista();
            renderizarPainel();
        }

        // ---------- Carregamento Firestore ----------
        function carregarGrade() {
            return ouvirGrade(escolaAtualId, (docSnap) => {
                const data = docSnap.data();
                gradeAtual = (data && data.matutino && data.vespertino) ? data : { matutino: [], vespertino: [] };
                gradeCarregada = true;
                renderizarTudo();
            });
        }

        function carregarTurmas() {
            return ouvirTurmas(escolaAtualId, (docSnap) => {
                const data = docSnap.data();
                turmasAtuais = normalizarTurmas(data && data.lista);
                turmasCarregada = true;
                talvezSincronizar();
                renderizarTudo();
            });
        }

        function carregarAulas() {
            return ouvirAulas(escolaAtualId, (snapshot) => {
                aulasFirebaseRaw = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
                aulasCarregada = true;
                talvezSincronizar();
            });
        }

        function carregarAtividadesPD() {
            return ouvirAtividades(escolaAtualId, (snapshot) => {
                atividadesCarregadas = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                renderizarTudo();
            });
        }

        // Resolve as atividades vinculadas direto na aula ORIGINAL do Planejamento
        // (via entrada.firebaseId) — não passa pelo Controlador, que só copia
        // campos nomeados explicitamente e nunca soube desse campo.
        function atividadesVinculadasDaEntrada(entrada) {
            if (!entrada || !entrada.firebaseId) return [];
            const aulaOriginal = aulasFirebaseRaw.find(a => a.id === entrada.firebaseId);
            const ids = (aulaOriginal && aulaOriginal.atividadesVinculadas) || [];
            return ids.map(id => atividadesCarregadas.find(at => at.id === id)).filter(Boolean);
        }

        function carregarControlador() {
            return ouvirControlador(escolaAtualId, (docSnap) => {
                const data = docSnap.exists() ? docSnap.data() : null;
                controladorAtual = (data && Array.isArray(data.aulas)) ? data : { aulas: [], aulaAtualId: null };
                controladorCarregada = true;
                renderizarTudo();
            });
        }

        function carregarConfiguracoes() {
            return ouvirConfiguracoes(escolaAtualId, (docSnap) => {
                const data = docSnap.data();
                bimestres = (data && data.bimestres) ? data.bimestres : [];
                diasEspeciais = (data && data.diasEspeciais) ? data.diasEspeciais : [];
                renderizarTudo();
            });
        }

        // ---------- Inicialização ----------
        requireAuth({
            loginPath: '../../login.html',
            onReady: (user) => {
                nomeUsuario = (user.displayName || user.email || '').split(/[\s@]/)[0];
            }
        });

        document.addEventListener('pf-escola-ready', (evento) => {
            escolaAtualId = evento.detail.escolaId;
            gradeCarregada = turmasCarregada = aulasCarregada = controladorCarregada = false;
            chaveSelecionada = null;
            entradaFixadaId = null;
            if (unsubGrade) unsubGrade();
            if (unsubTurmas) unsubTurmas();
            if (unsubAulas) unsubAulas();
            if (unsubControlador) unsubControlador();
            if (unsubAtividades) unsubAtividades();
            if (unsubConfiguracoes) unsubConfiguracoes();
            unsubGrade = carregarGrade();
            unsubTurmas = carregarTurmas();
            unsubAulas = carregarAulas();
            unsubControlador = carregarControlador();
            unsubAtividades = carregarAtividadesPD();
            unsubConfiguracoes = carregarConfiguracoes();
        });
    </script>
</body>
</html>
