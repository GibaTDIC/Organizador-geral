<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROF+ · Planejamento</title>
    <meta name="description" content="PROF+ — assistente inteligente para planejamento e organização do trabalho docente.">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    <link rel="stylesheet" href="../../styles/tokens.css">
    <link rel="stylesheet" href="../../styles/reset.css">
    <link rel="stylesheet" href="../../styles/base.css">
    <link rel="stylesheet" href="../../styles/layout.css">
    <link rel="stylesheet" href="../../styles/components/alert.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        
        .content {
            padding: 30px;
        }

        .form-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid #e0e0e0;
        }

        .form-section h2 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 3px solid #4a90e2;
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4a90e2;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .btn {
            background: #4a90e2;
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .btn:hover {
            background: #357abd;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .search-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid #e0e0e0;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-select {
            flex: 1;
            min-width: 200px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
        }

        .aulas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .aula-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .aula-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .aula-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .aula-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }

        .badge {
            background: #e9ecef;
            color: #495057;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge-primary {
            background: #4a90e2;
            color: white;
        }

        .badge-success {
            background: #28a745;
            color: white;
        }

        .badge-warning {
            background: #ffc107;
            color: #333;
        }

        .badge-info {
            background: #17a2b8;
            color: white;
        }

        .badge-secondary {
            background: #6c757d;
            color: white;
        }

        .habilidades-list {
            margin: 10px 0;
            max-height: 150px;
            overflow-y: auto;
            padding: 5px;
            background: #f8f9fa;
            border-radius: 5px;
        }

        .habilidade-item {
            font-size: 0.85em;
            padding: 3px 5px;
            margin: 2px 0;
            background: white;
            border-radius: 3px;
            border-left: 3px solid #4a90e2;
        }

        .aula-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 13px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            flex: 1;
        }

        .btn-edit {
            background: #ffc107;
            color: #333;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-view {
            background: #17a2b8;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            border: 1px solid #f5c6cb;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            border: 1px solid #c3e6cb;
        }

        .info-message {
            background: #d1ecf1;
            color: #0c5460;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            border: 1px solid #bee5eb;
            font-size: 0.9em;
        }

        .habilidades-container {
            max-height: 250px;
            overflow-y: auto;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            background: white;
        }

        .habilidade-checkbox {
            display: block;
            margin: 8px 0;
            padding: 5px;
            border-bottom: 1px solid #eee;
        }

        .habilidade-checkbox:last-child {
            border-bottom: none;
        }

        .habilidade-checkbox label {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            cursor: pointer;
            font-weight: normal;
            color: #333;
        }

        .habilidade-checkbox input[type="checkbox"] {
            width: auto;
            margin-top: 3px;
            flex-shrink: 0;
        }

        .habilidade-descricao {
            font-size: 0.9em;
            color: #666;
        }

        .numero-aulas {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .numero-aulas input[type="number"] {
            width: 80px;
            text-align: center;
        }

        .numero-aulas span {
            color: #666;
            font-size: 0.9em;
        }

        .especificacao-group {
            transition: all 0.3s ease;
        }

        .especificacao-group.hidden {
            display: none;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }
            
            .content {
                padding: 15px;
            }
            
            .aulas-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="pf-app-shell">
        <pf-header></pf-header>
        <pf-sidebar active="planejamento"></pf-sidebar>
        <div class="pf-app-main">
    <div class="container">
        <header>
            <h1>📚 Programa de Aulas - Educação Física</h1>
            <p>Sistema de planejamento baseado na BNCC para Educação Física - Ensino Fundamental</p>
        </header>

        <div class="content">
            <!-- Seção de Adição de Aulas -->
            <div class="form-section">
                <h2>➕ Adicionar Nova Aula</h2>
                <form id="aulaForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="titulo">Título da Aula *</label>
                            <input type="text" id="titulo" required placeholder="Ex: Jogos e Brincadeiras Populares">
                        </div>

                        <div class="form-group">
                            <label for="turma">Turma *</label>
                            <select id="turma" required onchange="atualizarUnidadesTematicas()">
                                <option value="">Selecione a turma</option>
                                <option value="1º Ano">1º Ano - Ensino Fundamental (Anos Iniciais)</option>
                                <option value="2º Ano">2º Ano - Ensino Fundamental (Anos Iniciais)</option>
                                <option value="3º Ano">3º Ano - Ensino Fundamental (Anos Iniciais)</option>
                                <option value="4º Ano">4º Ano - Ensino Fundamental (Anos Iniciais)</option>
                                <option value="5º Ano">5º Ano - Ensino Fundamental (Anos Iniciais)</option>
                                <option value="6º Ano">6º Ano - Ensino Fundamental (Anos Finais)</option>
                                <option value="7º Ano">7º Ano - Ensino Fundamental (Anos Finais)</option>
                                <option value="8º Ano">8º Ano - Ensino Fundamental (Anos Finais)</option>
                                <option value="9º Ano">9º Ano - Ensino Fundamental (Anos Finais)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="unidadeTematica">Unidade Temática (BNCC) *</label>
                            <select id="unidadeTematica" required onchange="atualizarEspecificacoes()">
                                <option value="">Selecione a turma primeiro</option>
                            </select>
                        </div>

                        <!-- NOVO CAMPO: Especificação da Unidade Temática -->
                        <div class="form-group especificacao-group hidden" id="especificacaoGroup">
                            <label for="especificacao">Especificação *</label>
                            <select id="especificacao" onchange="atualizarHabilidades()">
                                <option value="">Selecione a especificação</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="objetoConhecimento">Objeto de Conhecimento *</label>
                            <input type="text" id="objetoConhecimento" required placeholder="Ex: Jogos populares do Brasil e do mundo">
                        </div>

                        <div class="form-group">
                            <label>Quantidade de Aulas *</label>
                            <div class="numero-aulas">
                                <input type="number" id="numeroAulas" min="1" max="10" value="1" required>
                                <span>(1 a 10 aulas)</span>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Habilidades da BNCC * (selecione uma ou mais)</label>
                        <div id="habilidadesContainer" class="habilidades-container">
                            <p style="color: #666; text-align: center;">Selecione a turma, unidade temática e especificação primeiro</p>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="descricao">Descrição da Aula / Atividades *</label>
                        <textarea id="descricao" required placeholder="Descreva os objetivos, atividades e metodologia da aula..."></textarea>
                    </div>

                    <button type="submit" class="btn">📅 Salvar Aula</button>
                </form>
            </div>

            <!-- Seção de Busca e Filtros -->
            <div class="search-section">
                <h2>🔍 Buscar Aulas</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Pesquisar por título, descrição ou objeto de conhecimento...">
                    <button class="btn btn-secondary" id="searchBtn">Buscar</button>
                </div>
                
                <div class="filters">
                    <select class="filter-select" id="filterTurma">
                        <option value="">Todas as Turmas</option>
                        <option value="1º Ano">1º Ano</option>
                        <option value="2º Ano">2º Ano</option>
                        <option value="3º Ano">3º Ano</option>
                        <option value="4º Ano">4º Ano</option>
                        <option value="5º Ano">5º Ano</option>
                        <option value="6º Ano">6º Ano</option>
                        <option value="7º Ano">7º Ano</option>
                        <option value="8º Ano">8º Ano</option>
                        <option value="9º Ano">9º Ano</option>
                    </select>
                    
                    <select class="filter-select" id="filterUnidade">
                        <option value="">Todas as Unidades</option>
                    </select>

                    <!-- NOVO FILTRO: Especificação -->
                    <select class="filter-select" id="filterEspecificacao">
                        <option value="">Todas as Especificações</option>
                    </select>
                </div>
            </div>

            <!-- Lista de Aulas -->
            <h2>📋 Aulas Planejadas</h2>
            <div id="aulasList" class="aulas-grid">
                <!-- As aulas serão carregadas aqui via JavaScript -->
            </div>
        </div>
    </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Importar Firebase
        import "../../scripts/layout/page-shell.js";
        import { requireAuth } from "../../scripts/services/auth-guard.js";
        import { showToast } from "../../scripts/components/pf-alert.js";
        import { ouvirAulas, criarAula, atualizarAula, excluirAula as excluirAulaService } from "../../scripts/services/aulas-service.js";
        import { unidadesPorAno, especificacoesPorUnidade, habilidadesBNCC } from "../../data/bncc-curriculum.js";

        // Elementos DOM
        const form = document.getElementById('aulaForm');
        const aulasList = document.getElementById('aulasList');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const filterTurma = document.getElementById('filterTurma');
        const filterUnidade = document.getElementById('filterUnidade');
        const filterEspecificacao = document.getElementById('filterEspecificacao');
        const turmaSelect = document.getElementById('turma');
        const unidadeTematicaSelect = document.getElementById('unidadeTematica');
        const especificacaoSelect = document.getElementById('especificacao');
        const especificacaoGroup = document.getElementById('especificacaoGroup');
        const habilidadesContainer = document.getElementById('habilidadesContainer');
        const numeroAulasInput = document.getElementById('numeroAulas');

        // Estado da aplicação
        let todasAulas = [];
        let aulaEditando = null;

        // Função para atualizar unidades temáticas com base na turma selecionada
        window.atualizarUnidadesTematicas = function() {
            const turmaSelecionada = turmaSelect.value;
            
            // Limpar selects
            unidadeTematicaSelect.innerHTML = '';
            filterUnidade.innerHTML = '<option value="">Todas as Unidades</option>';
            filterEspecificacao.innerHTML = '<option value="">Todas as Especificações</option>';
            
            // Esconder campo de especificação
            especificacaoGroup.classList.add('hidden');
            especificacaoSelect.innerHTML = '<option value="">Selecione a especificação</option>';
            
            if (!turmaSelecionada) {
                unidadeTematicaSelect.innerHTML = '<option value="">Selecione a turma primeiro</option>';
                habilidadesContainer.innerHTML = '<p style="color: #666; text-align: center;">Selecione a turma, unidade temática e especificação primeiro</p>';
                return;
            }
            
            // Obter unidades temáticas para o ano selecionado
            const unidades = unidadesPorAno[turmaSelecionada] || [];
            
            if (unidades.length === 0) {
                unidadeTematicaSelect.innerHTML = '<option value="">Nenhuma unidade encontrada</option>';
                return;
            }
            
            // Adicionar opção padrão
            const optionDefault = document.createElement('option');
            optionDefault.value = '';
            optionDefault.textContent = 'Selecione a unidade temática';
            unidadeTematicaSelect.appendChild(optionDefault);
            
            // Adicionar unidades temáticas
            unidades.forEach(unidade => {
                const option = document.createElement('option');
                option.value = unidade;
                option.textContent = unidade;
                unidadeTematicaSelect.appendChild(option);
                
                // Adicionar ao filtro também
                const filterOption = document.createElement('option');
                filterOption.value = unidade;
                filterOption.textContent = unidade;
                filterUnidade.appendChild(filterOption);
            });
            
            // Limpar habilidades
            habilidadesContainer.innerHTML = '<p style="color: #666; text-align: center;">Selecione uma unidade temática</p>';
        };

        // NOVA FUNÇÃO: Atualizar especificações com base na unidade temática
        window.atualizarEspecificacoes = function() {
            const unidadeSelecionada = unidadeTematicaSelect.value;
            
            // Limpar select de especificação
            especificacaoSelect.innerHTML = '<option value="">Selecione a especificação</option>';
            
            if (!unidadeSelecionada) {
                especificacaoGroup.classList.add('hidden');
                habilidadesContainer.innerHTML = '<p style="color: #666; text-align: center;">Selecione uma unidade temática</p>';
                return;
            }
            
            // Obter especificações para a unidade selecionada
            const especificacoes = especificacoesPorUnidade[unidadeSelecionada] || [];
            
            if (especificacoes.length > 0) {
                // Mostrar campo de especificação
                especificacaoGroup.classList.remove('hidden');
                
                // Adicionar especificações
                especificacoes.forEach(espec => {
                    const option = document.createElement('option');
                    option.value = espec;
                    option.textContent = espec;
                    especificacaoSelect.appendChild(option);
                });
                
                // Atualizar filtro de especificação
                filterEspecificacao.innerHTML = '<option value="">Todas as Especificações</option>';
                especificacoes.forEach(espec => {
                    const option = document.createElement('option');
                    option.value = espec;
                    option.textContent = espec;
                    filterEspecificacao.appendChild(option);
                });
                
                habilidadesContainer.innerHTML = '<p style="color: #666; text-align: center;">Selecione uma especificação</p>';
            } else {
                // Se não há especificações, esconder o campo
                especificacaoGroup.classList.add('hidden');
                filterEspecificacao.innerHTML = '<option value="">Todas as Especificações</option>';
                
                // Buscar habilidades diretamente da unidade temática (sem especificação)
                const turmaSelecionada = turmaSelect.value;
                const habilidadesTurma = habilidadesBNCC[turmaSelecionada];
                
                if (habilidadesTurma && habilidadesTurma[unidadeSelecionada]) {
                    // Se a unidade temática tem habilidades diretas (sem especificação)
                    const habilidades = [];
                    Object.values(habilidadesTurma[unidadeSelecionada]).forEach(especHabilidades => {
                        habilidades.push(...especHabilidades);
                    });
                    
                    exibirHabilidades(habilidades);
                }
            }
        };

        // Função para atualizar habilidades com base na turma, unidade e especificação
        window.atualizarHabilidades = function() {
            const turmaSelecionada = turmaSelect.value;
            const unidadeSelecionada = unidadeTematicaSelect.value;
            const especificacaoSelecionada = especificacaoSelect.value;
            
            if (!turmaSelecionada || !unidadeSelecionada) {
                habilidadesContainer.innerHTML = '<p style="color: #666; text-align: center;">Selecione a turma e unidade temática primeiro</p>';
                return;
            }
            
            // Se tem especificação, mas não foi selecionada
            if (especificacaoGroup.classList.contains('hidden') === false && !especificacaoSelecionada) {
                habilidadesContainer.innerHTML = '<p style="color: #666; text-align: center;">Selecione uma especificação</p>';
                return;
            }
            
            // Buscar habilidades
            const habilidadesTurma = habilidadesBNCC[turmaSelecionada];
            if (!habilidadesTurma) {
                habilidadesContainer.innerHTML = '<p style="color: #666; text-align: center;">Nenhuma habilidade encontrada para esta turma</p>';
                return;
            }
            
            const habilidadesUnidade = habilidadesTurma[unidadeSelecionada];
            if (!habilidadesUnidade) {
                habilidadesContainer.innerHTML = '<p style="color: #666; text-align: center;">Nenhuma habilidade encontrada para esta unidade</p>';
                return;
            }
            
            let habilidades = [];
            
            if (especificacaoSelecionada) {
                // Buscar habilidades da especificação selecionada
                habilidades = habilidadesUnidade[especificacaoSelecionada] || [];
            } else {
                // Se não há especificação, pegar todas as habilidades da unidade
                Object.values(habilidadesUnidade).forEach(especHabilidades => {
                    habilidades.push(...especHabilidades);
                });
            }
            
            exibirHabilidades(habilidades);
        };

        // Função auxiliar para exibir habilidades
        function exibirHabilidades(habilidades) {
            if (habilidades.length === 0) {
                habilidadesContainer.innerHTML = '<p style="color: #666; text-align: center;">Nenhuma habilidade disponível para esta combinação</p>';
                return;
            }
            
            // Remover duplicatas (mesmo código)
            const habilidadesUnicas = [];
            const codigosVistos = new Set();
            
            habilidades.forEach(habilidade => {
                if (!codigosVistos.has(habilidade.codigo)) {
                    codigosVistos.add(habilidade.codigo);
                    habilidadesUnicas.push(habilidade);
                }
            });
            
            // Criar checkboxes para cada habilidade
            let html = '<div style="margin-bottom: 10px;"><strong>Selecione as habilidades trabalhadas:</strong></div>';
            
            habilidadesUnicas.forEach(habilidade => {
                html += `
                    <div class="habilidade-checkbox">
                        <label>
                            <input type="checkbox" name="habilidades" value="${habilidade.codigo}" data-descricao="${habilidade.descricao.replace(/"/g, '&quot;')}">
                            <div>
                                <strong>${habilidade.codigo}</strong><br>
                                <span class="habilidade-descricao">${habilidade.descricao}</span>
                            </div>
                        </label>
                    </div>
                `;
            });
            
            habilidadesContainer.innerHTML = html;
        }

        // Função para obter habilidades selecionadas
        function getHabilidadesSelecionadas() {
            const checkboxes = document.querySelectorAll('input[name="habilidades"]:checked');
            return Array.from(checkboxes).map(cb => ({
                codigo: cb.value,
                descricao: cb.getAttribute('data-descricao')
            }));
        }

        // Carregar aulas do Firebase
       function carregarAulas() {
    ouvirAulas((snapshot) => {

        if (!snapshot.empty) {

            todasAulas = snapshot.docs.map(docSnap => ({
                id: docSnap.id,
                ...docSnap.data()
            }));

            aplicarFiltros();

        } else {
            todasAulas = [];
            aulasList.innerHTML = '<p style="text-align: center; color: #666; grid-column: 1/-1;">Nenhuma aula cadastrada ainda.</p>';
        }

    });
}
        // Aplicar filtros e busca
        function aplicarFiltros() {
            const termoBusca = searchInput.value.toLowerCase();
            const turmaFiltro = filterTurma.value;
            const unidadeFiltro = filterUnidade.value;
            const especificacaoFiltro = filterEspecificacao.value;

            let aulasFiltradas = todasAulas.filter(aula => {
                const matchesBusca = termoBusca === '' || 
                    aula.titulo?.toLowerCase().includes(termoBusca) ||
                    aula.descricao?.toLowerCase().includes(termoBusca) ||
                    aula.objetoConhecimento?.toLowerCase().includes(termoBusca);
                
                const matchesTurma = turmaFiltro === '' || aula.turma === turmaFiltro;
                const matchesUnidade = unidadeFiltro === '' || aula.unidadeTematica === unidadeFiltro;
                const matchesEspecificacao = especificacaoFiltro === '' || aula.especificacao === especificacaoFiltro;

                return matchesBusca && matchesTurma && matchesUnidade && matchesEspecificacao;
            });

            exibirAulas(aulasFiltradas);
        }

        // Exibir aulas na tela
        function exibirAulas(aulas) {
            if (aulas.length === 0) {
                aulasList.innerHTML = '<p style="text-align: center; color: #666; grid-column: 1/-1;">Nenhuma aula encontrada com os filtros atuais.</p>';
                return;
            }

            aulasList.innerHTML = aulas.map(aula => {
                // Formatar lista de habilidades
                const habilidadesList = Array.isArray(aula.habilidades) 
                    ? aula.habilidades.map(h => 
                        `<div class="habilidade-item">${h.codigo || h}</div>`
                      ).join('')
                    : `<div class="habilidade-item">${aula.habilidade || 'Habilidade não definida'}</div>`;

                return `
                <div class="aula-card" data-id="${aula.id}">
                    <h3>${aula.titulo || 'Sem título'}</h3>
                    <div class="aula-meta">
                        <span class="badge badge-primary">${aula.turma || 'Turma não definida'}</span>
                        <span class="badge badge-success">${aula.unidadeTematica || 'Unidade não definida'}</span>
                        ${aula.especificacao ? `<span class="badge badge-secondary">${aula.especificacao}</span>` : ''}
                        <span class="badge badge-info">${aula.numeroAulas || 1} aula(s)</span>
                    </div>
                    <p><strong>Objeto de Conhecimento:</strong> ${aula.objetoConhecimento || 'Não especificado'}</p>
                    <div class="habilidades-list">
                        <strong>Habilidades:</strong>
                        ${habilidadesList}
                    </div>
                    <p><strong>Descrição:</strong> ${aula.descricao ? aula.descricao.substring(0, 100) + '...' : 'Sem descrição'}</p>
                    <div class="aula-actions">
                        <button class="btn-small btn-view" onclick="window.visualizarAula('${aula.id}')">👁️ Visualizar</button>
                        <button class="btn-small btn-edit" onclick="window.editarAula('${aula.id}')">✏️ Editar</button>
                        <button class="btn-small btn-delete" onclick="window.excluirAula('${aula.id}')">🗑️ Excluir</button>
                    </div>
                </div>
            `}).join('');
        }

        // Salvar aula
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const habilidadesSelecionadas = getHabilidadesSelecionadas();

            if (habilidadesSelecionadas.length === 0) {
                mostrarMensagem('Selecione pelo menos uma habilidade.', 'error');
                return;
            }

            const aulaData = {
                titulo: document.getElementById('titulo').value,
                turma: document.getElementById('turma').value,
                unidadeTematica: document.getElementById('unidadeTematica').value,
                especificacao: document.getElementById('especificacao').value || null,
                objetoConhecimento: document.getElementById('objetoConhecimento').value,
                habilidades: habilidadesSelecionadas,
                numeroAulas: parseInt(document.getElementById('numeroAulas').value) || 1,
                descricao: document.getElementById('descricao').value,
                timestamp: new Date().toISOString()
            };

            // Validar se todos os campos obrigatórios foram preenchidos
            if (!aulaData.turma || !aulaData.unidadeTematica) {
                mostrarMensagem('Por favor, preencha todos os campos obrigatórios: turma e unidade temática.', 'error');
                return;
            }

            try {
                if (aulaEditando) {
                    // Atualizar aula existente
                    await atualizarAula(aulaEditando, aulaData);
                    mostrarMensagem('Aula atualizada com sucesso!', 'success');
                    aulaEditando = null;
                } else {
                    // Criar nova aula
                    await criarAula(aulaData);
                    mostrarMensagem('Aula salva com sucesso!', 'success');
                }

                form.reset();
                // Resetar os selects
                numeroAulasInput.value = 1;
                await atualizarUnidadesTematicas();
                especificacaoGroup.classList.add('hidden');
                habilidadesContainer.innerHTML = '<p style="color: #666; text-align: center;">Selecione a turma, unidade temática e especificação primeiro</p>';
            } catch (error) {
                console.error('Erro ao salvar aula:', error);
                mostrarMensagem('Erro ao salvar aula. Tente novamente.', 'error');
            }
        });

        // Funções globais para os botões
        window.editarAula = (id) => {
            const aula = todasAulas.find(a => a.id === id);
            if (aula) {
                document.getElementById('titulo').value = aula.titulo || '';
                document.getElementById('turma').value = aula.turma || '';
                document.getElementById('numeroAulas').value = aula.numeroAulas || 1;
                document.getElementById('descricao').value = aula.descricao || '';
                
                // Atualizar unidades temáticas e aguardar
                atualizarUnidadesTematicas();
                
                // Aguardar um momento para o select ser preenchido e então selecionar a unidade
                setTimeout(() => {
                    document.getElementById('unidadeTematica').value = aula.unidadeTematica || '';
                    
                    // Atualizar especificações
                    atualizarEspecificacoes();
                    
                    // Aguardar especificações carregarem e selecionar
                    setTimeout(() => {
                        if (aula.especificacao) {
                            document.getElementById('especificacao').value = aula.especificacao || '';
                        }
                        
                        // Atualizar habilidades
                        atualizarHabilidades();
                        
                        // Aguardar checkboxes serem criados e marcar os selecionados
                        setTimeout(() => {
                            const habilidadesArray = Array.isArray(aula.habilidades) ? aula.habilidades : [];
                            
                            habilidadesArray.forEach(habilidade => {
                                const codigo = typeof habilidade === 'string' ? habilidade : habilidade.codigo;
                                const checkbox = document.querySelector(`input[name="habilidades"][value="${codigo}"]`);
                                if (checkbox) {
                                    checkbox.checked = true;
                                }
                            });
                            
                            document.getElementById('objetoConhecimento').value = aula.objetoConhecimento || '';
                        }, 200);
                    }, 200);
                }, 200);
                
                aulaEditando = id;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        window.visualizarAula = (id) => {
            const aula = todasAulas.find(a => a.id === id);
            if (aula) {
                let habilidadesTexto = '';
                if (Array.isArray(aula.habilidades)) {
                    habilidadesTexto = aula.habilidades.map(h => 
                        `\n   • ${h.codigo || h}: ${h.descricao || ''}`
                    ).join('');
                } else {
                    habilidadesTexto = `\n   • ${aula.habilidade || 'Habilidade não definida'}`;
                }

                alert(`
📋 DETALHES DA AULA
===================
Título: ${aula.titulo}
Turma: ${aula.turma}
Unidade Temática: ${aula.unidadeTematica}
${aula.especificacao ? `Especificação: ${aula.especificacao}` : ''}
Número de Aulas: ${aula.numeroAulas || 1}
Objeto de Conhecimento: ${aula.objetoConhecimento}

📌 HABILIDADES BNCC:
${habilidadesTexto}

📝 DESCRIÇÃO:
${aula.descricao}
                `);
            }
        };

        window.excluirAula = async (id) => {
            if (confirm('Tem certeza que deseja excluir esta aula?')) {
                try {
                    await excluirAulaService(id);
                    mostrarMensagem('Aula excluída com sucesso!', 'success');
                } catch (error) {
                    console.error('Erro ao excluir aula:', error);
                    mostrarMensagem('Erro ao excluir aula. Tente novamente.', 'error');
                }
            }
        };

        // Função para mostrar mensagens
        function mostrarMensagem(texto, tipo) {
            showToast(texto, tipo);
        }

        // Event listeners para filtros e busca
        searchInput.addEventListener('input', aplicarFiltros);
        searchBtn.addEventListener('click', aplicarFiltros);
        filterTurma.addEventListener('change', aplicarFiltros);
        filterUnidade.addEventListener('change', aplicarFiltros);
        filterEspecificacao.addEventListener('change', aplicarFiltros);

        // 🔒 Exige login para acessar esta página
        requireAuth({
            loginPath: '../../login.html',
            onReady: () => {
                // Só carrega os dados depois de confirmar que o professor está logado
                carregarAulas();
                atualizarUnidadesTematicas();
            }
        });
    </script>
</body>
</html>
