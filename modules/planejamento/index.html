<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prof GB · Planejamento</title>
    <meta name="description" content="Prof GB — assistente inteligente para planejamento e organização do trabalho docente.">

    <style>
        body { background: var(--pf-gray-100); }

        .pl-barra {
            display: flex;
            flex-wrap: wrap;
            gap: var(--pf-space-3);
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--pf-space-4);
        }

        .pl-barra-campos {
            display: flex;
            flex-wrap: wrap;
            gap: var(--pf-space-2);
            align-items: center;
        }

        .pl-barra-campos input[type="number"] {
            width: 90px;
            padding: var(--pf-space-2) var(--pf-space-3);
            border: 2px solid var(--pf-gray-300);
            border-radius: var(--pf-radius-md);
            font-size: 14px;
        }

        .pl-layout {
            display: grid;
            grid-template-columns: 260px 1fr 300px;
            gap: var(--pf-space-4);
            align-items: start;
        }

        @media (max-width: 1100px) {
            .pl-layout { grid-template-columns: 220px 1fr; }
            .pl-painel-auxiliar { grid-column: 1 / -1; }
        }

        @media (max-width: 700px) {
            .pl-layout { grid-template-columns: 1fr; }
            .pl-painel-auxiliar { grid-column: auto; }
        }

        /* Árvore lateral */
        .pl-arvore-nivel {
            margin-bottom: var(--pf-space-1);
        }

        .pl-arvore-item {
            display: flex;
            align-items: center;
            gap: var(--pf-space-2);
            padding: var(--pf-space-2) var(--pf-space-2);
            border-radius: var(--pf-radius-md);
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--pf-gray-700);
        }

        .pl-arvore-item:hover { background: var(--pf-gray-100); }
        .pl-arvore-item--selecionado { background: var(--pf-blue-700); color: var(--pf-white); font-weight: 600; }
        .pl-arvore-item--vazio { color: var(--pf-gray-500); font-style: italic; }

        /* Indicador de "hoje" — só visual, mesmo acento do banner do Dashboard. */
        .pl-arvore-item--hoje { box-shadow: inset 3px 0 0 var(--pf-orange-500); }

        .pl-arvore-toggle {
            flex-shrink: 0;
            width: 14px;
            text-align: center;
            color: var(--pf-gray-500);
        }
        .pl-arvore-item--selecionado .pl-arvore-toggle { color: inherit; }

        .pl-arvore-anual { font-weight: 700; }
        .pl-arvore-bimestre { padding-left: var(--pf-space-2); font-weight: 600; }
        .pl-arvore-mes { padding-left: var(--pf-space-4); }
        .pl-arvore-aula { padding-left: var(--pf-space-6); font-size: 0.8rem; }

        .pl-badge-count {
            margin-left: auto;
            font-size: 0.68rem;
            background: var(--pf-gray-200);
            color: var(--pf-gray-700);
            padding: 1px 6px;
            border-radius: var(--pf-radius-lg);
        }
        .pl-arvore-item--selecionado .pl-badge-count { background: rgba(255,255,255,0.25); color: var(--pf-white); }

        /* Área principal */
        .pl-area-principal h2 {
            font-size: 1.1rem;
            color: var(--pf-gray-900);
            margin-bottom: var(--pf-space-2);
        }

        .pl-indicador {
            font-size: 0.78rem;
            color: var(--pf-gray-500);
            background: var(--pf-gray-100);
            padding: var(--pf-space-2) var(--pf-space-3);
            border-radius: var(--pf-radius-md);
            margin-bottom: var(--pf-space-3);
            display: inline-block;
        }

        .pl-acoes {
            display: flex;
            flex-wrap: wrap;
            gap: var(--pf-space-2);
            margin-top: var(--pf-space-3);
        }

        .pl-estado-vazio {
            color: var(--pf-gray-500);
            font-size: 0.9rem;
            padding: var(--pf-space-4);
            text-align: center;
        }

        .habilidades-container {
            max-height: 220px;
            overflow-y: auto;
            border: 2px solid var(--pf-gray-300);
            border-radius: var(--pf-radius-md);
            padding: var(--pf-space-2);
            background: var(--pf-white);
        }

        .habilidade-checkbox { display: block; margin: var(--pf-space-1) 0; padding: 4px; border-bottom: 1px solid var(--pf-gray-200); }
        .habilidade-checkbox:last-child { border-bottom: none; }
        .habilidade-checkbox label { display: flex; align-items: flex-start; gap: var(--pf-space-2); cursor: pointer; font-weight: normal; }
        .habilidade-checkbox input[type="checkbox"] { width: auto; margin-top: 3px; flex-shrink: 0; }
        .habilidade-descricao { font-size: 0.82rem; color: var(--pf-gray-500); }

        .pl-unidade-checkbox { display: inline-flex; align-items: center; gap: 4px; margin: 2px 6px 2px 0; font-size: 0.82rem; }

        .especificacao-group.hidden { display: none; }

        /* Painel auxiliar */
        .pl-painel-auxiliar h3 {
            font-size: 0.85rem;
            color: var(--pf-blue-700);
            margin-bottom: var(--pf-space-2);
        }

        .pl-painel-secao { margin-bottom: var(--pf-space-4); }

        .pl-historico-item {
            font-size: 0.78rem;
            color: var(--pf-gray-700);
            background: var(--pf-gray-100);
            border-radius: var(--pf-radius-md);
            padding: var(--pf-space-2);
            margin-bottom: var(--pf-space-2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--pf-space-2);
        }

        @media print {
            pf-header, pf-sidebar, .pl-barra, .pl-layout > :not(.pl-area-principal) {
                display: none !important;
            }
            .pl-layout { grid-template-columns: 1fr !important; }
        }
    </style>
</head>
<body>
    <div class="pf-app-shell">
        <pf-header></pf-header>
        <pf-sidebar active="planejamento"></pf-sidebar>
        <div class="pf-app-main">
            <div class="container">

                <div class="pf-card pl-barra">
                    <div class="pl-barra-campos">
                        <label style="font-size:0.8rem;color:var(--pf-gray-700);">Ano letivo</label>
                        <input type="number" id="plAnoLetivo" min="2020" max="2099">
                        <select class="pf-filter-select" id="plTurma"></select>
                    </div>
                    <div class="pl-barra-campos">
                        <div class="pf-search-field">
                            <input type="text" id="plBusca" placeholder="Buscar aula por título ou conteúdo...">
                        </div>
                        <button class="pf-btn pf-btn--info" onclick="imprimirSelecionado()">🖨️ Imprimir</button>
                    </div>
                </div>

                <div class="pl-layout">
                    <aside class="pf-card" id="plArvoreCard">
                        <h3 style="font-size:0.85rem;color:var(--pf-blue-700);margin-bottom:var(--pf-space-2);">🌳 Planejamento</h3>
                        <button class="pf-btn pf-btn--success" style="width:100%;margin-bottom:var(--pf-space-3);font-size:0.8rem;" onclick="document.getElementById('modalNovoPlanejamento').open()">➕ Novo Planejamento</button>
                        <div id="plArvore"><p class="pl-estado-vazio">Carregando…</p></div>
                    </aside>

                    <main class="pf-card pl-area-principal" id="plAreaPrincipal">
                        <p class="pl-estado-vazio">Selecione um item na árvore ao lado.</p>
                    </main>

                    <aside class="pf-card pl-painel-auxiliar" id="plPainelAuxiliar">
                        <p class="pl-estado-vazio">Nada selecionado ainda.</p>
                    </aside>
                </div>

            </div>
        </div>
    </div>

    <pf-modal id="modalNovoPlanejamento">
        <div class="pf-modal-header">
            <h2 style="font-size:1.1rem;">Como deseja criar o planejamento?</h2>
            <span style="cursor:pointer;" onclick="document.getElementById('modalNovoPlanejamento').close()">&times;</span>
        </div>
        <div class="pf-modal-body" style="display:flex;flex-direction:column;gap:var(--pf-space-3);">
            <button class="pf-btn pf-btn--success" onclick="document.getElementById('modalNovoPlanejamento').close(); novaAulaAvulsa();">✍️ Criar Manualmente</button>
            <button class="pf-btn pf-btn--secondary" onclick="document.getElementById('modalNovoPlanejamento').close(); novaAulaAvulsa();">🤖 Criar com Assistente Pedagógico (IA)</button>
            <button class="pf-btn pf-btn--info" onclick="document.getElementById('modalNovoPlanejamento').close(); document.getElementById('inputArquivoDocx').click();">📄 Importar Planejamento (Word)</button>
        </div>
    </pf-modal>
    <input type="file" id="inputArquivoDocx" accept=".docx" style="display:none;">

    <script type="module">
        import "../../scripts/layout/page-shell.js";
        import "../../scripts/components/pf-modal.js";
        import "../../scripts/services/escola-context.js";
        import { requireAuth } from "../../scripts/services/auth-guard.js";
        import { showToast } from "../../scripts/components/pf-alert.js";
        import { ouvirAulas, criarAula, excluirAula as excluirAulaService } from "../../scripts/services/aulas-service.js";
        import { ouvirAtividades } from "../../scripts/services/atividades-service.js";
        import { buscarAtividadesCompativeis, filtrarAtividadesPorContexto } from "../../scripts/services/atividades-busca.js";
        import { ouvirConfiguracoes } from "../../scripts/services/configuracoes-service.js";
        import { ouvirGrade, COMPONENTE_CURRICULAR_PADRAO, PERIODOS_GRADE } from "../../scripts/services/grade-service.js";
        import * as bnccEducacaoFisica from "../../data/bncc-curriculum.js";
        import * as bnccArte from "../../data/bncc-curriculum-arte.js";
        import * as bnccEnsinoReligioso from "../../data/bncc-curriculum-ensino-religioso.js";
        import * as bnccCiencias from "../../data/bncc-curriculum-ciencias.js";
        import * as bnccGeografia from "../../data/bncc-curriculum-geografia.js";
        import * as bnccHistoria from "../../data/bncc-curriculum-historia.js";
        import * as bnccMatematica from "../../data/bncc-curriculum-matematica.js";
        import * as bnccLinguaInglesa from "../../data/bncc-curriculum-lingua-inglesa.js";
        import * as bnccLinguaPortuguesa from "../../data/bncc-curriculum-lingua-portuguesa.js";
        import * as bnccComputacao from "../../data/bncc-curriculum-computacao.js";
        import { db } from "../../scripts/firebase-config.js";
        import { doc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { salvarComHistorico, ouvirHistorico, restaurarVersao } from "../../scripts/services/historico-service.js";
        import { chamarAssistenteIA } from "../../scripts/services/ia-service.js";
        import { criarImportacaoPlanejamento, atualizarImportacaoPlanejamento } from "../../scripts/services/importacoes-planejamento-service.js";
        import { parseArquivoDocxPlanejamento } from "../../scripts/services/docx-planejamento-parser.js";
        import { sugerirClassificacaoBNCC } from "../../scripts/services/bncc-sugestao.js";
        import {
            ouvirPlanejamentosAnuais, criarPlanejamentoAnual, atualizarPlanejamentoAnual,
            excluirPlanejamentoAnual, duplicarPlanejamentoAnual
        } from "../../scripts/services/planejamento-anual-service.js";
        import {
            ouvirPlanejamentosBimestrais, criarPlanejamentoBimestral, atualizarPlanejamentoBimestral,
            excluirPlanejamentoBimestral, duplicarPlanejamentoBimestral
        } from "../../scripts/services/planejamento-bimestral-service.js";
        import {
            ouvirPlanejamentosMensais, criarPlanejamentoMensal, atualizarPlanejamentoMensal,
            excluirPlanejamentoMensal, duplicarPlanejamentoMensal
        } from "../../scripts/services/planejamento-mensal-service.js";

        // Cada componente com BNCC curada tem seu próprio arquivo em data/,
        // com o mesmo formato (unidadesPorAno/especificacoesPorUnidade/
        // habilidadesBNCC) — ver bncc-curriculum.js e bncc-curriculum-arte.js.
        // Componentes fora deste mapa (ainda sem conteúdo curado) caem no
        // modo de texto livre em atualizarUnidadesTematicas.
        const BNCC_POR_COMPONENTE = {
            [COMPONENTE_CURRICULAR_PADRAO]: bnccEducacaoFisica,
            "Arte": bnccArte,
            "Ensino Religioso": bnccEnsinoReligioso,
            "Ciências": bnccCiencias,
            "Geografia": bnccGeografia,
            "História": bnccHistoria,
            "Matemática": bnccMatematica,
            "Língua Inglesa": bnccLinguaInglesa,
            "Língua Portuguesa": bnccLinguaPortuguesa,
            "Computação": bnccComputacao
        };

        // ---------- Estado ----------
        let escolaAtualId = null;
        let uidAtual = null;
        let unsubAulas = null, unsubConfiguracoes = null, unsubAnuais = null, unsubBimestrais = null, unsubMensais = null;
        let unsubHistoricoAtual = null, unsubAtividades = null, unsubGrade = null;

        let aulasTodas = [];
        let atividadesDisponiveis = [];
        // Semente da lista "Atividades Vinculadas" — só usada na primeira
        // renderização do formulário (container ainda vazio), com os ids já
        // salvos na aula em edição. Depois disso, renderizarAtividadesVinculadas
        // lê o estado atual dos checkboxes direto do DOM a cada recascata.
        let atividadesVinculadasIniciais = [];
        let bimestresConfig = [];
        let planejamentosAnuais = [];
        let planejamentosBimestrais = [];
        let planejamentosMensais = [];
        let historicoAtual = [];
        let gradeHorarios = null; // usado só pra vincular semanas importadas ao mês certo (ver contarSessoesPorMes)

        let turmaAtual = '6º Ano';
        let anoLetivoAtual = new Date().getFullYear();
        let termoBusca = '';
        // Árvore colapsável: quais bimestres/meses estão abertos. Chaves:
        // número do bimestre, e "<bimestre>:<mês>" pro nível de mês. Só é
        // inicializado UMA VEZ (ver inicializarArvoreAberta) pro bimestre/mês
        // de hoje — depois disso o professor controla manualmente, nunca
        // reseta sozinho a cada atualização do Firestore.
        let arvoreBimestresAbertos = new Set();
        let arvoreMesesAbertos = new Set();
        let arvoreInicializada = false;
        // Componentes que a escola leciona (definidos em Configurações) —
        // restringe o seletor de componente do formulário de aula. Fallback
        // cobre escolas criadas antes desse campo existir.
        let componentesAtivos = [COMPONENTE_CURRICULAR_PADRAO];

        // { nivel: 'anual'|'bimestral'|'mensal'|'aula', id: string } — id pode
        // começar com "novo:" pra representar um nó ainda não criado no Firestore.
        let selecionado = null;
        let aulaEditando = null; // id da aula sendo editada, null = criando nova
        let importacaoAtual = null; // rascunho de importação de DOCX em revisão, fora da convenção selecionado.nivel

        // Estado local da tela de Planejamento Bimestral, entre re-renderizações
        // e antes de salvar — permite trocar de componente pra marcar unidades
        // de mais de um (ex: Educação Física e Artes na mesma turma) sem perder
        // o que já foi marcado no componente anterior. Resetado sempre que o
        // bimestral selecionado muda (ver renderizarBimestral).
        let unidadesBimestralSelecionadas = new Set();
        let componenteBimestralAtual = null;
        let bimestralIdEmEdicao = null;

        const TURMAS_DISPONIVEIS = ["1º Ano","2º Ano","3º Ano","4º Ano","5º Ano","6º Ano","7º Ano","8º Ano","9º Ano"];
        const NOMES_MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

        // ---------- Helpers de data (mesmo padrão de configuracoes/index.html) ----------
        function stringParaData(dataStr) {
            const [dia, mes, ano] = dataStr.split('/').map(Number);
            return new Date(ano, mes - 1, dia);
        }

        // Bimestres não se alinham com fronteiras de mês-calendário (um pode
        // terminar dia 16 e o próximo só começar dia 22) — isso só lista quais
        // meses-calendário têm ALGUMA sobreposição com o intervalo, não deriva
        // bimestre a partir de mês nem vice-versa.
        function mesesDoIntervalo(inicioStr, fimStr) {
            const inicio = stringParaData(inicioStr);
            const fim = stringParaData(fimStr);
            const meses = [];
            let cursor = new Date(inicio.getFullYear(), inicio.getMonth(), 1);
            while (cursor <= fim) {
                meses.push({ ano: cursor.getFullYear(), mes: cursor.getMonth() + 1 });
                cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
            }
            return meses;
        }

        function rotuloBimestre(numero) {
            const cfg = bimestresConfig.find(b => b.numero === numero);
            if (!cfg) return `${numero}º Bimestre`;
            return `${numero}º Bimestre (${cfg.inicio.slice(0, 5)} a ${cfg.fim.slice(0, 5)})`;
        }

        function mostrarMensagem(texto, tipo) {
            showToast(texto, tipo);
        }

        // Ordena aulas por dataReferencia (YYYY-MM-DD, só existe em aulas
        // vindas de importação DOCX — comparação lexicográfica já ordena
        // certo nesse formato). Aulas sem data (criadas manualmente) vão pro
        // fim, mantendo a ordem relativa entre si — sem essa data não tem
        // como saber em que período do mês elas cairiam.
        function ordenarAulasPorData(aulas) {
            return [...aulas].sort((a, b) => {
                if (a.dataReferencia && b.dataReferencia) return a.dataReferencia.localeCompare(b.dataReferencia);
                if (a.dataReferencia) return -1;
                if (b.dataReferencia) return 1;
                return 0;
            });
        }

        // Unidades que o professor marcou como planejadas pra um bimestre no
        // Planejamento Bimestral (aba "Unidades Temáticas deste Bimestre") —
        // fonte única da sugestão automática no formulário de aula. Antes essa
        // sugestão lia de Configurações (bimestres[].unidades, comparando em
        // texto livre contra especificações) — consolidado aqui porque
        // Configurações não sabia de componente curricular nenhum, e o
        // Planejamento Bimestral tem esse dado direto por já ser aberto na
        // turma+bimestre certos.
        function unidadesPlanejadasBimestre(numeroBimestre) {
            if (!numeroBimestre) return [];
            const bimestral = encontrarBimestral(numeroBimestre);
            return (bimestral && bimestral.unidadesTematicas) || [];
        }

        // Chamada por atualizarEspecificacoes pra destacar quais objetos de
        // conhecimento já foram planejados pro bimestre — mas o Planejamento
        // Bimestral só guarda unidadesTematicas (nível de unidade), não uma
        // lista de objetos de conhecimento por unidade. Sem essa granularidade
        // ainda, não tem "sugeridas" real pra devolver: retorna [] de propósito,
        // o que faz atualizarEspecificacoes cair no branch normal e listar
        // todos os objetos da unidade (sem o destaque "planejado pro
        // bimestre", que exigiria uma extensão futura do Planejamento
        // Bimestral pra guardar isso).
        function especificacoesSugeridasBimestre() {
            return [];
        }

        // ---------- Cascata BNCC (turma → unidade → especificação → habilidades) ----------
        // Só existe conteúdo curado (data/bncc-curriculum.js) pra Educação
        // Física — pra qualquer outro componente que a escola tenha marcado
        // como ativo em Configurações, "Unidade Temática" e "Habilidades"
        // viram campos de texto livre, sem cascata nenhuma. Trocar o
        // <select id="unidadeTematica"> por um <input> (e vice-versa) mantendo
        // o mesmo id evita qualquer mudança em salvarAula/gerarObjetivosComIA,
        // que só leem ".value" desse elemento sem saber sua tag.
        function garantirCampoSelecaoOuTexto(id, tipo, onchangeSelect) {
            const atual = document.getElementById(id);
            if (atual && atual.tagName.toLowerCase() === tipo) return atual;
            const valorAnterior = atual ? atual.value : '';
            const novoHtml = tipo === 'input'
                ? `<input type="text" id="${id}" required>`
                : `<select id="${id}" required onchange="${onchangeSelect}"></select>`;
            atual.outerHTML = novoHtml;
            const novo = document.getElementById(id);
            novo.value = valorAnterior;
            return novo;
        }
        function garantirCampoUnidadeTematica(tipo) {
            return garantirCampoSelecaoOuTexto('unidadeTematica', tipo, 'atualizarEspecificacoes()');
        }
        // "especificacao" é o id herdado — desde a mudança pedida pelo
        // usuário, esse campo passou a SER o Objeto de Conhecimento oficial
        // da BNCC (não mais um texto livre separado), então ganhou o mesmo
        // mecanismo de troca select↔input que unidadeTematica já tinha.
        function garantirCampoObjetoConhecimento(tipo) {
            return garantirCampoSelecaoOuTexto('especificacao', tipo, 'atualizarHabilidades()');
        }

        // habilidadesPreSelecionadas (mesma variável usada pela cascata de EF,
        // ver exibirHabilidades) já chega populada pelo fluxo de edição antes
        // de chamar atualizarUnidadesTematicas — reaproveitada aqui pra
        // pré-preencher o textarea ao editar uma aula de outro componente.
        function renderizarHabilidadesLivres() {
            const preSelecionadas = habilidadesPreSelecionadas || [];
            const texto = preSelecionadas.map(h => h.codigo || h).join('\n');
            document.getElementById('habilidadesContainer').innerHTML =
                `<textarea id="habilidadesTextoLivre" rows="4" placeholder="Uma habilidade por linha">${texto.replace(/</g, '&lt;')}</textarea>`;
        }

        // manterUnidade força a inclusão desse valor na lista mesmo que ele não
        // esteja entre as unidades sugeridas do bimestre (edição de uma aula
        // antiga cujo bimestre configurado mudou desde então).
        window.atualizarUnidadesTematicas = function (manterUnidade) {
            const turmaSelect = document.getElementById('turma');
            if (!turmaSelect) return;
            renderizarAtividadesVinculadas();

            const componenteSelect = document.getElementById('plAulaComponente');
            const componenteSelecionado = componenteSelect ? componenteSelect.value : COMPONENTE_CURRICULAR_PADRAO;
            const bncc = BNCC_POR_COMPONENTE[componenteSelecionado];
            const hint = document.getElementById('unidadeTematicaHint');

            if (!bncc) {
                const input = garantirCampoUnidadeTematica('input');
                if (manterUnidade) input.value = manterUnidade;
                input.placeholder = `Ex: unidade temática de ${componenteSelecionado}`;
                const objetoInput = garantirCampoObjetoConhecimento('input');
                objetoInput.placeholder = `Ex: objeto de conhecimento de ${componenteSelecionado}`;
                if (hint) hint.textContent = `O app ainda não tem a BNCC de ${componenteSelecionado} cadastrada — digite livremente.`;
                renderizarHabilidadesLivres();
                return;
            }

            const bimestreSelect = document.getElementById('plAulaBimestre');
            const unidadeTematicaSelect = garantirCampoUnidadeTematica('select');
            garantirCampoObjetoConhecimento('select');
            const habilidadesContainer = document.getElementById('habilidadesContainer');

            const valorAnterior = manterUnidade || unidadeTematicaSelect.value;
            const turmaSelecionada = turmaSelect.value;
            unidadeTematicaSelect.innerHTML = '';
            if (hint) hint.textContent = '';

            if (!turmaSelecionada) {
                unidadeTematicaSelect.innerHTML = '<option value="">Selecione a turma primeiro</option>';
                document.getElementById('especificacao').innerHTML = '<option value="">Selecione a turma primeiro</option>';
                habilidadesContainer.innerHTML = '<p style="color:#666;text-align:center;">Selecione a turma, unidade temática e objeto de conhecimento primeiro</p>';
                return;
            }

            const unidadesDoAno = bncc.unidadesPorAno[turmaSelecionada] || [];
            if (unidadesDoAno.length === 0) {
                unidadeTematicaSelect.innerHTML = '<option value="">Nenhuma unidade encontrada</option>';
                return;
            }

            const optionDefault = document.createElement('option');
            optionDefault.value = '';
            optionDefault.textContent = 'Selecione a unidade temática';
            unidadeTematicaSelect.appendChild(optionDefault);

            // Unidades marcadas como planejadas pra este bimestre no
            // Planejamento Bimestral (ver unidadesPlanejadasBimestre).
            const numeroBimestre = bimestreSelect ? parseInt(bimestreSelect.value, 10) : null;
            const planejadasNoBimestre = numeroBimestre ? unidadesPlanejadasBimestre(numeroBimestre) : [];
            const sugeridas = unidadesDoAno.filter(u => planejadasNoBimestre.includes(u));
            const restantes = unidadesDoAno.filter(u => !sugeridas.includes(u));

            function adicionarOpcao(destino, unidade) {
                const option = document.createElement('option');
                option.value = unidade;
                option.textContent = unidade;
                destino.appendChild(option);
            }

            if (sugeridas.length > 0) {
                const grupoSugeridas = document.createElement('optgroup');
                grupoSugeridas.label = `✅ Planejadas para o ${numeroBimestre}º Bimestre`;
                sugeridas.forEach(u => adicionarOpcao(grupoSugeridas, u));
                unidadeTematicaSelect.appendChild(grupoSugeridas);

                const grupoRestantes = document.createElement('optgroup');
                grupoRestantes.label = 'Outras unidades desta série';
                restantes.forEach(u => adicionarOpcao(grupoRestantes, u));
                unidadeTematicaSelect.appendChild(grupoRestantes);

                if (hint) {
                    hint.textContent = sugeridas.length === 1
                        ? `Unidade sugerida automaticamente a partir do Planejamento Bimestral do ${numeroBimestre}º Bimestre.`
                        : `${sugeridas.length} unidades planejadas para o ${numeroBimestre}º Bimestre no Planejamento Bimestral — destacadas acima.`;
                }
            } else {
                unidadesDoAno.forEach(u => adicionarOpcao(unidadeTematicaSelect, u));
            }

            if (valorAnterior && unidadesDoAno.includes(valorAnterior)) {
                unidadeTematicaSelect.value = valorAnterior;
            } else if (sugeridas.length === 1) {
                // Reconhecimento automático: só 1 unidade planejada pro bimestre e
                // nada foi escolhido ainda — já seleciona ela.
                unidadeTematicaSelect.value = sugeridas[0];
            }

            habilidadesContainer.innerHTML = '<p style="color:#666;text-align:center;">Selecione uma unidade temática</p>';

            // Se a unidade já saiu selecionada (valor mantido ou sugestão única),
            // a cascata de objeto de conhecimento/habilidades precisa rodar
            // também — só o 'change' do <select> dispara isso sozinho, e aqui
            // não houve clique.
            if (unidadeTematicaSelect.value) {
                atualizarEspecificacoes();
            } else {
                document.getElementById('especificacao').innerHTML = '<option value="">Selecione a unidade temática primeiro</option>';
            }
        };

        // "Especificação" aqui É o Objeto de Conhecimento oficial da BNCC —
        // sempre visível e sempre com pelo menos 1 opção real (nunca mais
        // escondido), derivada diretamente das chaves de
        // bncc.habilidadesBNCC[turma][unidade] (que cobrem TODOS os objetos
        // de uma unidade, mesmo quando ela só tem um só). especificacoesPorUnidade
        // continua existindo só pra alimentar a sugestão do bimestre
        // (destacar quais objetos foram planejados em Configurações).
        window.atualizarEspecificacoes = function () {
            renderizarAtividadesVinculadas();
            const componenteSelect = document.getElementById('plAulaComponente');
            const componenteAtual = componenteSelect ? componenteSelect.value : COMPONENTE_CURRICULAR_PADRAO;
            const bncc = BNCC_POR_COMPONENTE[componenteAtual];
            // Cascata (objeto de conhecimento/habilidades) só existe pra
            // componentes com BNCC curada (ver BNCC_POR_COMPONENTE) — no modo
            // livre, quem cuida do habilidadesContainer é
            // renderizarHabilidadesLivres, chamada só por atualizarUnidadesTematicas.
            if (!bncc) return;
            const turmaSelect = document.getElementById('turma');
            const unidadeTematicaSelect = document.getElementById('unidadeTematica');
            const especificacaoSelect = garantirCampoObjetoConhecimento('select');
            const habilidadesContainer = document.getElementById('habilidadesContainer');
            const hint = document.getElementById('especificacaoHint');

            const valorAnterior = especificacaoSelect.value;
            const unidadeSelecionada = unidadeTematicaSelect.value;
            especificacaoSelect.innerHTML = '';
            if (hint) hint.textContent = '';

            if (!unidadeSelecionada) {
                especificacaoSelect.innerHTML = '<option value="">Selecione a unidade temática primeiro</option>';
                habilidadesContainer.innerHTML = '<p style="color:#666;text-align:center;">Selecione uma unidade temática</p>';
                return;
            }

            const turmaSelecionada = turmaSelect.value;
            const habilidadesTurma = bncc.habilidadesBNCC[turmaSelecionada] || {};
            const objetosDaUnidade = Object.keys(habilidadesTurma[unidadeSelecionada] || {});
            if (objetosDaUnidade.length === 0) {
                especificacaoSelect.innerHTML = '<option value="">Nenhum objeto de conhecimento encontrado</option>';
                habilidadesContainer.innerHTML = '<p style="color:#666;text-align:center;">Nenhuma habilidade encontrada para esta unidade</p>';
                return;
            }

            const optionDefault = document.createElement('option');
            optionDefault.value = '';
            optionDefault.textContent = 'Selecione o objeto de conhecimento';
            especificacaoSelect.appendChild(optionDefault);

            const sugeridas = especificacoesSugeridasBimestre(turmaSelecionada, unidadeSelecionada, componenteAtual)
                .filter(e => objetosDaUnidade.includes(e));
            const restantes = objetosDaUnidade.filter(e => !sugeridas.includes(e));

            function adicionarOpcao(destino, espec) {
                const option = document.createElement('option');
                option.value = espec;
                option.textContent = espec;
                destino.appendChild(option);
            }

            if (sugeridas.length > 0) {
                const grupoSugeridas = document.createElement('optgroup');
                grupoSugeridas.label = '✅ Planejados para este bimestre';
                sugeridas.forEach(e => adicionarOpcao(grupoSugeridas, e));
                especificacaoSelect.appendChild(grupoSugeridas);

                const grupoRestantes = document.createElement('optgroup');
                grupoRestantes.label = 'Outros objetos desta unidade';
                restantes.forEach(e => adicionarOpcao(grupoRestantes, e));
                especificacaoSelect.appendChild(grupoRestantes);

                if (hint) {
                    hint.textContent = sugeridas.length === 1
                        ? 'Objeto de conhecimento sugerido automaticamente a partir do planejamento deste bimestre em Configurações.'
                        : `${sugeridas.length} objetos de conhecimento planejados para este bimestre em Configurações — destacados acima.`;
                }
            } else {
                objetosDaUnidade.forEach(e => adicionarOpcao(especificacaoSelect, e));
            }

            if (valorAnterior && objetosDaUnidade.includes(valorAnterior)) {
                especificacaoSelect.value = valorAnterior;
            } else if (objetosDaUnidade.length === 1) {
                // Só existe 1 objeto de conhecimento pra essa unidade — não
                // faz sentido obrigar o professor a "escolher" entre uma
                // única opção.
                especificacaoSelect.value = objetosDaUnidade[0];
            } else if (sugeridas.length === 1) {
                especificacaoSelect.value = sugeridas[0];
            }

            habilidadesContainer.innerHTML = '<p style="color:#666;text-align:center;">Selecione um objeto de conhecimento</p>';
            if (especificacaoSelect.value) {
                atualizarHabilidades();
            }
        };

        // Lista de checkboxes "Atividades Vinculadas", filtrada pela mesma
        // cascata BNCC da aula (componente + Unidade Temática + Objeto de
        // Conhecimento) via filtrarAtividadesPorContexto — sem isso o
        // professor via TODAS as atividades já cadastradas ali, inclusive de
        // outra Unidade Temática/Objeto de Conhecimento, inviável de rolar
        // conforme o Banco cresce. Uma atividade já marcada continua
        // aparecendo (com aviso) mesmo se deixar de bater no filtro depois
        // que o professor troca a unidade/objeto — pra não "sumir" um
        // vínculo já feito sem o professor perceber.
        function renderizarAtividadesVinculadas() {
            const container = document.getElementById('plAtividadesVinculadas');
            if (!container) return;

            const idsAtuais = container.childElementCount > 0
                ? Array.from(container.querySelectorAll('input:checked')).map(cb => cb.value)
                : atividadesVinculadasIniciais;

            const componenteSelect = document.getElementById('plAulaComponente');
            const componenteCurricular = componenteSelect ? componenteSelect.value : COMPONENTE_CURRICULAR_PADRAO;
            const unidadeTematica = document.getElementById('unidadeTematica')?.value || null;
            const especificacao = document.getElementById('especificacao')?.value || null;

            const normalizadas = atividadesDisponiveis.map(a => ({ ...a, componenteCurricular: a.componenteCurricular || COMPONENTE_CURRICULAR_PADRAO }));
            const filtradas = filtrarAtividadesPorContexto(normalizadas, { componenteCurricular, unidadeTematica, especificacao });
            const idsFiltradas = new Set(filtradas.map(a => a.id));
            const foraDoFiltro = normalizadas.filter(a => idsAtuais.includes(a.id) && !idsFiltradas.has(a.id));
            const listaFinal = [...filtradas, ...foraDoFiltro];

            if (listaFinal.length === 0) {
                container.innerHTML = atividadesDisponiveis.length === 0
                    ? '<p style="color:#666;text-align:center;font-size:0.85rem;">Nenhuma atividade cadastrada no Banco de Atividades ainda.</p>'
                    : '<p style="color:#666;text-align:center;font-size:0.85rem;">Nenhuma atividade do Banco bate com a Unidade Temática/Objeto de Conhecimento selecionados.</p>';
                return;
            }

            container.innerHTML = listaFinal.map(at => `
                <label style="display:flex;align-items:center;gap:6px;font-size:0.85rem;padding:3px 0;font-weight:normal;">
                    <input type="checkbox" name="plAtividadeVinculada" value="${at.id}" style="width:auto;" ${idsAtuais.includes(at.id) ? 'checked' : ''}>
                    ${at.titulo} <span style="color:var(--pf-gray-500);">(${at.tipo || 'Outros'})</span>${!idsFiltradas.has(at.id) ? ' <span style="color:var(--pf-gray-500);">— fora do filtro atual</span>' : ''}
                </label>
            `).join('');
        }

        // Painel de "atividades compatíveis já cadastradas", acima da lista
        // de checkboxes "Atividades Vinculadas" — não duplica a lista, só
        // pré-marca um checkbox já existente quando o professor clica
        // "+ Vincular" numa sugestão. Só funciona pra componentes com BNCC
        // curada (precisa de código de habilidade pra comparar) — em
        // componentes de texto livre (renderizarHabilidadesLivres) o painel
        // fica vazio, sem chamada nenhuma daqui.
        function renderizarSugestoesAtividadesCompativeis() {
            const container = document.getElementById('plSugestoesAtividades');
            if (!container) return;
            const componenteSelect = document.getElementById('plAulaComponente');
            const componenteCurricular = componenteSelect ? componenteSelect.value : COMPONENTE_CURRICULAR_PADRAO;
            const unidadeTematica = document.getElementById('unidadeTematica')?.value;
            if (!unidadeTematica) { container.innerHTML = ''; return; }

            const jaVinculadas = Array.from(document.querySelectorAll('input[name="plAtividadeVinculada"]:checked')).map(cb => cb.value);
            const normalizadas = atividadesDisponiveis.map(a => ({ ...a, componenteCurricular: a.componenteCurricular || COMPONENTE_CURRICULAR_PADRAO }));
            const compativeis = buscarAtividadesCompativeis(normalizadas, {
                componenteCurricular, unidadeTematica,
                especificacao: document.getElementById('especificacao')?.value || null,
                habilidadesCodigos: getHabilidadesSelecionadas().map(h => h.codigo)
            }, { excluirIds: jaVinculadas });

            if (compativeis.length === 0) { container.innerHTML = ''; return; }
            container.innerHTML = `
                <div class="pf-field" style="background:var(--pf-gray-100);border:2px dashed var(--pf-gray-300);border-radius:var(--pf-radius-md);padding:var(--pf-space-2);">
                    <label>💡 Atividades compatíveis já cadastradas</label>
                    ${compativeis.slice(0, 5).map(r => `
                        <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 0;font-size:0.85rem;">
                            <span>${r.atividade.titulo} <span style="color:var(--pf-gray-500);">(${r.pontuacao} ponto(s) em comum)</span></span>
                            <button type="button" class="pf-btn pf-btn--secondary" style="font-size:0.72rem;padding:4px 8px;" onclick="vincularAtividadeSugerida('${r.atividade.id}')">+ Vincular</button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        window.vincularAtividadeSugerida = function (id) {
            const cb = document.querySelector(`input[name="plAtividadeVinculada"][value="${id}"]`);
            if (cb) cb.checked = true;
            renderizarSugestoesAtividadesCompativeis();
        };

        window.atualizarHabilidades = function () {
            renderizarSugestoesAtividadesCompativeis();
            renderizarAtividadesVinculadas();
            const componenteSelect = document.getElementById('plAulaComponente');
            const bncc = BNCC_POR_COMPONENTE[componenteSelect ? componenteSelect.value : COMPONENTE_CURRICULAR_PADRAO];
            if (!bncc) return;
            const turmaSelect = document.getElementById('turma');
            const unidadeTematicaSelect = document.getElementById('unidadeTematica');
            const especificacaoSelect = document.getElementById('especificacao');
            const habilidadesContainer = document.getElementById('habilidadesContainer');

            const turmaSelecionada = turmaSelect.value;
            const unidadeSelecionada = unidadeTematicaSelect.value;
            const especificacaoSelecionada = especificacaoSelect.value;

            if (!turmaSelecionada || !unidadeSelecionada) {
                habilidadesContainer.innerHTML = '<p style="color:#666;text-align:center;">Selecione a turma e unidade temática primeiro</p>';
                return;
            }
            if (!especificacaoSelecionada) {
                habilidadesContainer.innerHTML = '<p style="color:#666;text-align:center;">Selecione um objeto de conhecimento</p>';
                return;
            }

            const habilidadesTurma = bncc.habilidadesBNCC[turmaSelecionada];
            if (!habilidadesTurma) {
                habilidadesContainer.innerHTML = '<p style="color:#666;text-align:center;">Nenhuma habilidade encontrada para esta turma</p>';
                return;
            }
            const habilidadesUnidade = habilidadesTurma[unidadeSelecionada];
            if (!habilidadesUnidade) {
                habilidadesContainer.innerHTML = '<p style="color:#666;text-align:center;">Nenhuma habilidade encontrada para esta unidade</p>';
                return;
            }

            exibirHabilidades(habilidadesUnidade[especificacaoSelecionada] || []);
        };

        function exibirHabilidades(habilidades, selecionadas) {
            const habilidadesContainer = document.getElementById('habilidadesContainer');
            if (habilidades.length === 0) {
                habilidadesContainer.innerHTML = '<p style="color:#666;text-align:center;">Nenhuma habilidade disponível para esta combinação</p>';
                return;
            }
            const habilidadesUnicas = [];
            const codigosVistos = new Set();
            habilidades.forEach(h => {
                if (!codigosVistos.has(h.codigo)) {
                    codigosVistos.add(h.codigo);
                    habilidadesUnicas.push(h);
                }
            });
            const codigosSelecionados = new Set((selecionadas || habilidadesPreSelecionadas || []).map(h => h.codigo || h));

            let html = '<div style="margin-bottom:10px;"><strong>Selecione as habilidades trabalhadas:</strong></div>';
            habilidadesUnicas.forEach(h => {
                html += `
                    <div class="habilidade-checkbox">
                        <label>
                            <input type="checkbox" name="habilidades" value="${h.codigo}" data-descricao="${h.descricao.replace(/"/g, '&quot;')}" ${codigosSelecionados.has(h.codigo) ? 'checked' : ''}>
                            <div>
                                <strong>${h.codigo}</strong><br>
                                <span class="habilidade-descricao">${h.descricao}</span>
                            </div>
                        </label>
                    </div>
                `;
            });
            habilidadesContainer.innerHTML = html;
        }

        function getHabilidadesSelecionadas() {
            // Componente sem BNCC curada (ver renderizarHabilidadesLivres):
            // uma "habilidade" por linha não vazia do textarea, sem código
            // oficial — mesmo formato {codigo, descricao} das de EF, só que
            // os dois campos guardam o mesmo texto digitado.
            const textoLivre = document.getElementById('habilidadesTextoLivre');
            if (textoLivre) {
                return textoLivre.value.split('\n').map(l => l.trim()).filter(Boolean)
                    .map(l => ({ codigo: l, descricao: l }));
            }
            const checkboxes = document.querySelectorAll('input[name="habilidades"]:checked');
            return Array.from(checkboxes).map(cb => ({ codigo: cb.value, descricao: cb.getAttribute('data-descricao') }));
        }

        // ---------- Carregamento Firestore ----------
        function carregarAulas() {
            return ouvirAulas(escolaAtualId, (snapshot) => {
                aulasTodas = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
                renderizarTudo();
            });
        }

        function carregarConfiguracoes() {
            return ouvirConfiguracoes(escolaAtualId, (docSnap) => {
                const data = docSnap.data();
                bimestresConfig = (data && data.bimestres) ? data.bimestres : [];
                inicializarArvoreAberta();
                renderizarTudo();
            });
        }

        // Expande só o bimestre/mês de hoje na primeira vez que a config de
        // bimestres chega — atualizações seguintes do Firestore não mexem
        // mais nisso, senão um expand/collapse manual do professor seria
        // desfeito a cada snapshot novo.
        function inicializarArvoreAberta() {
            if (arvoreInicializada || bimestresConfig.length === 0) return;
            arvoreInicializada = true;
            const hoje = new Date();
            const numeroBimestre = bimestreDaData(hoje);
            if (numeroBimestre) {
                arvoreBimestresAbertos.add(numeroBimestre);
                arvoreMesesAbertos.add(`${numeroBimestre}:${hoje.getMonth() + 1}`);
            }
        }

        function carregarAnuais() {
            return ouvirPlanejamentosAnuais(escolaAtualId, (snapshot) => {
                planejamentosAnuais = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
                renderizarTudo();
            });
        }

        function carregarBimestrais() {
            return ouvirPlanejamentosBimestrais(escolaAtualId, (snapshot) => {
                planejamentosBimestrais = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
                renderizarTudo();
            });
        }

        function carregarMensais() {
            return ouvirPlanejamentosMensais(escolaAtualId, (snapshot) => {
                planejamentosMensais = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
                renderizarTudo();
            });
        }

        function carregarGrade() {
            return ouvirGrade(escolaAtualId, (docSnap) => {
                gradeHorarios = docSnap.exists() ? docSnap.data() : null;
            });
        }

        function carregarAtividadesParaVinculo() {
            return ouvirAtividades(escolaAtualId, (snapshot) => {
                atividadesDisponiveis = snapshot.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .filter(a => !a.arquivada);
                renderizarTudo();
            });
        }

        function renderizarTudo() {
            renderizarArvore();
            renderizarAreaPrincipal();
            renderizarPainelAuxiliar();
        }

        // ---------- Barra superior ----------
        function inicializarBarraSuperior() {
            const selectTurma = document.getElementById('plTurma');
            selectTurma.innerHTML = TURMAS_DISPONIVEIS.map(t => `<option value="${t}">${t}</option>`).join('');
            selectTurma.value = turmaAtual;
            selectTurma.addEventListener('change', () => {
                turmaAtual = selectTurma.value;
                selecionado = null;
                renderizarTudo();
            });

            const inputAno = document.getElementById('plAnoLetivo');
            inputAno.value = anoLetivoAtual;
            inputAno.addEventListener('change', () => {
                anoLetivoAtual = parseInt(inputAno.value, 10) || new Date().getFullYear();
                selecionado = null;
                renderizarTudo();
            });

            document.getElementById('plBusca').addEventListener('input', (e) => {
                termoBusca = e.target.value.toLowerCase();
                renderizarArvore();
            });
        }

        window.imprimirSelecionado = function () {
            window.print();
        };

        // ---------- Inicialização ----------
        inicializarBarraSuperior();

        requireAuth({ loginPath: '../../login.html' });

        document.addEventListener('pf-auth-ready', (evento) => {
            uidAtual = evento.detail.user.uid;
        });

        document.addEventListener('pf-escola-ready', (evento) => {
            escolaAtualId = evento.detail.escolaId;
            selecionado = null;
            const escolaAtiva = (evento.detail.escolas || []).find(e => e.id === escolaAtualId);
            componentesAtivos = (escolaAtiva && escolaAtiva.componentesAtivos && escolaAtiva.componentesAtivos.length > 0)
                ? escolaAtiva.componentesAtivos
                : [COMPONENTE_CURRICULAR_PADRAO];
            if (unsubAulas) unsubAulas();
            if (unsubConfiguracoes) unsubConfiguracoes();
            if (unsubAnuais) unsubAnuais();
            if (unsubBimestrais) unsubBimestrais();
            if (unsubMensais) unsubMensais();
            if (unsubAtividades) unsubAtividades();
            if (unsubGrade) unsubGrade();
            unsubAulas = carregarAulas();
            unsubConfiguracoes = carregarConfiguracoes();
            unsubAnuais = carregarAnuais();
            unsubBimestrais = carregarBimestrais();
            unsubMensais = carregarMensais();
            unsubAtividades = carregarAtividadesParaVinculo();
            unsubGrade = carregarGrade();
        });

        // ---------- Árvore de navegação ----------
        // Chaves sintéticas "novo:<nivel>:..." representam um nó que ainda não
        // existe no Firestore — selecionar um desses abre um formulário de
        // criação já pré-preenchido em vez de um erro.
        function encontrarAnual() {
            return planejamentosAnuais.find(p => p.turma === turmaAtual && p.anoLetivo === anoLetivoAtual) || null;
        }

        function encontrarBimestral(numero) {
            return planejamentosBimestrais.find(p => p.turma === turmaAtual && p.anoLetivo === anoLetivoAtual && p.bimestre === numero) || null;
        }

        function encontrarMensal(numero, mes) {
            return planejamentosMensais.find(p => p.turma === turmaAtual && p.anoLetivo === anoLetivoAtual && p.bimestre === numero && p.mes === mes) || null;
        }

        function aulasFiltradasPorBusca() {
            if (!termoBusca) return aulasTodas.filter(a => a.turma === turmaAtual);
            return aulasTodas.filter(a => a.turma === turmaAtual && (
                (a.titulo || '').toLowerCase().includes(termoBusca) ||
                (a.descricao || '').toLowerCase().includes(termoBusca) ||
                (a.objetoConhecimento || '').toLowerCase().includes(termoBusca)
            ));
        }

        window.selecionarNo = function (nivel, id, numero, mes) {
            selecionado = { nivel, id };
            // Garante que o nó recém-selecionado não fique escondido dentro
            // de um ramo fechado (ex: clicar numa aula sugerida pela IA).
            if (numero !== undefined) {
                arvoreBimestresAbertos.add(numero);
                if (nivel === 'aula' && mes !== undefined) {
                    arvoreMesesAbertos.add(`${numero}:${mes}`);
                }
            }
            renderizarArvore();
            renderizarAreaPrincipal();
            renderizarPainelAuxiliar();
        };

        window.toggleArvoreBimestre = function (numero) {
            if (arvoreBimestresAbertos.has(numero)) arvoreBimestresAbertos.delete(numero);
            else arvoreBimestresAbertos.add(numero);
            renderizarArvore();
        };

        window.toggleArvoreMes = function (numero, mes) {
            const chave = `${numero}:${mes}`;
            if (arvoreMesesAbertos.has(chave)) arvoreMesesAbertos.delete(chave);
            else arvoreMesesAbertos.add(chave);
            renderizarArvore();
        };

        function itemArvoreHtml(nivel, id, classeExtra, rotulo, contagem, opcoesArvore) {
            const { aberto, toggleOnClick, hoje, numero, mes } = opcoesArvore || {};
            const chave = `${nivel}:${id}`;
            const ativo = selecionado && `${selecionado.nivel}:${selecionado.id}` === chave;
            const argsClique = [`'${nivel}'`, `'${id}'`];
            if (numero !== undefined) argsClique.push(numero);
            if (mes !== undefined) argsClique.push(mes);
            return `
                <div class="pl-arvore-item ${classeExtra}${ativo ? ' pl-arvore-item--selecionado' : ''}${hoje ? ' pl-arvore-item--hoje' : ''}" onclick="selecionarNo(${argsClique.join(', ')})">
                    ${toggleOnClick ? `<span class="pl-arvore-toggle" onclick="event.stopPropagation(); ${toggleOnClick}">${aberto ? '▾' : '▸'}</span>` : ''}
                    <span>${rotulo}</span>
                    ${contagem !== undefined ? `<span class="pl-badge-count">${contagem}</span>` : ''}
                </div>
            `;
        }

        function renderizarArvore() {
            const container = document.getElementById('plArvore');
            const aulasDaTurma = aulasFiltradasPorBusca();
            // Busca ativa força tudo expandido, senão um resultado dentro de
            // um ramo fechado ficaria invisível (aulasFiltradasPorBusca já
            // varre a árvore inteira, independente do estado visual).
            const buscaAtiva = !!termoBusca;
            const hoje = new Date();
            const numeroBimestreHoje = bimestreDaData(hoje);
            const mesHoje = hoje.getMonth() + 1;

            const anual = encontrarAnual();
            let html = itemArvoreHtml('anual', anual ? anual.id : 'novo:anual', 'pl-arvore-anual',
                `📘 Planejamento Anual — ${turmaAtual}`);

            for (let numero = 1; numero <= 4; numero++) {
                const bimestral = encontrarBimestral(numero);
                const cfg = bimestresConfig.find(b => b.numero === numero);
                const bimestreAberto = buscaAtiva || arvoreBimestresAbertos.has(numero);
                html += itemArvoreHtml('bimestral', bimestral ? bimestral.id : `novo:bimestral:${numero}`, 'pl-arvore-bimestre',
                    rotuloBimestre(numero), undefined,
                    { aberto: bimestreAberto, toggleOnClick: `toggleArvoreBimestre(${numero})`, hoje: numero === numeroBimestreHoje, numero });

                if (!cfg) {
                    html += `<div class="pl-arvore-item pl-arvore-item--vazio pl-arvore-mes"><a href="../configuracoes/index.html" style="color:inherit;">Configure as datas deste bimestre em Configurações →</a></div>`;
                    continue;
                }

                if (!bimestreAberto) continue;

                const meses = mesesDoIntervalo(cfg.inicio, cfg.fim);
                meses.forEach(({ mes }) => {
                    const mensal = encontrarMensal(numero, mes);
                    const aulasDoMes = mensal ? ordenarAulasPorData(aulasDaTurma.filter(a => a.planejamentoMensalId === mensal.id)) : [];
                    const mesAberto = buscaAtiva || arvoreMesesAbertos.has(`${numero}:${mes}`);
                    html += itemArvoreHtml('mensal', mensal ? mensal.id : `novo:mensal:${numero}:${mes}`, 'pl-arvore-mes',
                        `📅 ${NOMES_MESES[mes - 1]}`, aulasDoMes.length,
                        { aberto: mesAberto, toggleOnClick: `toggleArvoreMes(${numero}, ${mes})`, hoje: numero === numeroBimestreHoje && mes === mesHoje, numero });

                    if (!mesAberto) return;

                    aulasDoMes.forEach(aula => {
                        html += itemArvoreHtml('aula', aula.id, 'pl-arvore-aula', `📝 ${aula.titulo || 'Sem título'}`, undefined, { numero, mes });
                    });
                });

                const aulasSemMes = ordenarAulasPorData(aulasDaTurma.filter(a => a.bimestre === numero && !a.planejamentoMensalId));
                if (aulasSemMes.length > 0) {
                    html += itemArvoreHtml('mensal', `novo:mensal:${numero}:0`, 'pl-arvore-mes pl-arvore-item--vazio',
                        `Sem mês vinculado`, aulasSemMes.length, { numero });
                    aulasSemMes.forEach(aula => {
                        html += itemArvoreHtml('aula', aula.id, 'pl-arvore-aula', `📝 ${aula.titulo || 'Sem título'}`, undefined, { numero });
                    });
                }
            }

            const aulasSemBimestre = ordenarAulasPorData(aulasDaTurma.filter(a => !a.bimestre));
            if (aulasSemBimestre.length > 0) {
                html += `<div class="pl-arvore-item pl-arvore-item--vazio" style="margin-top:var(--pf-space-2);font-weight:600;">Aulas sem bimestre definido</div>`;
                aulasSemBimestre.forEach(aula => {
                    html += itemArvoreHtml('aula', aula.id, 'pl-arvore-aula', `📝 ${aula.titulo || 'Sem título'}`);
                });
            }

            container.innerHTML = html;
        }

        // ---------- Área principal — dispatcher ----------
        function renderizarAreaPrincipal() {
            const container = document.getElementById('plAreaPrincipal');
            if (importacaoAtual) return renderizarRevisaoImportacao(container);
            if (!selecionado) {
                container.innerHTML = '<p class="pl-estado-vazio">Selecione um item na árvore ao lado.</p>';
                return;
            }
            if (selecionado.nivel === 'anual') return renderizarFormAnual(container);
            if (selecionado.nivel === 'bimestral') return renderizarFormBimestral(container);
            if (selecionado.nivel === 'mensal') return renderizarFormMensal(container);
            if (selecionado.nivel === 'aula') return renderizarFormAula(container);
        }

        // ---------- Nível Anual ----------
        function renderizarFormAnual(container) {
            const existente = selecionado.id.startsWith('novo:') ? null : planejamentosAnuais.find(p => p.id === selecionado.id);
            const dados = existente || { turma: turmaAtual, anoLetivo: anoLetivoAtual, objetivosGerais: '', competenciasGerais: [], observacoes: '' };

            const bimestresComPlano = [1, 2, 3, 4].filter(n => encontrarBimestral(n)).length;

            container.innerHTML = `
                <h2>📘 Planejamento Anual — ${dados.turma} (${dados.anoLetivo})</h2>
                <span class="pl-indicador">${bimestresComPlano} de 4 bimestres com plano cadastrado</span>
                <div class="pf-field">
                    <label>Objetivos Gerais do Ano</label>
                    <textarea id="plAnualObjetivos" rows="4">${dados.objetivosGerais || ''}</textarea>
                </div>
                <div class="pf-field">
                    <label>Competências Gerais (uma por linha)</label>
                    <textarea id="plAnualCompetencias" rows="4">${(dados.competenciasGerais || []).join('\n')}</textarea>
                </div>
                <div class="pf-field">
                    <label>Observações</label>
                    <textarea id="plAnualObservacoes" rows="3">${dados.observacoes || ''}</textarea>
                </div>
                <div class="pl-acoes">
                    <button class="pf-btn pf-btn--success" onclick="salvarAnual()">💾 Salvar</button>
                    ${existente ? `
                        <button class="pf-btn pf-btn--secondary" onclick="duplicarAnualPrompt()">📋 Duplicar para outra turma/ano</button>
                        <button class="pf-btn pf-btn--danger" onclick="excluirAnualAtual()">🗑️ Excluir</button>
                    ` : ''}
                </div>
            `;
        }

        window.salvarAnual = async function () {
            const dados = {
                turma: turmaAtual,
                anoLetivo: anoLetivoAtual,
                objetivosGerais: document.getElementById('plAnualObjetivos').value,
                competenciasGerais: document.getElementById('plAnualCompetencias').value.split('\n').map(s => s.trim()).filter(Boolean),
                observacoes: document.getElementById('plAnualObservacoes').value
            };
            try {
                const existente = selecionado.id.startsWith('novo:') ? null : planejamentosAnuais.find(p => p.id === selecionado.id);
                if (existente) {
                    await atualizarPlanejamentoAnual(escolaAtualId, existente.id, dados);
                } else {
                    const ref = await criarPlanejamentoAnual(escolaAtualId, dados);
                    selecionado = { nivel: 'anual', id: ref.id };
                }
                mostrarMensagem('Planejamento anual salvo!', 'success');
            } catch (erro) {
                console.error(erro);
                mostrarMensagem('Erro ao salvar: ' + erro.message, 'error');
            }
        };

        window.duplicarAnualPrompt = async function () {
            const novaTurma = prompt('Duplicar para qual turma?', turmaAtual) || turmaAtual;
            const novoAno = parseInt(prompt('Para qual ano letivo?', anoLetivoAtual), 10) || anoLetivoAtual;
            try {
                await duplicarPlanejamentoAnual(escolaAtualId, selecionado.id, { turma: novaTurma, anoLetivo: novoAno });
                mostrarMensagem('Planejamento anual duplicado!', 'success');
            } catch (erro) {
                mostrarMensagem('Erro ao duplicar: ' + erro.message, 'error');
            }
        };

        window.excluirAnualAtual = async function () {
            if (!confirm('Excluir este planejamento anual?')) return;
            await excluirPlanejamentoAnual(escolaAtualId, selecionado.id);
            selecionado = null;
            mostrarMensagem('Planejamento anual excluído.', 'info');
        };

        // ---------- Nível Bimestral ----------
        function parseNumeroBimestralNovo(id) {
            // "novo:bimestral:<numero>" → <numero>
            return parseInt(id.split(':')[2], 10);
        }

        function renderizarFormBimestral(container) {
            const novo = selecionado.id.startsWith('novo:');
            const existente = novo ? null : planejamentosBimestrais.find(p => p.id === selecionado.id);
            const numero = existente ? existente.bimestre : parseNumeroBimestralNovo(selecionado.id);
            const anual = encontrarAnual();
            const dados = existente || {
                turma: turmaAtual, anoLetivo: anoLetivoAtual, bimestre: numero,
                planejamentoAnualId: anual ? anual.id : null,
                objetivos: anual ? anual.objetivosGerais : '', unidadesTematicas: [], metodologia: '', avaliacao: '', observacoes: ''
            };

            const cfg = bimestresConfig.find(b => b.numero === numero);
            const totalMeses = cfg ? mesesDoIntervalo(cfg.inicio, cfg.fim).length : 0;
            const mesesComPlano = cfg ? mesesDoIntervalo(cfg.inicio, cfg.fim).filter(({ mes }) => encontrarMensal(numero, mes)).length : 0;

            // Muda de bimestral selecionado (ou é a primeira renderização) —
            // recarrega o estado local a partir do que está salvo. Fora
            // disso, o estado local é quem manda (permite trocar de
            // componente sem perder marcações ainda não salvas).
            if (bimestralIdEmEdicao !== selecionado.id) {
                bimestralIdEmEdicao = selecionado.id;
                unidadesBimestralSelecionadas = new Set(dados.unidadesTematicas || []);
                componenteBimestralAtual = componentesAtivos[0] || COMPONENTE_CURRICULAR_PADRAO;
            }

            const bnccComponenteBimestral = BNCC_POR_COMPONENTE[componenteBimestralAtual];
            const unidadesDisponiveis = bnccComponenteBimestral ? (bnccComponenteBimestral.unidadesPorAno[turmaAtual] || []) : [];

            container.innerHTML = `
                <h2>📗 ${rotuloBimestre(numero)} — ${turmaAtual} (${anoLetivoAtual})</h2>
                <span class="pl-indicador">${mesesComPlano} de ${totalMeses} meses com plano cadastrado</span>
                <div class="pf-field">
                    <label>Unidades Temáticas deste Bimestre</label>
                    <select class="pf-filter-select" onchange="mudarComponenteBimestral(this.value)" style="margin-bottom:8px;">
                        ${componentesAtivos.map(c => `<option value="${c}" ${c === componenteBimestralAtual ? 'selected' : ''}>${c}</option>`).join('')}
                    </select>
                    ${unidadesDisponiveis.length === 0 ? `<p class="pl-estado-vazio">Sem BNCC cadastrada pra ${componenteBimestralAtual} nesta série ainda.</p>` : `
                    <div>${unidadesDisponiveis.map(u => `
                        <label class="pl-unidade-checkbox">
                            <input type="checkbox" onchange="toggleUnidadeBimestral('${u.replace(/'/g, "\\'")}', this.checked)" ${unidadesBimestralSelecionadas.has(u) ? 'checked' : ''}> ${u}
                        </label>
                    `).join('')}</div>
                    `}
                    ${unidadesBimestralSelecionadas.size > 0 ? `<p class="pl-indicador" style="margin-top:6px;">Já marcadas neste bimestre (de qualquer componente): ${Array.from(unidadesBimestralSelecionadas).join(', ')}</p>` : ''}
                </div>
                <div class="pf-field">
                    <label>Objetivos do Bimestre</label>
                    <textarea id="plBimestralObjetivos" rows="4">${dados.objetivos || ''}</textarea>
                </div>
                <div class="pf-field">
                    <label>Metodologia</label>
                    <textarea id="plBimestralMetodologia" rows="3">${dados.metodologia || ''}</textarea>
                </div>
                <div class="pf-field">
                    <label>Avaliação</label>
                    <textarea id="plBimestralAvaliacao" rows="3">${dados.avaliacao || ''}</textarea>
                </div>
                <div class="pf-field">
                    <label>Observações</label>
                    <textarea id="plBimestralObservacoes" rows="3">${dados.observacoes || ''}</textarea>
                </div>
                <div class="pl-acoes">
                    <button class="pf-btn pf-btn--success" onclick="salvarBimestral(${numero})">💾 Salvar</button>
                    ${existente ? `
                        <button class="pf-btn pf-btn--secondary" onclick="duplicarBimestralPrompt()">📋 Duplicar para outro bimestre/turma</button>
                        <button class="pf-btn pf-btn--danger" onclick="excluirBimestralAtual()">🗑️ Excluir</button>
                    ` : ''}
                </div>
            `;
        }

        window.toggleUnidadeBimestral = function (unidade, marcado) {
            if (marcado) unidadesBimestralSelecionadas.add(unidade);
            else unidadesBimestralSelecionadas.delete(unidade);
        };

        window.mudarComponenteBimestral = function (componente) {
            componenteBimestralAtual = componente;
            renderizarAreaPrincipal();
        };

        window.salvarBimestral = async function (numero) {
            const anual = encontrarAnual();
            const unidadesTematicas = Array.from(unidadesBimestralSelecionadas);
            const dados = {
                turma: turmaAtual,
                anoLetivo: anoLetivoAtual,
                bimestre: numero,
                planejamentoAnualId: anual ? anual.id : null,
                unidadesTematicas,
                objetivos: document.getElementById('plBimestralObjetivos').value,
                metodologia: document.getElementById('plBimestralMetodologia').value,
                avaliacao: document.getElementById('plBimestralAvaliacao').value,
                observacoes: document.getElementById('plBimestralObservacoes').value
            };
            try {
                const existente = selecionado.id.startsWith('novo:') ? null : planejamentosBimestrais.find(p => p.id === selecionado.id);
                if (existente) {
                    await atualizarPlanejamentoBimestral(escolaAtualId, existente.id, dados);
                } else {
                    const ref = await criarPlanejamentoBimestral(escolaAtualId, dados);
                    selecionado = { nivel: 'bimestral', id: ref.id };
                }
                mostrarMensagem('Planejamento bimestral salvo!', 'success');
            } catch (erro) {
                console.error(erro);
                mostrarMensagem('Erro ao salvar: ' + erro.message, 'error');
            }
        };

        window.duplicarBimestralPrompt = async function () {
            const novoNumero = parseInt(prompt('Duplicar para qual bimestre (1-4)?', '1'), 10);
            const novaTurma = prompt('Para qual turma?', turmaAtual) || turmaAtual;
            if (!novoNumero || novoNumero < 1 || novoNumero > 4) {
                mostrarMensagem('Número de bimestre inválido.', 'error');
                return;
            }
            try {
                await duplicarPlanejamentoBimestral(escolaAtualId, selecionado.id, { bimestre: novoNumero, turma: novaTurma });
                mostrarMensagem('Planejamento bimestral duplicado!', 'success');
            } catch (erro) {
                mostrarMensagem('Erro ao duplicar: ' + erro.message, 'error');
            }
        };

        window.excluirBimestralAtual = async function () {
            if (!confirm('Excluir este planejamento bimestral?')) return;
            await excluirPlanejamentoBimestral(escolaAtualId, selecionado.id);
            selecionado = null;
            mostrarMensagem('Planejamento bimestral excluído.', 'info');
        };

        // ---------- Nível Mensal ----------
        function parseMensalNovo(id) {
            // "novo:mensal:<numero>:<mes>" → {numero, mes}
            const partes = id.split(':');
            return { numero: parseInt(partes[2], 10), mes: parseInt(partes[3], 10) };
        }

        function renderizarFormMensal(container) {
            const novo = selecionado.id.startsWith('novo:');
            const existente = novo ? null : planejamentosMensais.find(p => p.id === selecionado.id);
            const { numero, mes } = existente ? { numero: existente.bimestre, mes: existente.mes } : parseMensalNovo(selecionado.id);

            const aulasDaTurma = aulasFiltradasPorBusca();

            // "Sem mês vinculado" (mes === 0) é um agrupador, não um mês real —
            // só lista as aulas do bimestre sem planejamentoMensalId.
            if (mes === 0) {
                const aulasSemMes = ordenarAulasPorData(aulasDaTurma.filter(a => a.bimestre === numero && !a.planejamentoMensalId));
                container.innerHTML = `
                    <h2>📎 Aulas sem mês vinculado — ${rotuloBimestre(numero)}</h2>
                    <p class="pl-indicador">${aulasSemMes.length} aula(s) ainda não vinculada(s) a um mês</p>
                    <div class="pl-acoes">
                        ${aulasSemMes.map(a => `<button class="pf-btn pf-btn--secondary" onclick="selecionarNo('aula','${a.id}')">📝 ${a.titulo || 'Sem título'}</button>`).join('')}
                    </div>
                `;
                return;
            }

            const bimestral = encontrarBimestral(numero);
            const dados = existente || {
                turma: turmaAtual, anoLetivo: anoLetivoAtual, bimestre: numero, mes,
                planejamentoBimestralId: bimestral ? bimestral.id : null,
                objetivos: bimestral ? bimestral.objetivos : '', conteudos: '', observacoes: ''
            };

            const aulasVinculadas = existente ? ordenarAulasPorData(aulasDaTurma.filter(a => a.planejamentoMensalId === existente.id)) : [];

            container.innerHTML = `
                <h2>📅 ${NOMES_MESES[mes - 1]} — ${turmaAtual} (${anoLetivoAtual})</h2>
                <span class="pl-indicador">${aulasVinculadas.length} aula(s) vinculada(s) a este mês</span>
                <div class="pf-field">
                    <label>Objetivos do Mês</label>
                    <textarea id="plMensalObjetivos" rows="4">${dados.objetivos || ''}</textarea>
                </div>
                <div class="pf-field">
                    <label>Conteúdos Previstos</label>
                    <textarea id="plMensalConteudos" rows="4">${dados.conteudos || ''}</textarea>
                </div>
                <div class="pf-field">
                    <label>Observações</label>
                    <textarea id="plMensalObservacoes" rows="3">${dados.observacoes || ''}</textarea>
                </div>
                <div class="pl-acoes">
                    <button class="pf-btn pf-btn--success" onclick="salvarMensal(${numero}, ${mes})">💾 Salvar</button>
                    ${existente ? `
                        <button class="pf-btn pf-btn--secondary" onclick="duplicarMensalPrompt()">📋 Duplicar para outro mês</button>
                        <button class="pf-btn pf-btn--danger" onclick="excluirMensalAtual()">🗑️ Excluir</button>
                        <button class="pf-btn pf-btn--info" onclick="novaAulaNesteMes('${existente.id}', ${numero})">➕ Nova aula neste mês</button>
                    ` : '<p class="pl-aviso" style="font-size:0.8rem;color:var(--pf-gray-500);">Salve este mês antes de vincular aulas a ele.</p>'}
                </div>
                ${aulasVinculadas.length > 0 ? `
                    <div class="pf-field" style="margin-top:var(--pf-space-4);">
                        <label>Aulas vinculadas</label>
                        <div class="pl-acoes">
                            ${aulasVinculadas.map(a => `<button class="pf-btn pf-btn--secondary" onclick="selecionarNo('aula','${a.id}')">📝 ${a.titulo || 'Sem título'}</button>`).join('')}
                        </div>
                    </div>
                ` : ''}
            `;
        }

        window.salvarMensal = async function (numero, mes) {
            const bimestral = encontrarBimestral(numero);
            const dados = {
                turma: turmaAtual,
                anoLetivo: anoLetivoAtual,
                bimestre: numero,
                mes,
                planejamentoBimestralId: bimestral ? bimestral.id : null,
                objetivos: document.getElementById('plMensalObjetivos').value,
                conteudos: document.getElementById('plMensalConteudos').value,
                observacoes: document.getElementById('plMensalObservacoes').value
            };
            try {
                const existente = selecionado.id.startsWith('novo:') ? null : planejamentosMensais.find(p => p.id === selecionado.id);
                if (existente) {
                    await atualizarPlanejamentoMensal(escolaAtualId, existente.id, dados);
                } else {
                    const ref = await criarPlanejamentoMensal(escolaAtualId, dados);
                    selecionado = { nivel: 'mensal', id: ref.id };
                }
                mostrarMensagem('Planejamento mensal salvo!', 'success');
            } catch (erro) {
                console.error(erro);
                mostrarMensagem('Erro ao salvar: ' + erro.message, 'error');
            }
        };

        window.duplicarMensalPrompt = async function () {
            const novoMes = parseInt(prompt('Duplicar para qual mês (1-12)?', '1'), 10);
            if (!novoMes || novoMes < 1 || novoMes > 12) {
                mostrarMensagem('Mês inválido.', 'error');
                return;
            }
            try {
                await duplicarPlanejamentoMensal(escolaAtualId, selecionado.id, { mes: novoMes });
                mostrarMensagem('Planejamento mensal duplicado!', 'success');
            } catch (erro) {
                mostrarMensagem('Erro ao duplicar: ' + erro.message, 'error');
            }
        };

        window.excluirMensalAtual = async function () {
            if (!confirm('Excluir este planejamento mensal? Aulas vinculadas a ele ficam sem mês, não são excluídas.')) return;
            await excluirPlanejamentoMensal(escolaAtualId, selecionado.id);
            selecionado = null;
            mostrarMensagem('Planejamento mensal excluído.', 'info');
        };

        window.novaAulaNesteMes = function (mensalId, numeroBimestre) {
            aulaEditando = null;
            selecionado = { nivel: 'aula', id: `novo:${mensalId}:${numeroBimestre}` };
            renderizarAreaPrincipal();
            renderizarPainelAuxiliar();
            renderizarArvore();
        };

        // ---------- Nível Aula (Semanal) ----------
        // Se as habilidades pré-selecionadas de uma aula existente estiverem
        // definidas aqui, exibirHabilidades() as usa na primeira renderização
        // da cascata BNCC; depois disso volta a null (mudar unidade/especificação
        // manualmente não deve reimpor a seleção da classificação anterior).
        let habilidadesPreSelecionadas = null;

        window.novaAulaAvulsa = function () {
            aulaEditando = null;
            selecionado = { nivel: 'aula', id: 'novo::' };
            renderizarAreaPrincipal();
            renderizarPainelAuxiliar();
            renderizarArvore();
        };

        function renderizarFormAula(container) {
            const novo = selecionado.id.startsWith('novo:');
            const existente = novo ? null : aulasTodas.find(a => a.id === selecionado.id);
            aulaEditando = existente ? existente.id : null;

            let mensalIdContexto = '', bimestreContexto = '';
            if (novo) {
                const partes = selecionado.id.split(':');
                mensalIdContexto = partes[1] || '';
                bimestreContexto = partes[2] || '';
            }

            const mesesDaTurma = planejamentosMensais.filter(m => m.turma === turmaAtual && m.anoLetivo === anoLetivoAtual);

            container.innerHTML = `
                <h2>📝 ${existente ? 'Editar Aula' : 'Nova Aula'}</h2>
                <form id="formAula">
                    <div class="pf-field">
                        <label for="titulo">Título da Aula *</label>
                        <input type="text" id="titulo" required placeholder="Ex: Jogos e Brincadeiras Populares" value="${existente ? (existente.titulo || '').replace(/"/g, '&quot;') : ''}">
                    </div>
                    <div class="pf-field">
                        <label for="turma">Turma (Série) *</label>
                        <select id="turma" required onchange="atualizarUnidadesTematicas()">
                            <option value="">Selecione a turma</option>
                            ${TURMAS_DISPONIVEIS.map(t => `<option value="${t}">${t}</option>`).join('')}
                        </select>
                    </div>
                    <div class="pf-field">
                        <label for="plAulaComponente">Componente Curricular *</label>
                        <select id="plAulaComponente" required onchange="atualizarUnidadesTematicas()">
                            ${componentesAtivos.map(c => `<option value="${c}">${c}</option>`).join('')}
                        </select>
                        ${(() => {
