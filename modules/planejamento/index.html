                            if (componentesAtivos.length === 1) return '';
                            const semBncc = componentesAtivos.filter(c => !BNCC_POR_COMPONENTE[c]);
                            if (semBncc.length === 0) return '';
                            return `<small style="display:block;color:var(--pf-gray-500);margin-top:4px;">Sem BNCC cadastrada no app pra ${semBncc.join(', ')} ainda — unidade temática e habilidades ficam livres pra ${semBncc.length === 1 ? 'esse componente' : 'esses componentes'}.</small>`;
                        })()}
                    </div>
                    <div class="pf-field">
                        <label for="plAulaBimestre">Bimestre</label>
                        <select id="plAulaBimestre" class="pf-filter-select" onchange="atualizarUnidadesTematicas()">
                            <option value="">Não definido</option>
                            <option value="1">1º Bimestre</option>
                            <option value="2">2º Bimestre</option>
                            <option value="3">3º Bimestre</option>
                            <option value="4">4º Bimestre</option>
                        </select>
                    </div>
                    <div class="pf-field">
                        <label for="unidadeTematica">Unidade Temática (BNCC) *</label>
                        <select id="unidadeTematica" required onchange="atualizarEspecificacoes()">
                            <option value="">Selecione a turma primeiro</option>
                        </select>
                        <small id="unidadeTematicaHint" style="display:block;color:var(--pf-gray-500);margin-top:4px;"></small>
                    </div>
                    <div class="pf-field" id="especificacaoGroup">
                        <label for="especificacao">Objeto de Conhecimento (BNCC) *</label>
                        <select id="especificacao" required onchange="atualizarHabilidades()">
                            <option value="">Selecione a unidade temática primeiro</option>
                        </select>
                        <small id="especificacaoHint" style="display:block;color:var(--pf-gray-500);margin-top:4px;"></small>
                    </div>
                    <div class="pf-field">
                        <label>Quantidade de Aulas *</label>
                        <input type="number" id="numeroAulas" min="1" max="10" value="${existente ? (existente.numeroAulas || 1) : 1}" required>
                    </div>
                    <div class="pf-field">
                        <label for="dataReferencia">Data de referência (semana prevista) — opcional</label>
                        <input type="date" id="dataReferencia" value="${existente ? (existente.dataReferencia || '') : ''}">
                        <small style="display:block;color:var(--pf-gray-500);margin-top:4px;">
                            Preencha quando esta turma tiver mais de uma aula planejada — ajuda o Controlador/Dashboard a saber qual é a aula da vez.
                        </small>
                    </div>
                    <div class="pf-field">
                        <label>Habilidades da BNCC * (selecione uma ou mais)</label>
                        <div id="habilidadesContainer" class="habilidades-container">
                            <p style="color:#666;text-align:center;">Selecione a turma, unidade temática e especificação primeiro</p>
                        </div>
                    </div>
                    <div class="pf-field">
                        <label for="descricao">Descrição da Aula / Atividades *</label>
                        <button type="button" class="pf-btn pf-btn--info" id="btnGerarObjetivosIA" style="margin-bottom:6px;font-size:0.8rem;">💡 Gerar objetivos com IA</button>
                        <div id="iaSugestaoBox" style="display:none;background:var(--pf-gray-100);border:2px dashed var(--pf-gray-300);border-radius:var(--pf-radius-md);padding:var(--pf-space-2);margin-bottom:6px;font-size:0.85rem;white-space:pre-wrap;"></div>
                        <textarea id="descricao" required rows="4">${existente ? (existente.descricao || '') : ''}</textarea>
                    </div>
                    <div class="pf-field">
                        <label for="recursos">Recursos Didáticos Previstos (opcional)</label>
                        <textarea id="recursos" rows="2">${existente ? (existente.recursos || '') : ''}</textarea>
                    </div>
                    <div id="plSugestoesAtividades"></div>
                    <div class="pf-field">
                        <label>Atividades Vinculadas (Banco de Atividades)</label>
                        <p style="font-size:0.78rem;color:var(--pf-gray-500);margin:0 0 4px;">Filtrada pela mesma Unidade Temática/Objeto de Conhecimento desta aula.</p>
                        <div id="plAtividadesVinculadas" style="max-height:160px;overflow-y:auto;border:2px solid var(--pf-gray-300);border-radius:var(--pf-radius-md);padding:var(--pf-space-2);background:var(--pf-white);"></div>
                    </div>
                    <div class="pf-field">
                        <label for="plAulaMes">Vincular a um mês do Planejamento</label>
                        <select id="plAulaMes" class="pf-filter-select">
                            <option value="">Nenhum</option>
                            ${mesesDaTurma.map(m => `<option value="${m.id}">${NOMES_MESES[m.mes - 1]} (${m.bimestre}º Bim)</option>`).join('')}
                        </select>
                    </div>
                    <div class="pl-acoes">
                        <button type="submit" class="pf-btn pf-btn--success">💾 Salvar Aula</button>
                        ${existente ? '<button type="button" class="pf-btn pf-btn--danger" onclick="excluirAulaAtual()">🗑️ Excluir</button>' : ''}
                    </div>
                </form>
            `;

            document.getElementById('formAula').addEventListener('submit', salvarAula);
            document.getElementById('btnGerarObjetivosIA').addEventListener('click', gerarObjetivosComIA);

            if (existente) {
                habilidadesPreSelecionadas = existente.habilidades || [];
                document.getElementById('turma').value = existente.turma || '';
                document.getElementById('plAulaComponente').value = existente.componenteCurricular || componentesAtivos[0];
                document.getElementById('plAulaBimestre').value = existente.bimestre || '';
                atividadesVinculadasIniciais = existente.atividadesVinculadas || [];
                atualizarUnidadesTematicas(existente.unidadeTematica || '');
                document.getElementById('unidadeTematica').value = existente.unidadeTematica || '';
                atualizarEspecificacoes();
                // Prefere existente.especificacao (só existe se já veio de um
                // objeto de conhecimento curado válido); objetoConhecimento
                // como fallback cobre tanto aulas de componente sem BNCC
                // (onde o campo virou <input> texto livre) quanto aulas
                // antigas que só tinham esse campo preenchido.
                const objetoConhecimentoExistente = existente.especificacao || existente.objetoConhecimento;
                if (objetoConhecimentoExistente) {
                    document.getElementById('especificacao').value = objetoConhecimentoExistente;
                }
                atualizarHabilidades();
                habilidadesPreSelecionadas = null;
                document.getElementById('plAulaMes').value = existente.planejamentoMensalId || '';
            } else {
                document.getElementById('turma').value = turmaAtual;
                document.getElementById('plAulaComponente').value = componentesAtivos[0];
                document.getElementById('plAulaBimestre').value = bimestreContexto || '';
                atividadesVinculadasIniciais = [];
                atualizarUnidadesTematicas();
                document.getElementById('plAulaMes').value = mensalIdContexto || '';
            }
        }

        // Monta o contexto enviado pra IA a partir do formulário atual —
        // inclui as atividades do Banco de Atividades marcadas em "Atividades
        // Vinculadas", se houver, pra decidir em montarPromptIA() se a IA deve
        // descrever a atividade já cadastrada (adaptada à turma) ou criar uma
        // nova a partir do objeto de conhecimento/habilidades selecionados.
        function montarContextoIA() {
            const objetoConhecimentoAtual = document.getElementById('especificacao')?.value || null;
            const componenteSelect = document.getElementById('plAulaComponente');
            const idsVinculados = Array.from(document.querySelectorAll('input[name="plAtividadeVinculada"]:checked')).map(cb => cb.value);
            const atividadesVinculadas = atividadesDisponiveis.filter(a => idsVinculados.includes(a.id));

            const contexto = {
                componenteCurricular: componenteSelect ? componenteSelect.value : COMPONENTE_CURRICULAR_PADRAO,
                turma: document.getElementById('turma').value,
                unidadeTematica: document.getElementById('unidadeTematica').value,
                especificacao: objetoConhecimentoAtual,
                objetoConhecimento: objetoConhecimentoAtual,
                habilidades: getHabilidadesSelecionadas(),
                tituloAula: document.getElementById('titulo').value
            };
            if (atividadesVinculadas.length > 0) {
                contexto.atividadesVinculadas = atividadesVinculadas.map(a => ({
                    titulo: a.titulo,
                    tipo: a.tipo || null,
                    descricao: a.descricao || ''
                }));
            }
            if (!contexto.turma || !contexto.unidadeTematica) {
                mostrarMensagem('Preencha turma e unidade temática antes de gerar sugestões.', 'error');
                return null;
            }
            return contexto;
        }

        // Pede só a descrição da atividade em si (não uma "aula completa" com
        // objetivos à parte). Com atividade vinculada, pede pra descrever COMO
        // aplicar a atividade já cadastrada com esta turma — nunca inventar
        // uma diferente. `ajuste` carrega o pedido de reformulação, quando o
        // professor não aceita o texto e pede uma nova tentativa.
        function montarPromptIA(contexto, ajuste) {
            const base = (contexto.atividadesVinculadas && contexto.atividadesVinculadas.length > 0)
                ? `Escreva, em português, a descrição de aula explicando como conduzir com esta turma a(s) atividade(s) já cadastrada(s) no Banco de Atividades (campo "atividadesVinculadas" do contexto), adaptando-a ao objeto de conhecimento e às habilidades da BNCC informados. Não invente uma atividade diferente da cadastrada nem apenas repita o texto dela — descreva como aplicá-la em sala, incluindo adaptações necessárias para a turma.`
                : `Sugira, em português, a descrição de uma atividade de aula de ${contexto.componenteCurricular}, com base no objeto de conhecimento e nas habilidades da BNCC informados no contexto.`;
            const restricao = 'Escreva apenas a descrição da aula/atividade em si, pronta para colar no campo "Descrição da Aula" — sem título, sem saudação e sem listar os objetivos separadamente.';
            let textoPrompt = `${base} ${restricao}`;
            if (ajuste) {
                textoPrompt += `\n\nO professor recebeu uma sugestão anterior e pediu para reformulá-la assim: ${ajuste}`;
            }
            return textoPrompt;
        }

        // Sugestão da IA nunca entra direto no campo — fica numa caixa à
        // parte, editável, até o professor clicar "Usar este texto",
        // cumprindo a regra de que toda sugestão precisa ser revisada (e pode
        // ser ajustada à mão) antes de valer. Se o professor não gostar,
        // "Reformular" pede uma nova tentativa à IA, opcionalmente com uma
        // instrução do que mudar.
        async function gerarObjetivosComIA() {
            const contexto = montarContextoIA();
            if (!contexto) return;
            await solicitarSugestaoIA(contexto, null);
        }

        async function solicitarSugestaoIA(contexto, ajuste) {
            const botao = document.getElementById('btnGerarObjetivosIA');
            botao.disabled = true;
            botao.textContent = '⏳ Gerando...';
            try {
                const textoPrompt = montarPromptIA(contexto, ajuste);
                const sugestao = await chamarAssistenteIA(textoPrompt, contexto);
                exibirSugestaoIA(sugestao, contexto);
            } catch (erro) {
                mostrarMensagem(erro.message, 'error');
            } finally {
                botao.disabled = false;
                botao.textContent = '💡 Gerar objetivos com IA';
            }
        }

        function exibirSugestaoIA(sugestao, contexto) {
            const box = document.getElementById('iaSugestaoBox');
            box.innerHTML = '';
            box.style.display = 'block';

            const area = document.createElement('textarea');
            area.id = 'iaSugestaoTexto';
            area.rows = 5;
            area.style.cssText = 'width:100%;font:inherit;border:1px solid var(--pf-gray-300);border-radius:var(--pf-radius-sm);padding:6px;background:var(--pf-white);';
            area.value = sugestao;
            box.appendChild(area);

            const dica = document.createElement('small');
            dica.style.cssText = 'display:block;color:var(--pf-gray-500);margin-top:4px;';
            dica.textContent = 'Pode editar o texto acima antes de usar.';
            box.appendChild(dica);

            const acoes = document.createElement('div');
            acoes.style.cssText = 'margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;';
            acoes.innerHTML = `
                <button type="button" class="pf-btn pf-btn--success" id="btnAceitarSugestaoIA" style="font-size:0.75rem;">✅ Usar este texto</button>
                <button type="button" class="pf-btn pf-btn--info" id="btnReformularSugestaoIA" style="font-size:0.75rem;">🔄 Não gostei, reformular</button>
                <button type="button" class="pf-btn pf-btn--secondary" id="btnDescartarSugestaoIA" style="font-size:0.75rem;">❌ Descartar</button>
            `;
            box.appendChild(acoes);

            document.getElementById('btnAceitarSugestaoIA').addEventListener('click', () => {
                document.getElementById('descricao').value = area.value;
                fecharSugestaoIA();
            });
            document.getElementById('btnDescartarSugestaoIA').addEventListener('click', fecharSugestaoIA);
            document.getElementById('btnReformularSugestaoIA').addEventListener('click', () => {
                const ajuste = prompt('O que você gostaria de mudar nesse texto? (deixe em branco pra só pedir uma versão diferente)', '');
                if (ajuste === null) return;
                solicitarSugestaoIA(contexto, ajuste.trim() || 'Gere uma versão diferente da anterior.');
            });
        }

        function fecharSugestaoIA() {
            const box = document.getElementById('iaSugestaoBox');
            box.style.display = 'none';
            box.innerHTML = '';
        }

        async function salvarAula(evento) {
            evento.preventDefault();
            const habilidadesSelecionadas = getHabilidadesSelecionadas();
            if (habilidadesSelecionadas.length === 0) {
                mostrarMensagem('Selecione pelo menos uma habilidade.', 'error');
                return;
            }
            // "especificacao" é o Objeto de Conhecimento oficial da BNCC (ou
            // texto livre, pra componente sem BNCC cadastrada) — os dois
            // campos do documento salvo apontam pro mesmo valor: objetoConhecimento
            // porque é o nome já usado em outros lugares que exibem esse dado
            // (Controlador, painel da Programação Diária), especificacao por
            // compatibilidade com aulas antigas que só tinham esse campo.
            const objetoConhecimentoValor = document.getElementById('especificacao').value || null;
            const aulaData = {
                titulo: document.getElementById('titulo').value,
                turma: document.getElementById('turma').value,
                unidadeTematica: document.getElementById('unidadeTematica').value,
                especificacao: objetoConhecimentoValor,
                objetoConhecimento: objetoConhecimentoValor || '',
                habilidades: habilidadesSelecionadas,
                numeroAulas: parseInt(document.getElementById('numeroAulas').value) || 1,
                descricao: document.getElementById('descricao').value,
                recursos: document.getElementById('recursos').value || null,
                atividadesVinculadas: Array.from(document.querySelectorAll('input[name="plAtividadeVinculada"]:checked')).map(cb => cb.value),
                bimestre: document.getElementById('plAulaBimestre').value ? parseInt(document.getElementById('plAulaBimestre').value, 10) : null,
                planejamentoMensalId: document.getElementById('plAulaMes').value || null,
                dataReferencia: document.getElementById('dataReferencia').value || null,
                componenteCurricular: document.getElementById('plAulaComponente')
                    ? document.getElementById('plAulaComponente').value
                    : COMPONENTE_CURRICULAR_PADRAO,
                timestamp: new Date().toISOString()
            };
            if (!aulaData.turma || !aulaData.unidadeTematica || !objetoConhecimentoValor) {
                mostrarMensagem('Preencha turma, unidade temática e objeto de conhecimento.', 'error');
                return;
            }
            try {
                if (aulaEditando) {
                    await salvarComHistorico(doc(db, 'escolas', escolaAtualId, 'aulas', aulaEditando), aulaData);
                    mostrarMensagem('Aula atualizada!', 'success');
                } else {
                    const ref = await criarAula(escolaAtualId, aulaData);
                    aulaEditando = ref.id;
                    selecionado = { nivel: 'aula', id: ref.id };
                    mostrarMensagem('Aula criada!', 'success');
                }
            } catch (erro) {
                console.error(erro);
                mostrarMensagem('Erro ao salvar aula: ' + erro.message, 'error');
            }
        }

        window.excluirAulaAtual = async function () {
            if (!confirm('Excluir esta aula?')) return;
            try {
                await excluirAulaService(escolaAtualId, selecionado.id);
                selecionado = null;
                mostrarMensagem('Aula excluída!', 'success');
            } catch (erro) {
                mostrarMensagem('Erro ao excluir: ' + erro.message, 'error');
            }
        };

        // ---------- Painel auxiliar (BNCC + histórico de versões) ----------
        function refDoSelecionado() {
            if (!selecionado || selecionado.id.startsWith('novo:')) return null;
            const colecaoPorNivel = {
                anual: 'planejamentoAnual',
                bimestral: 'planejamentoBimestral',
                mensal: 'planejamentoMensal',
                aula: 'aulas'
            };
            return doc(db, 'escolas', escolaAtualId, colecaoPorNivel[selecionado.nivel], selecionado.id);
        }

        function renderizarPainelAuxiliar() {
            const container = document.getElementById('plPainelAuxiliar');
            if (unsubHistoricoAtual) { unsubHistoricoAtual(); unsubHistoricoAtual = null; }

            if (!selecionado) {
                container.innerHTML = '<p class="pl-estado-vazio">Nada selecionado ainda.</p>';
                return;
            }

            let htmlBNCC = '';
            if (selecionado.nivel === 'aula' && !selecionado.id.startsWith('novo:')) {
                const aula = aulasTodas.find(a => a.id === selecionado.id);
                if (aula) {
                    const habilidadesHtml = Array.isArray(aula.habilidades)
                        ? aula.habilidades.map(h => `<div style="font-size:0.78rem;background:var(--pf-gray-100);padding:4px 6px;border-radius:4px;margin-bottom:4px;"><strong>${h.codigo}</strong></div>`).join('')
                        : '';
                    htmlBNCC = `
                        <div class="pl-painel-secao">
                            <h3>📌 BNCC desta aula</h3>
                            <p style="font-size:0.82rem;color:var(--pf-gray-700);margin-bottom:var(--pf-space-2);"><strong>Objeto de Conhecimento:</strong> ${aula.objetoConhecimento || '-'}</p>
                            ${habilidadesHtml}
                        </div>
                    `;
                }
            }

            const ref = refDoSelecionado();
            container.innerHTML = htmlBNCC + `
                <div class="pl-painel-secao">
                    <h3>🕒 Histórico de Versões</h3>
                    <div id="plHistoricoLista">${ref ? '<p class="pl-estado-vazio">Carregando…</p>' : '<p class="pl-estado-vazio">Salve este item para começar a guardar histórico.</p>'}</div>
                </div>
            `;

            if (ref) {
                unsubHistoricoAtual = ouvirHistorico(ref, (snapshot) => {
                    historicoAtual = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderizarListaHistorico();
                });
            }
        }

        function renderizarListaHistorico() {
            const container = document.getElementById('plHistoricoLista');
            if (!container) return;
            if (historicoAtual.length === 0) {
                container.innerHTML = '<p class="pl-estado-vazio">Nenhuma versão anterior ainda.</p>';
                return;
            }
            container.innerHTML = historicoAtual.map(v => {
                const data = v._versionadoEm ? new Date(v._versionadoEm) : null;
                const rotulo = data
                    ? `${String(data.getDate()).padStart(2, '0')}/${String(data.getMonth() + 1).padStart(2, '0')} ${String(data.getHours()).padStart(2, '0')}:${String(data.getMinutes()).padStart(2, '0')}`
                    : 'Versão anterior';
                return `
                    <div class="pl-historico-item">
                        <span>${rotulo}</span>
                        <button class="pf-btn pf-btn--secondary" style="font-size:0.72rem;padding:4px 8px;" onclick="restaurarVersaoAtual('${v.id}')">Restaurar</button>
                    </div>
                `;
            }).join('');
        }

        window.restaurarVersaoAtual = async function (versaoId) {
            if (!confirm('Restaurar esta versão? O estado atual também será salvo no histórico antes de ser substituído.')) return;
            const versao = historicoAtual.find(v => v.id === versaoId);
            const ref = refDoSelecionado();
            if (!versao || !ref) return;
            // "id" aqui é o id do PRÓPRIO item de histórico (subcoleção), não da
            // entidade principal — precisa ser removido antes de regravar, senão
            // corrompe o campo id da entidade (usado por toda a árvore/serviços).
            const { id, ...dadosParaRestaurar } = versao;
            try {
                await restaurarVersao(ref, dadosParaRestaurar);
                mostrarMensagem('Versão restaurada!', 'success');
            } catch (erro) {
                mostrarMensagem('Erro ao restaurar: ' + erro.message, 'error');
            }
        };

        // ---------- Importação de Planejamento via DOCX ----------
        // Detecta quais séries conhecidas (TURMAS_DISPONIVEIS) aparecem citadas
        // no texto bruto de "Turma" do documento (ex: "6º e 9° Ano" → ambas) —
        // aceita "º"/"°" (o modelo de referência usa os dois no mesmo campo).
        function detectarSeriesNoTexto(texto) {
            if (!texto) return [];
            return TURMAS_DISPONIVEIS.filter(serie => {
                const numero = serie.match(/^(\d+)/)[1];
                const re = new RegExp('\\b' + numero + '\\s*[ºo°]', 'i');
                return re.test(texto);
            });
        }

        // Acha em qual bimestre configurado uma data EXATA cai (não só o
        // mês-calendário dela) — um mesmo mês pode pertencer a 2 bimestres
        // diferentes (ex: 2º Bimestre termina 21/07, 3º começa 22/07 — "Julho"
        // existe como mês do 2º E do 3º bimestre). Achar o bimestre só pelo
        // (ano, mês), sem olhar o dia, gruda tudo no primeiro bimestre que
        // encosta naquele mês — por isso qualquer resolução de bimestre a
        // partir de uma data real tem que passar por aqui, com o dia incluído.
        function bimestreDaData(data) {
            const cfg = bimestresConfig.find(b => {
                const inicio = stringParaData(b.inicio);
                const fim = stringParaData(b.fim);
                fim.setHours(23, 59, 59, 999);
                return data >= inicio && data <= fim;
            });
            return cfg ? cfg.numero : null;
        }

        // "DD/MM" -> "YYYY-MM-DD", pra guardar como dataReferencia da aula
        // (ordenação cronológica dentro do mês — comparação de string simples
        // já funciona nesse formato) e pra exibir na árvore/lista.
        function dataInicioComoISO(diaMesStr) {
            if (!diaMesStr) return null;
            const [dia, mes] = diaMesStr.split('/').map(Number);
            if (!dia || !mes) return null;
            const d = new Date(anoLetivoAtual, mes - 1, dia);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        // "diaMes" no formato "DD/MM" (sem ano, como vem do documento) — combina
        // com o Ano Letivo já selecionado na barra superior pra achar em qual
        // bimestre configurado a data cai. Só sugestão, sempre editável.
        function sugerirBimestreParaData(diaMes) {
            if (!diaMes) return null;
            const [dia, mes] = diaMes.split('/').map(Number);
            if (!dia || !mes) return null;
            return bimestreDaData(new Date(anoLetivoAtual, mes - 1, dia));
        }

        // Conta, por (mês-calendário + bimestre), quantas aulas reais a TURMA
        // tem na grade horária dentro do intervalo [dataInicioStr, dataFimStr]
        // (ambos "DD/MM", sem ano — combinados com o Ano Letivo da barra
        // superior). O bimestre entra na chave (não só o mês) porque um mesmo
        // mês pode ser "Julho do 2º Bimestre" ou "Julho do 3º Bimestre" —
        // contar só por mês juntaria os dois incorretamente. Existe porque uma
        // semana de planejamento pode cair em 2 meses e/ou 2 bimestres (ex:
        // 21/07 a 24/07, atravessando a fronteira do 2º pro 3º) e cada turma
        // tem dias de aula diferentes na grade — o vínculo "certo" é aquele em
        // que a turma realmente tem mais aulas naquele intervalo.
        const DIA_SEMANA_PARA_CHAVE_GRADE = { 1: 'segunda', 2: 'terca', 3: 'quarta', 4: 'quinta', 5: 'sexta' };

        function contarSessoesPorMesEBimestre(turma, dataInicioStr, dataFimStr) {
            const mapa = new Map(); // chave "ano-mes-bimestre" -> nº de aulas da turma
            if (!gradeHorarios || !dataInicioStr || !dataFimStr) return mapa;

            const [diaIni, mesIni] = dataInicioStr.split('/').map(Number);
            const [diaFim, mesFim] = dataFimStr.split('/').map(Number);
            if (!diaIni || !mesIni || !diaFim || !mesFim) return mapa;

            // Semana virando o ano (ex: 29/12 a 03/01) — o fim cai no ano seguinte.
            const anoFim = mesFim < mesIni ? anoLetivoAtual + 1 : anoLetivoAtual;
            const inicio = new Date(anoLetivoAtual, mesIni - 1, diaIni);
            const fim = new Date(anoFim, mesFim - 1, diaFim);
            const linhasGrade = PERIODOS_GRADE.flatMap(periodo => gradeHorarios[periodo] || []);

            const cursor = new Date(inicio);
            while (cursor <= fim) {
                const chaveDia = DIA_SEMANA_PARA_CHAVE_GRADE[cursor.getDay()];
                if (chaveDia) {
                    const sessoesNoDia = linhasGrade.filter(l => l[chaveDia] === turma).length;
                    if (sessoesNoDia > 0) {
                        const bimestre = bimestreDaData(cursor) || 0;
                        const chave = `${cursor.getFullYear()}-${cursor.getMonth() + 1}-${bimestre}`;
                        mapa.set(chave, (mapa.get(chave) || 0) + sessoesNoDia);
                    }
                }
                cursor.setDate(cursor.getDate() + 1);
            }
            return mapa;
        }

        // Escolhe o mês-calendário E o bimestre certos pra uma semana
        // importada, pra ESTA turma. Sem grade configurada (ou turma não
        // encontrada nela), cai na data de início — única informação
        // confiável que sobra, mas ainda resolvendo o bimestre pelo dia exato.
        function escolherMesDaSemana(turma, dataInicioStr, dataFimStr) {
            const porMesEBimestre = contarSessoesPorMesEBimestre(turma, dataInicioStr, dataFimStr);
            if (porMesEBimestre.size === 0) {
                const [dia, mes] = (dataInicioStr || '').split('/').map(Number);
                if (!dia || !mes) return null;
                return { ano: anoLetivoAtual, mes, bimestre: bimestreDaData(new Date(anoLetivoAtual, mes - 1, dia)) };
            }
            // Map preserva ordem de inserção (cronológica, dia a dia) — em caso
            // de empate na contagem, a entrada já vista primeiro (mais cedo)
            // permanece, então só troca o "melhor" em empate estrito de maior.
            let melhor = null;
            porMesEBimestre.forEach((contagem, chave) => {
                if (!melhor || contagem > melhor.contagem) {
                    const [ano, mes, bimestre] = chave.split('-').map(Number);
                    melhor = { ano, mes, bimestre: bimestre || null, contagem };
                }
            });
            return { ano: melhor.ano, mes: melhor.mes, bimestre: melhor.bimestre };
        }

        // Busca (ou cria, se ainda não existir) o planejamento mensal de uma
        // turma/bimestre/mês — usado pra vincular aulas importadas sem exigir
        // que o professor tenha criado o mês manualmente antes. cache evita
        // recriar o mesmo mês repetidas vezes quando várias semanas da mesma
        // turma caem no mesmo mês.
        async function obterOuCriarMensalId(cache, turma, bimestre, mes) {
            if (!bimestre || !mes) return null;
            const chave = `${turma}|${bimestre}|${mes}`;
            if (cache.has(chave)) return cache.get(chave);

            const existente = planejamentosMensais.find(p =>
                p.turma === turma && p.anoLetivo === anoLetivoAtual && p.bimestre === bimestre && p.mes === mes);
            if (existente) {
                cache.set(chave, existente.id);
                return existente.id;
            }

            const bimestral = planejamentosBimestrais.find(p =>
                p.turma === turma && p.anoLetivo === anoLetivoAtual && p.bimestre === bimestre);
            const ref = await criarPlanejamentoMensal(escolaAtualId, {
                turma, anoLetivo: anoLetivoAtual, bimestre, mes,
                planejamentoBimestralId: bimestral ? bimestral.id : null,
                objetivos: '', conteudos: '', observacoes: ''
            });
            cache.set(chave, ref.id);
            return ref.id;
        }

        document.getElementById('inputArquivoDocx').addEventListener('change', async (evento) => {
            const file = evento.target.files[0];
            evento.target.value = '';
            if (!file) return;
            mostrarMensagem('Lendo o arquivo...', 'info');
            try {
                const extraido = await parseArquivoDocxPlanejamento(file);
                prepararRevisaoImportacao(file, extraido);
            } catch (erro) {
                console.error(erro);
                mostrarMensagem('Erro ao ler o arquivo: ' + erro.message, 'error');
            }
        });

        // Séries que já têm uma aula com este título exato — o título de uma
        // semana importada é determinístico (numero + datas), então
        // reimportar o MESMO arquivo gera o MESMO título, e isso é sinal
        // confiável de "já importei essa semana pra essa série antes". Não é
        // um bloqueio: só usado pra decidir o estado inicial do checkbox e
        // avisar o professor — se ele marcar de novo, duplica de propósito.
        function seriesComAulaImportada(titulo) {
            return aulasTodas.filter(a => a.titulo === titulo).map(a => a.turma);
        }

        function prepararRevisaoImportacao(file, extraido) {
            const seriesDetectadas = detectarSeriesNoTexto(extraido.turmaTexto);
            const candidatosBNCC = sugerirClassificacaoBNCC(extraido.codigosBNCC, extraido.especificacoesExtraidas);

            // Junta cada código com a descrição já extraída do texto de
            // "Habilidades:" do documento (não inventa descrição nova).
            const habilidades = (extraido.codigosBNCC || []).map(codigo => {
                const linha = (extraido.habilidadesTexto || []).find(l => l.startsWith(codigo));
                const descricao = linha ? linha.slice(codigo.length).replace(/^[\s-]+/, '') : '';
                return { codigo, descricao };
            });

            importacaoAtual = {
                arquivo: file,
                arquivoNome: extraido.arquivoNome,
                periodo: extraido.periodo,
                areaConhecimento: extraido.areaConhecimento,
                componenteCurricular: extraido.componenteCurricular,
                docente: extraido.docente,
                coordenador: extraido.coordenador,
                turmaTexto: extraido.turmaTexto,
                series: (seriesDetectadas.length > 0 ? seriesDetectadas : TURMAS_DISPONIVEIS).map(s => ({ serie: s, marcada: seriesDetectadas.includes(s) })),
                candidatosBNCC,
                candidatoEscolhidoIndex: candidatosBNCC.length > 0 ? 0 : -1,
                habilidades,
                objetoConhecimento: extraido.objetoConhecimento,
                procedimentos: extraido.procedimentos,
                recursos: extraido.recursos,
                semanas: (extraido.semanas || []).map(s => {
                    const bimestreInicio = sugerirBimestreParaData(s.dataInicio);
                    const bimestreFim = sugerirBimestreParaData(s.dataFim);
                    const titulo = `Semana ${s.numero} — ${s.dataInicio} a ${s.dataFim}`;
                    // Redundante = TODAS as séries detectadas já têm uma aula
                    // com esse título — sinal de que essa semana já foi
                    // importada antes pra elas. Desmarca por padrão pra não
                    // duplicar sem querer; o professor pode remarcar se quiser
                    // reimportar de propósito (ex: corrigiu o arquivo).
                    const seriesJaImportadas = seriesComAulaImportada(titulo);
                    const redundante = seriesDetectadas.length > 0 &&
                        seriesDetectadas.every(serie => seriesJaImportadas.includes(serie));
                    return {
                        numero: s.numero,
                        dataInicio: s.dataInicio,
                        dataFim: s.dataFim,
                        titulo,
                        descricaoCompleta: s.atividades.map(a => `${a.titulo}: ${a.descricao.join(' ')}`).join('\n\n'),
                        numeroAulas: 1,
                        incluida: !redundante,
                        bimestreSugerido: bimestreInicio,
                        // A semana cruza a fronteira entre 2 bimestres (ex: data
                        // de início no 2º Bimestre, data de fim já no 3º) — a
                        // vinculação automática decide pelo bimestre com mais
                        // aulas de fato na grade, mas o professor precisa saber
                        // que essa semana é ambígua ANTES de aprovar.
                        cruzaBimestre: bimestreInicio !== null && bimestreFim !== null && bimestreInicio !== bimestreFim
                    };
                })
            };

            selecionado = null;
            renderizarAreaPrincipal();
            renderizarPainelAuxiliar();
            renderizarArvore();
        }

        // Recolhe tudo que o professor pode ter editado nos campos da tela de
        // revisão antes de re-renderizar (toggle de série/semana) ou salvar —
        // sem isso, um clique num checkbox jogaria fora texto já corrigido.
        function capturarEdicoesImportacao() {
            if (!importacaoAtual) return;
            const objEl = document.getElementById('impObjetoConhecimento');
            const procEl = document.getElementById('impProcedimentos');
            const recEl = document.getElementById('impRecursos');
            if (objEl) importacaoAtual.objetoConhecimento = objEl.value;
            if (procEl) importacaoAtual.procedimentos = procEl.value;
            if (recEl) importacaoAtual.recursos = recEl.value;
            importacaoAtual.semanas.forEach((s, i) => {
                const tituloEl = document.getElementById(`impSemanaTitulo${i}`);
                const descEl = document.getElementById(`impSemanaDescricao${i}`);
                const numEl = document.getElementById(`impSemanaNumAulas${i}`);
                if (tituloEl) s.titulo = tituloEl.value;
                if (descEl) s.descricaoCompleta = descEl.value;
                if (numEl) s.numeroAulas = parseInt(numEl.value, 10) || 1;
            });
        }

        function renderizarRevisaoImportacao(container) {
            const imp = importacaoAtual;
            const seriesMarcadas = imp.series.filter(s => s.marcada).length;
            const semanasIncluidas = imp.semanas.filter(s => s.incluida).length;
            const podeSalvar = seriesMarcadas > 0 && semanasIncluidas > 0;

            container.innerHTML = `
                <h2>📄 Revisão da Importação — ${imp.arquivoNome}</h2>
                <p class="pl-indicador">Confira e corrija os campos abaixo antes de aprovar. Nada é salvo até "Aprovar e Salvar".</p>

                <div class="pf-field">
                    <label>Período informado no cabeçalho do documento (só referência — as datas reais são as das semanas abaixo)</label>
                    <input type="text" value="${(imp.periodo || '-').replace(/"/g, '&quot;')}" readonly style="background:var(--pf-gray-100);">
                </div>
                <div class="pf-field">
                    <label>Série(s) detectada(s) no texto "${imp.turmaTexto || '-'}" — marque as que devem gerar aulas *</label>
                    <div>${imp.series.map((s, i) => `
                        <label class="pl-unidade-checkbox">
                            <input type="checkbox" onchange="alternarSerieImportacao(${i})" ${s.marcada ? 'checked' : ''}> ${s.serie}
                        </label>
                    `).join('')}</div>
                </div>
                <div class="pf-field">
                    <label>Classificação BNCC sugerida</label>
                    ${imp.candidatosBNCC.length > 0 ? `
                        <select id="impCandidatoBNCC" onchange="escolherCandidatoBNCC(this.value)">
                            ${imp.candidatosBNCC.map((c, i) => `<option value="${i}" ${i === imp.candidatoEscolhidoIndex ? 'selected' : ''}>${c.unidade} — ${c.especificacao} (${c.serie})</option>`).join('')}
                        </select>
                    ` : '<p class="pl-estado-vazio">Nenhuma combinação da BNCC bateu com os códigos extraídos — pode ajustar depois em cada aula.</p>'}
                </div>
                <div class="pf-field">
                    <label>Habilidades detectadas</label>
                    <div class="habilidades-container">
                        ${imp.habilidades.length > 0 ? imp.habilidades.map(h => `<div class="habilidade-checkbox"><label><strong>${h.codigo}</strong> — ${h.descricao || '(sem descrição extraída)'}</label></div>`).join('') : '<p style="color:#666;text-align:center;">Nenhum código encontrado no documento.</p>'}
                    </div>
                </div>
                <div class="pf-field">
                    <label>Objeto de Conhecimento</label>
                    <textarea id="impObjetoConhecimento" rows="3">${imp.objetoConhecimento || ''}</textarea>
                </div>
                <div class="pf-field">
                    <label>Descrição / Metodologia</label>
                    <textarea id="impProcedimentos" rows="3">${imp.procedimentos || ''}</textarea>
                </div>
                <div class="pf-field">
                    <label>Recursos Didáticos</label>
                    <textarea id="impRecursos" rows="2">${imp.recursos || ''}</textarea>
                </div>

                <h3 style="margin-top:var(--pf-space-4);margin-bottom:var(--pf-space-2);font-size:0.95rem;">Semanas detectadas (${imp.semanas.length}) — cada uma vira uma aula por série marcada acima</h3>
                ${imp.semanas.map((s, i) => {
                    const seriesMarcadasAgora = imp.series.filter(x => x.marcada).map(x => x.serie);
                    const seriesJaImportadas = seriesComAulaImportada(s.titulo).filter(serie => seriesMarcadasAgora.includes(serie));
                    return `
                    <div class="pf-card" style="margin-bottom:var(--pf-space-2);">
                        <label style="display:flex;align-items:center;gap:6px;font-weight:600;">
                            <input type="checkbox" onchange="alternarSemanaImportacao(${i})" ${s.incluida ? 'checked' : ''}> Semana ${s.numero} (${s.dataInicio} a ${s.dataFim})${s.bimestreSugerido ? ` — sugestão: ${s.bimestreSugerido}º Bimestre` : ''}
                        </label>
                        ${s.cruzaBimestre ? `<p style="color:var(--pf-danger);font-size:0.8rem;font-weight:600;margin:2px 0 0;">⚠️ Essa semana atravessa a fronteira entre bimestres — confira o mês/bimestre da aula depois de importar.</p>` : ''}
                        ${seriesJaImportadas.length > 0 ? `<p style="color:var(--pf-gray-500);font-size:0.8rem;margin:2px 0 0;">🔁 Já importada para: ${seriesJaImportadas.join(', ')} — mantendo marcada vai criar aula(s) duplicada(s) pra ${seriesJaImportadas.length > 1 ? 'essas séries' : 'essa série'}.</p>` : ''}
                        <div class="pf-field">
                            <label>Título</label>
                            <input type="text" id="impSemanaTitulo${i}" value="${s.titulo.replace(/"/g, '&quot;')}">
                        </div>
                        <div class="pf-field">
                            <label>Descrição</label>
                            <textarea id="impSemanaDescricao${i}" rows="3">${s.descricaoCompleta}</textarea>
                        </div>
                        <div class="pf-field">
                            <label>Quantidade de Aulas</label>
                            <input type="number" id="impSemanaNumAulas${i}" min="1" max="10" value="${s.numeroAulas}" style="width:80px;">
                        </div>
                    </div>
                `;
                }).join('')}

                <div class="pl-acoes">
                    <button class="pf-btn pf-btn--success" onclick="aprovarESalvarImportacao()" ${podeSalvar ? '' : 'disabled'}>✅ Aprovar e Salvar</button>
                    <button class="pf-btn pf-btn--secondary" onclick="cancelarImportacao()">Cancelar</button>
                </div>
                ${!podeSalvar ? '<p style="font-size:0.78rem;color:var(--pf-danger);margin-top:var(--pf-space-2);">Marque ao menos 1 série e 1 semana pra habilitar o salvamento.</p>' : ''}
            `;
        }

        window.alternarSerieImportacao = function (i) {
            capturarEdicoesImportacao();
            importacaoAtual.series[i].marcada = !importacaoAtual.series[i].marcada;
            renderizarAreaPrincipal();
        };

        window.escolherCandidatoBNCC = function (indice) {
            importacaoAtual.candidatoEscolhidoIndex = parseInt(indice, 10);
        };

        window.alternarSemanaImportacao = function (i) {
            capturarEdicoesImportacao();
            importacaoAtual.semanas[i].incluida = !importacaoAtual.semanas[i].incluida;
            renderizarAreaPrincipal();
        };

        window.cancelarImportacao = function () {
            importacaoAtual = null;
            renderizarAreaPrincipal();
            renderizarPainelAuxiliar();
        };

        window.aprovarESalvarImportacao = async function () {
            capturarEdicoesImportacao();
            const imp = importacaoAtual;
            const seriesMarcadas = imp.series.filter(s => s.marcada).map(s => s.serie);
            const semanasIncluidas = imp.semanas.filter(s => s.incluida);
            if (seriesMarcadas.length === 0 || semanasIncluidas.length === 0) {
                mostrarMensagem('Marque ao menos 1 série e 1 semana.', 'error');
                return;
            }

            const candidato = imp.candidatoEscolhidoIndex >= 0 ? imp.candidatosBNCC[imp.candidatoEscolhidoIndex] : null;
            mostrarMensagem('Salvando importação...', 'info');

            try {
                // 1) cria o registro da importação primeiro — as aulas (passo 2)
                // referenciam o id dele em origemImportacao.
                const refImportacao = await criarImportacaoPlanejamento(escolaAtualId, {
                    arquivoNome: imp.arquivoNome,
                    importadoPorUid: uidAtual,
                    aulasGeradas: [],
                    camposExtraidos: {
                        periodo: imp.periodo,
                        areaConhecimento: imp.areaConhecimento,
                        componenteCurricular: imp.componenteCurricular,
                        docente: imp.docente,
                        coordenador: imp.coordenador,
                        turmaTexto: imp.turmaTexto
                    }
                });

                // 2) uma aula por semana incluída × série marcada — vinculada
                // ao mês em que a série tem de fato mais aulas naquele
                // intervalo (contarSessoesPorMesEBimestre/escolherMesDaSemana),
                // não simplesmente ao mês/bimestre da data de início da semana.
                const aulasGeradasIds = [];
                const cacheMensais = new Map();
                for (const serie of seriesMarcadas) {
                    for (const semana of semanasIncluidas) {
                        const mesEscolhido = escolherMesDaSemana(serie, semana.dataInicio, semana.dataFim);
                        const bimestre = mesEscolhido ? mesEscolhido.bimestre : null;
                        const planejamentoMensalId = mesEscolhido
                            ? await obterOuCriarMensalId(cacheMensais, serie, bimestre, mesEscolhido.mes)
                            : null;

                        const aulaData = {
                            titulo: semana.titulo,
                            turma: serie,
                            unidadeTematica: candidato ? candidato.unidade : '',
                            especificacao: candidato ? candidato.especificacao : null,
                            objetoConhecimento: imp.objetoConhecimento || '',
                            habilidades: imp.habilidades,
                            numeroAulas: semana.numeroAulas,
                            descricao: semana.descricaoCompleta,
                            recursos: imp.recursos || null,
                            atividadesVinculadas: [],
                            bimestre: bimestre || semana.bimestreSugerido || null,
                            planejamentoMensalId,
                            dataReferencia: dataInicioComoISO(semana.dataInicio),
                            componenteCurricular: COMPONENTE_CURRICULAR_PADRAO,
                            origemImportacao: { importacaoId: refImportacao.id },
                            timestamp: new Date().toISOString()
                        };
                        const refAula = await criarAula(escolaAtualId, aulaData);
                        aulasGeradasIds.push(refAula.id);
                    }
                }

                // 3) fecha o registro da importação com as aulas geradas
                await atualizarImportacaoPlanejamento(escolaAtualId, refImportacao.id, {
                    aulasGeradas: aulasGeradasIds
                });

                mostrarMensagem(`${aulasGeradasIds.length} aula(s) importada(s) com sucesso!`, 'success');
                importacaoAtual = null;
                selecionado = null;
                renderizarAreaPrincipal();
                renderizarPainelAuxiliar();
            } catch (erro) {
                console.error(erro);
                mostrarMensagem('Erro ao salvar importação: ' + erro.message, 'error');
            }
        };
    </script>
</body>
</html>
